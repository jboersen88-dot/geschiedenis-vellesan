<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Online oefentoets · Geschiedenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1f5f4e;--green-2:#174a3d;--coral:#ff8d90;--berry:#c2484d;--teal:#2f8f86;--bg:#f6f0e6;--card:#fffdf9;--ink:#201a14;--muted:#6f6556;--line:#e6dac4;--ok:#1d8a5a;--ok-soft:#e1f4ea;--bad:#c0392b;--bad-soft:#fbe9e7;--sel:#e7f3ef;
--ease-out:cubic-bezier(.23,1,.32,1);--shadow:0 1px 2px rgba(31,95,78,.06),0 10px 28px rgba(31,95,78,.08)}
:root[data-theme=dark]{--bg:#17201d;--card:#1f2b27;--ink:#f2ece0;--muted:#a79f90;--line:#34433d;--ok-soft:#183a2b;--bad-soft:#44201c;--sel:#23423a;--green:#8fd3bd}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17201d;--card:#1f2b27;--ink:#f2ece0;--muted:#a79f90;--line:#34433d;--ok-soft:#183a2b;--bad-soft:#44201c;--sel:#23423a;--green:#8fd3bd}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 96px}
h1,h2{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em;line-height:1.15;color:var(--green);margin:0}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:22px;margin:34px 0 12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--berry)}
.muted{color:var(--muted)}
a{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:600 15px Inter,sans-serif;background:var(--berry);color:#fff;cursor:pointer;text-decoration:none;min-height:44px;transition:transform .16s var(--ease-out),filter .16s var(--ease-out),background-color .16s var(--ease-out);touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
@media(hover:hover) and (pointer:fine){.btn:hover:not(:disabled){filter:brightness(1.07)}.btn.ghost:hover{border-color:var(--berry)}}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}
.pick{display:grid;gap:14px;margin-top:22px}
.pk{display:grid;grid-template-columns:1fr auto;gap:6px 14px;text-align:left;padding:18px 20px;cursor:pointer;color:inherit;font:inherit;transition:transform .2s var(--ease-out),border-color .2s var(--ease-out)}
.pk b{font:700 19px Fraunces,serif;color:var(--green)}
.pk small{grid-column:1;color:var(--muted)}
.pk .go{grid-row:1/3;grid-column:2;align-self:center;font-weight:700;color:var(--berry)}
.pk:active{transform:scale(.99)}
@media(hover:hover) and (pointer:fine){.pk:hover{transform:translateY(-2px);border-color:var(--coral)}}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:10px 16px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .t{font:700 22px Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--green);min-width:70px}
.bar .t.low{color:var(--bad)}
.bar .pr{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .pr i{display:block;height:100%;width:0;background:var(--teal);transform-origin:left;transition:width .3s var(--ease-out)}
.bar small{color:var(--muted);white-space:nowrap}
.q{margin-top:16px}
.q .n{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--berry)}
.q p{margin:4px 0 14px;font-weight:600;font-size:17px;text-wrap:pretty}
.opts{display:grid;gap:.9rem}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font:500 16px/1.4 Inter,sans-serif;color:inherit;cursor:pointer;min-height:52px;transition:border-color .16s var(--ease-out),background-color .16s var(--ease-out),transform .16s var(--ease-out);touch-action:manipulation}
.opt .l{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:14px;color:var(--ink);transition:background-color .16s var(--ease-out),color .16s}
.opt:active{transform:scale(.99)}
.opt[aria-checked=true]{border-color:var(--teal);background:var(--sel)}
.opt[aria-checked=true] .l{background:var(--teal);color:#fff}
@media(hover:hover) and (pointer:fine){.opt:not([disabled]):hover{border-color:var(--coral)}}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:16px/1.5 Inter,sans-serif;background:var(--card);color:var(--ink);resize:vertical;transition:border-color .16s}
textarea:focus{border-color:var(--teal);outline:none}
.bron{border-left:4px solid var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--card));border-radius:0 12px 12px 0;padding:12px 14px;margin:6px 0 12px;font-size:15px}
.bron table{border-collapse:collapse;margin-top:6px}.bron td{border:1px solid var(--line);padding:5px 10px}
.fb{margin-top:10px;font-size:15px;color:var(--muted)}
.res{text-align:center;padding:26px 20px}
.grade{font:700 clamp(56px,14vw,88px) Fraunces,serif;line-height:1;color:var(--green)}
.grade.bad{color:var(--bad)}
.nk{margin-top:12px;display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok);flex:none}
.chk span{flex:1}
.chk small{color:var(--muted);white-space:nowrap}
.mine{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.mine:empty:before{content:"Niet beantwoord";color:var(--muted)}
.aibox:empty{display:none}.aibox{margin-top:4px}.aiwait{margin-top:12px;font-size:14px;color:var(--muted)}.aiwait:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid var(--teal);border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.aiwait:before{animation:none}}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.stepper button{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:700 16px Inter;cursor:pointer;color:inherit}
.stepper button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.stick{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;z-index:9}
[hidden]{display:none!important}
.fade{animation:in .28s var(--ease-out) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data/toetsen.js"></script>
<script src="ai.js"></script>
<script src="nakijker.js"></script>
<script>
(function(){
"use strict";
var KEY="gv-toets-v1",D=window.TOETSEN,app=document.getElementById("app"),st={},cur=null,timer=null;
function load(){try{st=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){st={};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function perm(n){var a=[0,1,2,3];for(var i=3;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mcWarn(k){D[k].mc.forEach(function(q,i){var ln=q.o.map(function(x){return x.length;}),mx=Math.max.apply(null,ln),mn=Math.min.apply(null,ln);
  if(q.o.length!==4)console.warn("[meerkeuze] "+k+" vraag "+(i+1)+": "+q.o.length+" opties");
  else if(mx>20&&mx/mn>1.5)console.warn("[meerkeuze] "+k+" vraag "+(i+1)+": "+(mx/mn).toFixed(2)+"x");});}
Object.keys(D).forEach(mcWarn);
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
function maxPts(k){return D[k].mc.length+D[k].open.reduce(function(a,o){return a+o.p;},0);}

/* ---------- keuzescherm ---------- */
function home(){
  clearInterval(timer);cur=null;
  var h='<a class="muted" href="app.html#toets">← Terug naar de leeromgeving</a><div class="eyebrow" style="margin-top:22px">Test jezelf</div><h1>Online oefentoets</h1><p class="muted" style="max-width:560px;margin:10px 0 0">Zonder boek en zonder hulp. De klok loopt. Aan het einde kijkt de meerkeuze zichzelf na en kijk je de open vragen na met het nakijkblad. Je antwoorden blijven op dit apparaat bewaard.</p><div class="pick">';
  Object.keys(D).forEach(function(k){var a=st[k],sub=maxPts(k)+" punten · "+D[k].min+" minuten · "+D[k].mc.length+" meerkeuze + "+D[k].open.length+" open";
    var go=a?(a.done?"Bekijk resultaat":"Ga verder"):"Start";
    h+='<button class="card pk" data-k="'+k+'"><b>Oefentoets '+D[k].t.replace("Oefentoets ","")+'</b><span class="go">'+go+' →</span><small>'+sub+'</small></button>';});
  app.innerHTML=h+"</div>";
}
app.addEventListener("click",function(e){
  var p=e.target.closest(".pk");if(p){open(p.dataset.k);return;}
  var o=e.target.closest(".opt");if(o&&!o.disabled){var q=+o.dataset.q;st[cur].mc[q]=+o.dataset.i;save();
    o.parentNode.querySelectorAll(".opt").forEach(function(x){x.setAttribute("aria-checked",x===o?"true":"false");});prog();return;}
  if(e.target.closest("#home")){home();return;}
  if(e.target.closest("#hand")){var miss=missing();if(!miss||confirm("Je hebt "+miss+" vraag"+(miss>1?"en":"")+" nog niet beantwoord. Toch inleveren?"))finish();return;}
  if(e.target.closest("#again")){if(confirm("Opnieuw beginnen? Je antwoorden en cijfer van deze toets worden gewist."))start(cur,true);return;}
  var rt=e.target.closest("[data-retry]");if(rt){delete st[cur].ai[rt.dataset.retry];save();result();return;}
  var s=e.target.closest("[data-pt]");if(s){var nr=s.dataset.nr;st[cur].self[nr]=+s.dataset.pt;save();result();return;}
});
app.addEventListener("change",function(e){var c=e.target.closest("[data-g]");if(c){var a=st[cur].self[c.dataset.nr];a=Array.isArray(a)?a:[];a[+c.dataset.g]=c.checked?1:0;st[cur].self[c.dataset.nr]=a;save();score();}});
app.addEventListener("input",function(e){var t=e.target.closest("textarea[data-o]");if(t){st[cur].open[t.dataset.o]=t.value;save();prog();}});

function open(k){cur=k;var a=st[k];if(!a)return start(k,true);if(a.done)return result();if(Date.now()>=a.end)return finish();exam();}
function start(k,fresh){cur=k;st[k]={mc:{},open:{},self:{},perm:D[k].mc.map(perm),end:Date.now()+D[k].min*60000,done:false};save();exam();window.scrollTo(0,0);}
function missing(){var a=st[cur],n=0;D[cur].mc.forEach(function(q,i){if(a.mc[i]==null)n++;});D[cur].open.forEach(function(o){if(!(a.open[o.nr]||"").trim())n++;});return n;}
function total(){return D[cur].mc.length+D[cur].open.length;}
function prog(){var n=total()-missing();var b=document.getElementById("pr");if(b){b.style.width=(n/total()*100)+"%";document.getElementById("pn").textContent=n+"/"+total();}}

/* ---------- toets maken ---------- */
function bronHtml(b){var L=b.split("\n"),h="",tb=[];L.forEach(function(l,i){if(l.indexOf(" | ")>-1||/^ ?\|/.test(l))tb.push(l.split("|"));else{if(tb.length){h+=tbl(tb);tb=[];}h+=(i===0?"<b>":"<div>")+esc(l)+(i===0?"</b>":"</div>");}});if(tb.length)h+=tbl(tb);return '<div class="bron">'+h+"</div>";}
function tbl(r){return "<table>"+r.map(function(c){return "<tr>"+c.map(function(x){return "<td>"+esc(x.trim())+"</td>";}).join("")+"</tr>";}).join("")+"</table>";}
function qtext(v){return esc(v).split("\n").join("<br>");}
function exam(){
  var d=D[cur],a=st[cur],n=0;
  var h='<div class="bar"><span class="t" id="clk">--:--</span><div class="pr"><i id="pr"></i></div><small id="pn"></small></div><div class="eyebrow" style="margin-top:18px">Oefentoets</div><h1>'+esc(d.t.replace("Oefentoets ","Toets "))+'</h1><p class="muted">'+maxPts(cur)+' punten · '+d.min+' minuten · zonder boek. Meerkeuze: kies één antwoord. Open vragen: schrijf in hele zinnen.</p><h2>Deel A · Meerkeuze</h2>';
  d.mc.forEach(function(q,i){n++;h+='<div class="card q fade" style="animation-delay:'+Math.min(i,8)*30+'ms"><div class="n">Vraag '+n+' · 1 punt</div><p>'+esc(q.v)+'</p><div class="opts" role="radiogroup" aria-label="Antwoorden">';
    a.perm[i].forEach(function(oi,pos){h+='<button class="opt" role="radio" aria-checked="'+(a.mc[i]===oi)+'" data-q="'+i+'" data-i="'+oi+'"><span class="l">'+"ABCD"[pos]+'</span><span>'+esc(q.o[oi])+'</span></button>';});
    h+="</div></div>";});
  h+='<h2>Deel B · Open vragen</h2>';
  d.open.forEach(function(o){h+='<div class="card q"><div class="n">Vraag '+o.nr+' · '+o.p+' punt'+(o.p>1?"en":"")+'</div>'+(o.b?bronHtml(o.b):"")+'<p>'+qtext(o.v)+'</p><textarea data-o="'+o.nr+'" aria-label="Antwoord vraag '+o.nr+'" placeholder="Typ hier je antwoord">'+esc(a.open[o.nr]||"")+'</textarea></div>';});
  h+='<div class="stick"><button class="btn" id="hand">Inleveren en nakijken</button></div>';
  app.innerHTML=h;prog();clearInterval(timer);tick();timer=setInterval(tick,1000);
}
function tick(){var c=document.getElementById("clk");if(!c||!cur||!st[cur])return;var s=Math.round((st[cur].end-Date.now())/1000);c.textContent=fmt(s);c.classList.toggle("low",s<300);if(s<=0){clearInterval(timer);alert("De tijd is om. Je toets wordt nu nagekeken.");finish();}}
function finish(){clearInterval(timer);st[cur].done=true;save();result();window.scrollTo(0,0);}

/* ---------- nakijken ---------- */
function mcScore(){var a=st[cur],n=0;D[cur].mc.forEach(function(q,i){if(a.mc[i]===q.j)n++;});return n;}
function openScore(){var a=st[cur],s=0;D[cur].open.forEach(function(o){var v=a.self[o.nr];if(boxed(o)){if(Array.isArray(v))o.g.forEach(function(g,i){if(v[i])s+=g.p;});}else if(typeof v==="number")s+=v;});return s;}
function gradeOf(p,m){return Math.round((p/m*9+1)*10)/10;}
function score(){var m=maxPts(cur),p=mcScore()+openScore(),g=gradeOf(p,m),el=document.getElementById("gr");if(!el)return;
  el.textContent=g.toFixed(1).replace(".",",");el.classList.toggle("bad",g<5.5);document.getElementById("pp").textContent=p%1?p.toFixed(1).replace(".",","):p;
  var n=document.getElementById("gm");n.textContent=g>=8?"Top! Jij bent er klaar voor.":g>=6.5?"Goed bezig. Kijk nog even naar je fouten.":g>=5.5?"Voldoende, maar oefen je zwakke punten nog.":"Nog even oefenen: begin bij het Oefenlab.";}
function boxed(o){return o.g.length>1||(o.g.length===1&&o.p===1);}
function nkHtml(o){var a=st[cur],v=a.self[o.nr],h="";
    if(boxed(o)){h+='<div class="nk">'+o.g.map(function(g,i){return '<label class="chk"><input type="checkbox" data-nr="'+o.nr+'" data-g="'+i+'"'+(Array.isArray(v)&&v[i]?" checked":"")+'><span>'+esc(g.t)+'</span><small>'+g.p+' p</small></label>';}).join("")+"</div>";}
    else{h+='<div class="nk">'+o.m.map(function(x){return '<div class="chk" style="cursor:default"><span>'+esc(x)+'</span></div>';}).join("")+'</div><div class="stepper"><span class="muted">Mijn punten:</span>';
      for(var p=0;p<=o.p;p++)h+='<button data-nr="'+o.nr+'" data-pt="'+p+'" aria-pressed="'+(v===p)+'">'+p+'</button>';h+="</div>";}
  return h+'<div class="aibox" id="ai-'+o.nr+'">'+aiHtml(o)+'</div>';}

/* ---------- AI-nakijker (Haiku 5.5) ---------- */
var HF={t1:["H1","H2"],t2:["H3","H4"],t3:["H1","H2","H3","H4"]},busy={},queue=[],running=0;
function aiHtml(o){var r=(st[cur].ai||{})[o.nr];if(r)return GV_NK.render(r)+(r.status!=="ok"&&GV_NK.enabled?'<button class="btn ghost" data-retry="'+o.nr+'" style="margin-top:8px">Probeer AI-nakijken opnieuw</button>':"");
  return busy[cur+o.nr]?'<div class="aiwait">AI kijkt je antwoord na…</div>':"";}
function aiPunten(o){return o.g.length?o.g.map(function(g){return {t:g.t,p:Math.round(g.p)};}):[{t:o.m.join("\n"),p:o.p}];}
function runAI(){if(!GV_NK.enabled)return;var k=cur,a=st[k];a.ai=a.ai||{};
  D[k].open.forEach(function(o){var ans=(a.open[o.nr]||"").trim();if(!ans||a.ai[o.nr]||busy[k+o.nr])return;busy[k+o.nr]=1;queue.push([k,o,ans.slice(0,2000)]);});
  pump();}
function pump(){while(running<3&&queue.length){running++;(function(j){var k=j[0],o=j[1];
    GV_NK.check({h:HF[k],vraag:o.v.slice(0,1500),punten:aiPunten(o),bron:(o.b||"").slice(0,4000),antwoord:j[2]}).then(function(f){
      delete busy[k+o.nr];running--;
      if(f.status==="ok"){var a=st[k];a.ai[o.nr]=f;
        if(boxed(o))a.self[o.nr]=o.g.map(function(g,i){return f.per_punt[i]&&f.per_punt[i].punten>=f.per_punt[i].max?1:0;});else a.self[o.nr]=f.punten;}
      else if(!f.lokaal||f.melding)st[k].ai[o.nr]={status:"fout",melding:f.melding||""};
      save();
      if(cur===k&&document.getElementById("nk-"+o.nr)){document.getElementById("nk-"+o.nr).innerHTML=nkHtml(o);score();}
      pump();});})(queue.shift());}
  if(cur)D[cur].open.forEach(function(o){var b=document.getElementById("ai-"+o.nr);if(b&&busy[cur+o.nr])b.innerHTML=aiHtml(o);});}

function result(){
  var d=D[cur],a=st[cur],m=maxPts(cur);
  var h='<a class="muted" href="#" id="home">← Andere toets kiezen</a><div class="card res fade" style="margin-top:16px"><div class="eyebrow">Je cijfer (voorlopig, tot je de open vragen hebt nagekeken)</div><div class="grade" id="gr">-</div><p><b id="pp">0</b> van <b>'+m+'</b> punten · meerkeuze '+mcScore()+'/'+d.mc.length+'</p><p class="muted" id="gm" style="margin:0"></p><p class="muted" style="font-size:14px;margin:10px 0 0">Cijfer = punten : '+m+' × 9 + 1. Bij de open vragen kijkt de AI mee; jij kunt de vinkjes nog aanpassen.</p></div><h2>Meerkeuze nagekeken</h2>';
  d.mc.forEach(function(q,i){var ok=a.mc[i]===q.j;h+='<div class="card q"><div class="n">Vraag '+(i+1)+(ok?" · goed":(a.mc[i]==null?" · niet beantwoord":" · fout"))+'</div><p>'+esc(q.v)+'</p><div class="opts">';
    a.perm[i].forEach(function(oi,pos){var c=oi===q.j?" right":(a.mc[i]===oi?" wrong":"");h+='<div class="opt'+c+'" style="cursor:default"><span class="l">'+"ABCD"[pos]+'</span><span>'+esc(q.o[oi])+'</span></div>';});
    h+='</div>'+(q.u?'<div class="fb">'+esc(q.u)+'</div>':"")+'</div>';});
  h+='<h2>Open vragen nakijken</h2>';
  d.open.forEach(function(o){var v=a.self[o.nr];
