  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Waarom ontstond de leerindustrie in de Langstraat in Noord-Brabant?", "goed": "Er was helder stromend water, veel boomschors en genoeg vee", "fout": ["Er waren veel kolenmijnen waar leerlooiers hun brandstof haalden", "Er lag een grote haven waar het leer verscheept werd", "Er woonden veel rijke kooplieden die leer kochten"], "uitleg": "Voor het looien van leer heb je water, schors en huiden nodig."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Wat is leerlooien?", "goed": "Dierenhuiden bewerken en soepel maken, zodat het leer wordt", "fout": ["Schoenen en laarzen repareren die kapot zijn gegaan door het lopen", "Stof van wol weven op een groot weefgetouw in een werkplaats", "Boomschors malen om er papier en karton van te kunnen maken"], "uitleg": "Van het leer werden schoenen en kleding gemaakt."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Wat zorgde ervoor dat schoenmakerijen in Noord-Brabant uitgroeiden tot fabrieken?", "goed": "Een machine (rond 1860) waarmee schoenen sneller en goedkoper werden gemaakt", "fout": ["Een wet die het maken van schoenen thuis helemaal verbood door de overheid", "De aanleg van de eerste spoorlijn die dwars door Brabant liep", "Een grote bestelling van het Nederlandse leger voor veel laarzen"], "uitleg": "Voor schoenmakers was het aantrekkelijk om zo'n machine te kopen."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Wat is arbeidsverdeling in een fabriek?", "goed": "Elke arbeider doet één onderdeel van het werk", "fout": ["Alle arbeiders verdelen het loon eerlijk onder elkaar", "De arbeiders werken om de beurt aan dezelfde machine", "De fabrikant werkt zelf mee op de fabrieksvloer"], "uitleg": "De ene arbeider zet de zool eronder, de andere maakt de hak."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Waar zat de meeste katoenindustrie van Nederland?", "goed": "In Twente", "fout": ["In Tilburg", "In de Zaanstreek", "In Limburg"], "uitleg": "Rond 1900 werkten daar ruim 10.000 arbeiders in 27 weverijen."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Welke stad was het centrum van de wolindustrie?", "goed": "Tilburg", "fout": ["Enschede", "Eindhoven", "Delft"], "uitleg": "Twee derde van alle wolfabrieken zat in Tilburg."},
  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Waarom werden veel katoenen stoffen naar Nederlands-Indië gestuurd?", "goed": "Katoen is luchtig en geschikt voor het warme klimaat daar", "fout": ["Daar groeide geen katoen en het werd dus ingevoerd", "Het leger kocht alle wol op, dus er bleef alleen katoen over", "Wol was daar verboden, waardoor katoen overbleef"], "uitleg": "Een groot deel van de productie uit Twente was voor de export."},
  {"hoofdstuk": "H2", "niveau": 3, "vraag": "Wat laat de bron over Tilburg uit 1887 zien?", "goed": "Er werd nog veel op handweefgetouwen gewerkt", "fout": ["Alle stoffen werden al met machines geweven in grote fabrieken", "Er waren in de hele stad helemaal geen fabrieken te vinden", "Tilburg had in 1887 de grootste textielfabriek ter wereld"], "uitleg": "Van de 1683 handweefgetouwen werden er nog 1355 gebruikt."},
  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Hoe veranderde het werk van een wever door de stoomweefmachine?", "goed": "Hij werd minder zelfstandig en moest meerdere machines in de gaten houden", "fout": ["Hij kon thuis blijven werken en zelf zijn werktijden bepalen", "Hij hoefde veel minder op te letten dan voor die tijd het geval was", "Hij werd zijn eigen baas en kon zelf de regels voor de fabriek maken"], "uitleg": "Er kwamen ook strenge regels, bijvoorbeeld een verbod op roken en vloeken."},
  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Waarom is de ploegenfabriek van Imants een goed voorbeeld van de Nederlandse industrialisatie?", "goed": "Het was een klein bedrijf dat langzaam groeide en één product maakte", "fout": ["Het was meteen de grootste fabriek van heel Europa geworden", "Het maakte goedkope massaproducten die vooral naar het buitenland gingen", "Het werd opgericht door de koning van Nederland zelf"], "uitleg": "Het duurde een halve eeuw voordat er meer dan tien werknemers waren."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Welke drie grote Nederlandse multinationals ontstonden rond 1900?", "goed": "Unilever, Shell en Philips", "fout": ["Ahold, KLM en Heineken", "Fokker, DAF en Stork", "ING, ABN en Rabobank"], "uitleg": "Unilever (margarine), Shell (olie) en Philips (gloeilampen)."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Wat maakte Unilever oorspronkelijk?", "goed": "Margarine (kunstboter)", "fout": ["Gloeilampen en lampjes", "Aardolie en benzine", "Schoenen en laarzen"], "uitleg": "Anton Jurgens kocht het recept in Frankrijk en begon een fabriek."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Wat is een fusie?", "goed": "Twee bedrijven gaan samen verder als één bedrijf", "fout": ["Twee bedrijven gaan sterk met elkaar concurreren", "Een bedrijf gaat failliet en wordt overgenomen", "Een bedrijf opent een nieuwe fabriek in het buitenland"], "uitleg": "Unilever en Shell ontstonden allebei door een fusie."},
  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Hoe ontstond Unilever?", "goed": "Door een fusie van de margarinebedrijven van Jurgens en Van den Bergh", "fout": ["Door een besluit van de Nederlandse overheid in het jaar 1900", "Door de overname van een Engelse lampenfabriek in de stad Londen", "Door de ontdekking van olie in Nederlands-Indië rond 1890"], "uitleg": "Na harde concurrentie gingen ze toch samenwerken."},
  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Waarom koos Shell voor Rotterdam?", "goed": "Om er olie op te slaan en te verwerken", "fout": ["Omdat daar de meeste klanten van het bedrijf woonden", "Omdat daar al margarine en lampen werden gemaakt", "Omdat de koning daar zijn paleis had staan"], "uitleg": "Shell ontstond in 1907 door een fusie met een Brits bedrijf."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "In welke stad begon Philips in 1891 een lampenfabriek?", "goed": "Eindhoven", "fout": ["Tilburg", "Enschede", "Rotterdam"], "uitleg": "Frederik Philips en zijn zoon Gerard kochten er een leegstaand fabrieksgebouw."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Wat was de taakverdeling tussen Gerard en Anton Philips?", "goed": "Gerard was het technische brein en Anton de verkoper", "fout": ["Anton maakte de lampen en Gerard ging ze verkopen", "Gerard en Anton deden samen de boekhouding van het bedrijf", "Gerard was de bankier en Anton de fabrikant van de lampen"], "uitleg": "Een goed product en een goede verkoper samen maakten het bedrijf groot."},
  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Waarom groeide Philips tijdens de Eerste Wereldoorlog?", "goed": "Veel landen wilden geen Duitse lampen meer kopen", "fout": ["Philips maakte in de oorlog wapens voor het Nederlandse leger", "Nederland deed mee aan de oorlog en kreeg daardoor bestellingen", "De lonen in Nederland daalden in de oorlog sterk"], "uitleg": "Philips nam de klanten van de Duitse fabrieken over."},
  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Hoeveel meer fabrieksproducten maakte Engeland in 1880 dan Nederland?", "goed": "Zeventig keer zoveel", "fout": ["Twee keer zoveel", "Even veel", "Vier keer zo weinig"], "uitleg": "Ook België maakte vier keer zoveel als Nederland."},
  {"hoofdstuk": "H2", "niveau": 2, "vraag": "Waarom liep Nederland rond 1900 nog steeds achter, ook al waren er grote bedrijven als Philips?", "goed": "De meeste mensen werkten nog in kleine bedrijven, handel of landbouw", "fout": ["Philips, Shell en Unilever waren in werkelijkheid nog erg klein", "Nederland verkocht in die tijd helemaal niets aan het buitenland", "Er waren nog geen arbeiders die in fabrieken wilden werken"], "uitleg": "Een paar grote bedrijven maken nog geen industrieland."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Vanaf wanneer kwam de industrialisatie in Nederland echt op gang?", "goed": "Vooral na 1870", "fout": ["Al rond 1750", "Pas na 1950", "Rond 1600"], "uitleg": "Tussen 1880 en 1913 groeide de Nederlandse industrie snel."},
  {"hoofdstuk": "H2", "niveau": 1, "vraag": "Wat is een overeenkomst tussen Engeland en Nederland?", "goed": "In beide landen was de textielindustrie erg belangrijk", "fout": ["In beide landen begon de industrie al rond het jaar 1750", "In beide landen werkte niemand meer in de landbouw", "In beide landen waren er nog geen grote steden"], "uitleg": "De grootste fabrieken van Nederland waren textielfabrieken."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat is de sociale kwestie?", "goed": "De slechte leef- en werkomstandigheden van arbeiders in de negentiende eeuw", "fout": ["Een wet over het aantal vakantiedagen dat arbeiders mochten opnemen", "De vraag of Nederland in de negentiende eeuw wel moest industrialiseren", "De ruzie tussen de boeren en de fabrikanten over de grond"], "uitleg": "Lange werkdagen, lage lonen, onveilige fabrieken, kinderarbeid en slechte woningen."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wie vroegen vanaf het midden van de negentiende eeuw aandacht voor de sociale kwestie?", "goed": "Artsen, priesters, schrijvers en journalisten", "fout": ["Fabrikanten en bankiers die in de grote steden van het land woonden", "De koning en de adel die het land in die tijd bestuurden", "Boeren en vissers die op het platteland van Nederland woonden"], "uitleg": "Zij schreven over de ellendige levensomstandigheden van de arbeiders."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat beschreef dokter Penn in 1859?", "goed": "De slechte woningen van arbeidersgezinnen op de Veluwe", "fout": ["De nieuwe machines in de fabrieken van de steden", "De Wereldtentoonstelling die in Londen werd gehouden", "Het kiesrecht dat arbeiders in die tijd kregen"], "uitleg": "Eén kamer vol rook, kapotte ramen, en soms tien mensen in één ruimte."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Waarom schreef priester Wijnen in 1874 een boekje?", "goed": "Hij wilde laten zien hoe slecht kinderarbeid is", "fout": ["Hij wilde dat er meer kinderen in de fabriek gingen werken", "Hij wilde de stoommachine verbeteren voor de fabrieken", "Hij wilde dat kinderen meer gingen bidden in de kerk"], "uitleg": "Hij beschreef een uitgeput jongetje dat huilend naar de fabriek werd gedragen."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wie maakte het Kinderwetje van 1874?", "goed": "Samuel van Houten", "fout": ["P.J. Troelstra", "H. Colijn", "Joop den Uyl"], "uitleg": "Van Houten was een Groningse advocaat en politicus."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat regelde het Kinderwetje van 1874?", "goed": "Fabrieksarbeid voor kinderen onder de twaalf jaar werd verboden", "fout": ["Alle vormen van kinderarbeid werden voor altijd verboden in Nederland", "Kinderen moesten voortaan verplicht naar school tot hun twaalfde jaar", "Kinderen die werkten kregen een eigen minimumloon van de overheid"], "uitleg": "Op boerderijen en in winkels mochten kinderen gewoon blijven werken."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Waarom had het Kinderwetje weinig succes?", "goed": "Er werd nauwelijks gecontroleerd en ouders konden het loon niet missen", "fout": ["Kinderen wilden zelf heel graag werken in de fabriek en bleven daar", "De fabrikanten hielden zich er allemaal keurig aan, maar de kinderen niet", "De wet gold ook voor alle kinderen die op de boerderij of in winkels werkten"], "uitleg": "Bovendien bleef kinderarbeid buiten de fabriek gewoon toegestaan."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Waarom was het Kinderwetje toch belangrijk?", "goed": "Het was de eerste sociale wet van Nederland", "fout": ["Het schafte in één keer alle kinderarbeid in het land af", "Het gaf alle arbeiders in het land het recht om te stemmen", "Het voerde de achturige werkdag in voor alle arbeiders"], "uitleg": "Er volgden daarna meer sociale wetten."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Waarom wilde Van Houten dat kinderen naar school gingen?", "goed": "Als volwassene konden ze dan moeilijker werk doen; dat was goed voor de economie", "fout": ["Hij wilde graag dat de kinderen later allemaal dominee zouden worden", "Hij vond dat kinderen niet moesten werken, omdat de jeugd leuk moet zijn", "Hij wilde dat de kinderen later zouden gaan werken in de fabrieken in Engeland"], "uitleg": "Opgeleide arbeiders zijn waardevoller voor de economie."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat werd er in 1901 ingevoerd?", "goed": "De leerplichtwet", "fout": ["Het kiesrecht", "De Arbeidswet", "De Kinderwet"], "uitleg": "Kinderen moesten nu verplicht naar school."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Waarom werd de leerplichtwet wél een succes?", "goed": "Hij gold voor alle kinderen, er werd gecontroleerd en ouders verdienden meer", "fout": ["Kinderen kregen geld van de overheid om elke dag naar school te gaan", "Fabrieken mochten helemaal geen kinderen meer in dienst hebben, ook niet 's avonds", "De scholen waren gratis en lagen vlak bij elk dorp in het land"], "uitleg": "Tussen 1880 en 1900 waren de lonen iets gestegen, dus kinderarbeid was minder nodig."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat is een staking?", "goed": "Arbeiders weigeren te werken tot ze hun zin krijgen", "fout": ["Arbeiders worden door de baas ontslagen en vervangen", "De fabriek sluit een paar weken voor de vakantie", "Arbeiders werken extra uren voor wat meer loon"], "uitleg": "Alleen als veel arbeiders tegelijk staken, heeft de fabrikant een probleem."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Waarom heeft een staking door één arbeider geen zin?", "goed": "De baas ontslaat hem gewoon", "fout": ["De vakbond verbiedt het", "De staking duurt dan te lang", "Hij krijgt dan meer loon"], "uitleg": "Als al het personeel staakt, kan de fabrikant moeilijk iedereen ontslaan."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat is een vakbond?", "goed": "Een organisatie die namens de arbeiders onderhandelt met de werkgevers", "fout": ["Een bond van fabrikanten die samen de prijzen van de producten afspreken", "Een politieke partij voor de rijkste mensen die mochten stemmen", "Een bank waar arbeiders in tijden van nood geld kunnen lenen"], "uitleg": "Vakbonden onderhandelden over loon, werktijden en gezonde werkplekken."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Waarvoor was de stakingskas?", "goed": "Om stakende arbeiders een klein bedrag per stakingsdag te betalen", "fout": ["Om de fabrikant te betalen voor de productie die hij kwijtraakte", "Om nieuwe machines voor de fabriek van de vakbond te kopen", "Om belasting te betalen over het loon dat de arbeiders ontvingen"], "uitleg": "Leden betaalden elke week een paar cent, zodat ze een staking langer konden volhouden."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat was het censuskiesrecht?", "goed": "Alleen rijke mannen mochten stemmen", "fout": ["Iedereen boven de 18 jaar mocht stemmen", "Alleen vrouwen mochten stemmen", "Alleen arbeiders mochten stemmen"], "uitleg": "Daardoor vonden Kamerleden de wensen van fabrikanten belangrijker dan die van arbeiders."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wie richtte samen met andere socialisten de SDAP op?", "goed": "P.J. Troelstra", "fout": ["Samuel van Houten", "H. Colijn", "Joop den Uyl"], "uitleg": "Troelstra was een Friese advocaat en de leider van de socialisten."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat wilde de SDAP?", "goed": "Met sociale wetten het leven van arbeiders verbeteren", "fout": ["Met een gewelddadige revolutie de macht grijpen", "Het censuskiesrecht behouden voor rijke mannen", "Alle fabrieken in het hele land sluiten voor goed"], "uitleg": "SDAP = Sociaal-Democratische Arbeiderspartij."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat is het verschil tussen socialisten en communisten?", "goed": "Socialisten willen verandering via wetten, communisten via een revolutie", "fout": ["Socialisten zijn rijke fabrikanten, communisten zijn arme arbeiders", "Socialisten wonen in Nederland, communisten wonen in Engeland", "Er is tussen die twee groepen eigenlijk geen enkel verschil"], "uitleg": "Beide wilden een beter leven voor arbeiders, maar op een andere manier."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "In welk jaar werd het algemeen kiesrecht (voor mannen) ingevoerd?", "goed": "1917", "fout": ["1874", "1901", "1945"], "uitleg": "Nu konden arbeiders stemmen op partijen die hun wensen belangrijk vonden."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat was de houding van Nederland in de Eerste Wereldoorlog (1914–1918)?", "goed": "Neutraal: Nederland vocht niet mee", "fout": ["Nederland vocht mee aan de kant van Duitsland", "Nederland vocht mee aan de kant van Engeland", "Nederland werd direct bezet door het Duitse leger"], "uitleg": "Nederland kon daardoor eerst met alle landen handelen."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat was een positief gevolg van de Eerste Wereldoorlog voor Nederland?", "goed": "Landen die oorlog voerden, deden grote bestellingen in Nederland", "fout": ["Nederland kreeg door de oorlog veel nieuwe kolonies erbij", "De lonen van alle arbeiders verdubbelden direct na het begin", "Er kwamen door de oorlog helemaal geen grondstoffen meer binnen"], "uitleg": "Hun eigen arbeiders vochten als soldaat, dus hun fabrieken maakten minder."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Waarom kwam de Nederlandse industrie later in de Eerste Wereldoorlog in de problemen?", "goed": "Grondstoffen aanvoeren over zee werd te gevaarlijk", "fout": ["De fabrieken werden door vliegtuigen gebombardeerd", "Alle arbeiders moesten als soldaat in het leger", "Er was veel te veel vraag naar Nederlandse producten"], "uitleg": "De oorlog werd ook op zee uitgevochten, onder andere met duikboten."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat is een distributiestelsel?", "goed": "Iedereen krijgt bonnen en mag alleen iets kopen als hij een bon inlevert", "fout": ["De overheid deelt gratis eten uit aan iedereen die honger heeft in de stad", "Winkels mogen zelf bepalen hoe hoog hun prijzen zijn en wie het koopt", "Iedereen krijgt van de overheid precies hetzelfde loon uitbetaald"], "uitleg": "Zo kon iedereen evenveel van een schaars product kopen."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Waarom kwam de regering de arbeiders in 1919 tegemoet?", "goed": "Ze was bang dat ook in Nederland een communistische revolutie zou uitbreken", "fout": ["De fabrikanten hadden daar zelf nadrukkelijk om gevraagd bij de regering", "De koning wilde graag dat de arbeiders het een stuk beter zouden krijgen", "Er waren in Nederland te weinig arbeiders in de fabrieken om te werken"], "uitleg": "In Rusland hadden communisten de macht gegrepen; in Duitsland was het chaos."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat regelde de Arbeidswet van 1919?", "goed": "De achturige werkdag (45 uur per week)", "fout": ["Het verbod op kinderarbeid voor kinderen onder de twaalf", "De leerplicht voor alle kinderen in het land", "Het algemeen kiesrecht voor mannen en vrouwen"], "uitleg": "Daarna volgden nog meer sociale wetten en regels."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat is een cao?", "goed": "Afspraken over rechten en plichten die gelden voor een hele beroepsgroep", "fout": ["Een wet tegen kinderarbeid in de fabrieken en op het platteland", "Een vakbond waarin alleen de fabrikanten van het land lid konden zijn", "Een uitkering voor werklozen die zelf geen baan kunnen vinden"], "uitleg": "cao = collectieve arbeidsovereenkomst."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Hoeveel vakantiedagen kregen fabrieksarbeiders in het begin?", "goed": "4 tot 6 per jaar", "fout": ["20 per jaar", "Geen enkele", "Een maand per jaar"], "uitleg": "Veel stelde het in het begin nog niet voor."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wanneer begon de grote economische crisis?", "goed": "In 1929", "fout": ["In 1914", "In 1945", "In 1973"], "uitleg": "Door de beurskrach in Amerika stortte de wereldhandel in."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Hoeveel mensen waren in 1935 in Nederland werkloos?", "goed": "640.000 mensen", "fout": ["6.400 mensen", "64.000 mensen", "6,4 miljoen mensen"], "uitleg": "Dat was een kwart van de mannen die konden werken."},
  {"hoofdstuk": "H3", "niveau": 1, "vraag": "Wat was de aanpassingspolitiek van Colijn?", "goed": "De overheid mocht geen schulden maken en moest elders bezuinigen", "fout": ["De overheid gaf juist heel veel geld uit om de economie te helpen", "De overheid nam alle grote fabrieken in het hele land over", "De overheid verdubbelde in één keer de lonen van alle werknemers"], "uitleg": "Er werd ook bezuinigd op loonkosten: de lonen gingen omlaag."},
  {"hoofdstuk": "H3", "niveau": 2, "vraag": "Wat gebeurde er in 1936 met het beleid van de regering?", "goed": "Ze volgde de buurlanden en koos beleid voor industrie en handel", "fout": ["Ze voerde de aanpassingspolitiek nog veel strenger door dan daarvoor", "Ze sloot alle grenzen voor buitenlandse producten en grondstoffen", "Ze schafte alle vakbonden af en verbood het staken in het hele land"], "uitleg": "Aan het einde van de jaren dertig begon de economie zich te herstellen."},
  {"hoofdstuk": "H4", "niveau": 2, "vraag": "Waarom ging het in 1940 en 1941 goed met de Nederlandse economie?", "goed": "De Duitsers plaatsten veel bestellingen en betaalden goed", "fout": ["Nederland exporteerde in die jaren veel naar Engeland", "De Marshallhulp kwam in die jaren al binnen in Nederland", "De lonen werden door de regering helemaal vrijgegeven"], "uitleg": "Er was volop werk."},

.vg-rij{display:grid;grid-template-columns:minmax(3em,auto) 1fr 5.5em;align-items:center;gap:8px;font-size:clamp(14px,2vmin,18px);}
.vg-balk{height:18px;border:3px solid var(--inkt);border-radius:10px;background:#EEE;overflow:hidden;}
.vg-balk div{height:100%;background:var(--turq);}
.waarschuwing{background:#FFE1E1;border:3px solid var(--rood);border-radius:14px;padding:8px 12px;font-size:clamp(13px,1.9vmin,16px);font-weight:700;}
.foutlijst{background:#fff;border:3px solid var(--inkt);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;}
.foutlijst li{margin:4px 0;}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:30;display:none;align-items:center;gap:10px;
  padding:calc(8px + var(--vt)) calc(10px + var(--vr)) 8px calc(10px + var(--vl));pointer-events:none;}
#hud.aan{display:flex;}
#hud > *{pointer-events:auto;}
.hud-blok{background:var(--room);border:var(--rand);border-radius:18px;box-shadow:0 4px 0 var(--inkt);height:64px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 12px;font-size:clamp(15px,2.2vmin,20px);line-height:1.1;}
.tank{flex:1;min-width:0;}
.tank-balk{flex:1;height:28px;border:3px solid var(--inkt);border-radius:12px;background:#fff;overflow:hidden;min-width:40px;}
.tank-vulling{height:100%;background:var(--groen);width:100%;transition:width .25s,background .2s;}
.tank-vulling.laag{background:var(--rood);}
.tank-pct{min-width:3.3em;text-align:right;font-size:clamp(18px,2.8vmin,26px);}
.tank.laag{animation:knipper .6s infinite alternate;}
@keyframes knipper{to{background:#FFD0D0}}
.hud-kolom{flex-direction:column;gap:0;}
.hud-kolom small{font-size:12px;font-weight:700;opacity:.75;}
.reeks{display:flex;gap:3px;}
.reeks i{width:11px;height:11px;border-radius:50%;border:2px solid var(--inkt);background:#fff;}
.reeks i.aan{background:var(--geel);}
.schild-ico{color:#0EA5A0;display:none;}
.schild-ico.aan{display:block;}
#bord{position:absolute;left:50%;top:calc(var(--hud) + var(--vt) + 6px);transform:translateX(-50%);z-index:29;display:none;pointer-events:none;
  background:#1D4ED8;color:#fff;border:var(--rand);border-radius:16px;padding:8px 18px;font-size:clamp(16px,2.6vmin,24px);box-shadow:0 5px 0 var(--inkt);white-space:nowrap;}
#bord.aan{display:flex;align-items:center;gap:10px;}

/* ---------- meldingen ---------- */
#melding{position:absolute;left:50%;top:calc(var(--hud) + var(--vt) + 60px);transform:translate(-50%,-10px);z-index:55;opacity:0;pointer-events:none;
  background:var(--geel);border:var(--rand);border-radius:18px;padding:10px 20px;font-size:clamp(18px,3vmin,28px);box-shadow:0 6px 0 var(--inkt);
  transition:opacity .2s,transform .2s;text-align:center;max-width:90%;}
#melding.aan{opacity:1;transform:translate(-50%,0);}
#aftel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:45;pointer-events:none;}
#aftel.aan{display:flex;}
#aftel span{font-size:clamp(70px,20vmin,180px);color:#fff;-webkit-text-stroke:5px var(--inkt);text-shadow:0 8px 0 var(--inkt);animation:pop .8s ease-out;}
@keyframes pop{from{transform:scale(1.8);opacity:0}30%{opacity:1}to{transform:scale(1)}}
.zweef{position:absolute;z-index:58;pointer-events:none;font-size:clamp(24px,4vmin,38px);color:#fff;-webkit-text-stroke:2px var(--inkt);
  font-weight:900;animation:zweef 1s ease-out forwards;transform:translate(-50%,-50%);}
@keyframes zweef{to{margin-top:-70px;opacity:0}}

/* ---------- minigames ---------- */
#mg{position:absolute;left:0;right:0;bottom:0;top:calc(var(--hud) + var(--vt));z-index:28;display:none;flex-direction:column;align-items:center;gap:10px;
  padding:8px calc(12px + var(--vr)) calc(14px + var(--vb)) calc(12px + var(--vl));background:rgba(43,22,80,.55);}
#mg.aan{display:flex;}
#mg.doorzichtig{background:transparent;pointer-events:none;}
.mg-kop{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.mg-lijf{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.mg-intro{text-align:center;align-items:center;}
.mg-intro h2{font-size:clamp(26px,4.5vmin,42px);}
.mg-intro p{font-size:clamp(18px,3vmin,28px);}
.mg-intro .getal{font-size:clamp(60px,14vmin,130px);line-height:1;color:var(--oranje);-webkit-text-stroke:4px var(--inkt);}
.mg-paneel{width:min(760px,100%);max-height:100%;}
.mg-vraag{font-size:clamp(20px,3.4vmin,32px);line-height:1.25;text-align:center;}
.tijdbalk{height:18px;border:3px solid var(--inkt);border-radius:10px;background:#fff;overflow:hidden;}
.tijdbalk div{height:100%;width:100%;background:var(--oranje);}
.opties{display:flex;flex-direction:column;gap:clamp(8px,1.5vmin,14px);}
.optie{width:100%;text-align:left;display:flex;align-items:center;gap:12px;font-size:clamp(17px,2.7vmin,25px);font-weight:800;}
.optie .toets{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--inkt);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:17px;}
.k0{background:var(--geel)} .k1{background:var(--turq)} .k2{background:var(--oranje)} .k3{background:var(--lila)}
.optie.goed,.blok.goed,.kop-item.goed{background:var(--groen) !important;color:#fff;}
.optie.fout,.blok.fout,.kop-item.fout{background:var(--rood) !important;color:#fff;}
.optie.uit{opacity:.45;}
.optie:disabled,.blok:disabled,.kop-item:disabled{opacity:1;}
.optie.uit:disabled{opacity:.45;}
.optie.goed .toets,.optie.fout .toets{color:var(--inkt);}

/* uitleg na een fout */
.uitleg-laag{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:8px;pointer-events:auto;}
.uitleg-kaart{width:min(640px,100%);background:#fff;border:var(--rand);border-radius:26px;box-shadow:0 10px 0 var(--inkt);padding:clamp(16px,3vmin,30px);
  display:flex;flex-direction:column;gap:12px;animation:pop2 .25s ease-out;}
@keyframes pop2{from{transform:scale(.85);opacity:0}}
.uitleg-kop{font-size:clamp(26px,4.4vmin,40px);color:var(--rood);}
.uitleg-goed{font-size:clamp(18px,3vmin,27px);background:#DDF8E8;border:3px solid var(--groen);border-radius:14px;padding:10px 14px;}
.uitleg-tekst{font-size:clamp(18px,2.9vmin,26px);font-weight:700;line-height:1.35;}
.uitleg-balk{height:10px;border-radius:6px;background:#eee;overflow:hidden;}
.uitleg-balk div{height:100%;background:var(--inkt);width:100%;}
.uitleg-tik{font-size:15px;opacity:.7;text-align:center;}

/* swipen */
.swipe{display:grid;grid-template-columns:1fr minmax(0,1.5fr) 1fr;gap:clamp(8px,2vmin,20px);width:min(980px,100%);height:min(100%,520px);align-items:stretch;}
.bak{border-radius:24px;font-size:clamp(18px,3vmin,28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;word-break:break-word;hyphens:auto;}
.bak .pijl{font-size:1.6em;}
.bak.goed{background:var(--groen) !important;color:#fff;} .bak.fout{background:var(--rood) !important;color:#fff;}
.swipe-midden{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;}
.kaartje{width:100%;min-height:clamp(150px,30vmin,260px);background:#fff;border:var(--rand);border-radius:24px;box-shadow:0 8px 0 var(--inkt);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:clamp(19px,3.2vmin,30px);line-height:1.25;
  touch-action:none;cursor:grab;position:relative;z-index:3;}
.swipe-hint{font-size:clamp(13px,1.9vmin,17px);font-weight:700;color:#fff;text-align:center;background:rgba(43,22,80,.85);border-radius:999px;padding:6px 14px;}
@media (orientation:portrait){
  .swipe{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;height:min(100%,640px);}
  .swipe-midden{grid-column:1 / 3;grid-row:1;}
  .bak.links{grid-column:1;grid-row:2;min-height:clamp(110px,16vh,180px);} .bak.rechts{grid-column:2;grid-row:2;min-height:clamp(110px,16vh,180px);}
  .kaartje{min-height:clamp(180px,26vh,300px);max-width:560px;}
}

/* vallende blokken */
.val{width:min(900px,100%);height:100%;display:flex;flex-direction:column;gap:10px;}
.val-begrip{text-align:center;font-size:clamp(22px,4vmin,38px);width:100%;padding:10px 16px;}
.val-veld{flex:1;position:relative;border:var(--rand);border-radius:22px;background:rgba(255,255,255,.18);overflow:hidden;min-height:200px;}
.val-veld::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,var(--inkt) 0 18px,var(--geel) 18px 36px);}
.blok{position:absolute;top:0;width:calc(25% - 12px);min-height:clamp(64px,12vmin,110px);border:var(--rand);border-radius:18px;box-shadow:0 5px 0 var(--inkt);
  font-weight:900;font-size:clamp(15px,2.5vmin,23px);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;
  word-break:break-word;hyphens:auto;touch-action:none;cursor:pointer;line-height:1.15;}

/* poortenrace */
.poort-vraag{width:min(760px,100%);text-align:center;font-size:clamp(20px,3.4vmin,32px);padding:10px 18px;}

/* koppelen */
.kop-paneel{width:min(900px,100%);}
.kop-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vmin,22px);}
.kol{display:flex;flex-direction:column;gap:clamp(7px,1.3vmin,12px);}
.kop-item{min-height:64px;font-size:clamp(15px,2.4vmin,22px);text-align:center;padding:8px 10px;}
.kol.links .kop-item{background:var(--turq);} .kol.rechts .kop-item{background:var(--geel);}
.kop-item.gekozen{outline:5px solid var(--oranje);outline-offset:2px;transform:translateY(2px);}
.kop-item.vast{background:#BDF0D3 !important;box-shadow:0 2px 0 var(--inkt);opacity:.85;}
.kop-item.vast.was-fout{background:#E5E7EB !important;}

/* resultaat tankstop */
.resultaat{text-align:center;align-items:center;}
.resultaat .groot{font-size:clamp(34px,7vmin,64px);line-height:1;}
.resultaat .regels{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:clamp(18px,3vmin,28px);}

/* eindscherm */
.eind h2{font-size:clamp(30px,5.5vmin,52px);text-align:center;}
.statrij.vier{grid-template-columns:repeat(4,1fr);}
.record{text-align:center;font-size:clamp(17px,2.6vmin,24px);}
.record.nieuw{color:#C2410C;font-size:clamp(22px,3.6vmin,34px);animation:knipper2 .5s infinite alternate;}
@keyframes knipper2{to{transform:scale(1.06)}}
.rente{background:#E9FBF2;border:3px solid var(--groen);border-radius:14px;padding:8px 12px;font-size:clamp(15px,2.3vmin,20px);font-weight:700;text-align:center;}
.oefen{flex:1;min-height:90px;display:flex;flex-direction:column;gap:8px;}
.oefen-item{background:#fff;border:3px solid var(--inkt);border-radius:14px;padding:8px 12px;font-weight:700;font-size:clamp(14px,2.1vmin,18px);line-height:1.3;}
.oefen-item b{display:block;font-weight:900;}
.oefen-item .ant{color:#13804A;}
.codevak{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(22px,4vmin,34px);letter-spacing:2px;background:#fff;border:3px dashed var(--inkt);border-radius:14px;padding:8px 14px;text-align:center;user-select:text;-webkit-user-select:text;}

/* garage en auto kiezen */
.paneel-kop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.paneel-kop h2{flex:1;font-size:clamp(28px,4.6vmin,44px);}
.garage-inhoud{display:flex;flex-direction:column;gap:18px;padding-right:4px;flex:1;}
.garage-inhoud h3{font-size:clamp(20px,3vmin,28px);margin-bottom:8px;}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.item{background:#fff;border:3px solid var(--inkt);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  box-shadow:0 4px 0 var(--inkt);min-height:64px;touch-action:manipulation;}
.item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--inkt);}
.item.gekozen{background:#FFF1B8;outline:4px solid var(--oranje);}
.item.bekeken{outline:4px dashed var(--paars,#8B5CF6);outline-offset:2px;}
.showroom{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--inkt);border-radius:22px;padding:12px;flex-wrap:wrap;}
.showroom canvas{border-radius:16px;border:3px solid var(--inkt);flex:none;}
.show-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px;}
.show-naam{font-size:clamp(22px,3.4vmin,32px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.show-info p{font-weight:700;}
.item .naam{font-size:16px;}
.item .prijs{font-size:14px;font-weight:700;}
.item .prijs.te-duur{color:#B91C1C;}
.upgrade{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--inkt);border-radius:16px;padding:10px 12px;flex-wrap:wrap;}
.upgrade div{flex:1;min-width:180px;}
.upgrade small{display:block;font-weight:700;opacity:.8;font-size:14px;}
.spaar-rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.spaar-rij span{min-width:6em;}
.kleurbol{width:56px;height:56px;border-radius:50%;border:4px solid var(--inkt);}
input.code{font:inherit;font-size:clamp(20px,3.6vmin,30px);letter-spacing:2px;text-transform:uppercase;padding:10px 14px;border:var(--rand);border-radius:14px;width:100%;
  text-align:center;user-select:text;-webkit-user-select:text;touch-action:manipulation;}
.melding-tekst{min-height:1.4em;text-align:center;font-weight:800;}
.melding-tekst.fout{color:#B91C1C;} .melding-tekst.goed{color:#13804A;}

@media (max-height:820px){ .verberg-laag{display:none !important;} }
@media (max-height:620px){
  :root{--hud:76px;}
  .hud-blok{height:56px;}
}
@media (max-width:560px){
  .swipe{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;}
  .swipe-midden{grid-column:1 / 3;grid-row:1;}
  .bak.links{grid-column:1;grid-row:2;min-height:84px;} .bak.rechts{grid-column:2;grid-row:2;min-height:84px;}
  .statrij.vier{grid-template-columns:repeat(2,1fr);}
  .hud-punten small{display:none;}
}
.gepauzeerd *{animation-play-state:paused !important;}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* =====================================================================
   8. WELKE VRAAG KOMT ER? (herhaling en niveaus)
   ===================================================================== */
function niveausVoorStop(nr) { return nr <= 2 ? [1] : nr <= 4 ? [1, 2] : [1, 2, 3]; }
function prioriteit(item) {
  var s = stat(item);
  if (!s || !s.n) return 0;   // nog nooit gesteld
  return s.l ? 2 : 1;          // laatst fout = 1, laatst goed = 2
}
function sorteerOpPrioriteit(lijst) {
  return lijst.map(function (it) { var s = stat(it); return { it: it, p: prioriteit(it), t: s ? s.t : 0, r: Math.random() }; })
    .sort(function (a, b) { return a.p - b.p || a.t - b.t || a.r - b.r; })
    .map(function (x) { return x.it; });
}
function isReken(item) { return !!INST.rekenOnderdeel && item.hoofdstuk === INST.rekenOnderdeel; }
/* Hoeveel rekenvragen passen er in deze tankstop? Over het hele potje (vragen én kaartjes) blijft het aandeel
   rekenvragen zo dicht mogelijk bij rekenAandeel (bijv. 0.10 = 10% rekenen, 90% theorie). -1 = geen grens. */
function rekenPlekken(aantal) {
  if (!(INST.rekenAandeel > 0) || !ALLE_VRAGEN.some(isReken)) return -1;
  return Math.max(0, Math.min(aantal, Math.round(INST.rekenAandeel * (sessie.teller + aantal)) - sessie.reken));
}
function kiesVragen(aantal, eis) {
  eis = eis || {};
  var gekozen = [], niv = niveausVoorStop(spel.stopNr);
  var rp = rekenPlekken(aantal), rk = 0, th = 0;
  function past(v, streng) {
    if (gekozen.indexOf(v) >= 0) return false;
    if (eis.kort && !v.kort) return false;
    if (streng && rp >= 0 && (isReken(v) ? rk >= rp : th >= aantal - rp)) return false;
    if (eis.uniek) {
      // bij koppelen mag elk begrip maar bij één antwoord passen
      for (var i = 0; i < gekozen.length; i++) {
        var a = gekozen[i].kort, b = v.kort;
        if (a.groep && a.groep === b.groep) return false;
        var ta = [a.begrip.toLowerCase(), a.goed.toLowerCase()], tb = [b.begrip.toLowerCase(), b.goed.toLowerCase()];
        for (var x = 0; x < 2; x++) for (var y = 0; y < 2; y++) {
          if (ta[x] === tb[y] || (tb[y].length >= 4 && ta[x].indexOf(tb[y]) >= 0) || (ta[x].length >= 4 && tb[y].indexOf(ta[x]) >= 0)) return false;
        }
      }
    }
    return true;
  }
  var terug = sessie.terug.slice().sort(function (a, b) { return a.vanaf - b.vanaf; });
  var wachtend = {};
  sessie.terug.forEach(function (t) { wachtend[t.id] = true; });
  var basis = sorteerOpPrioriteit(ALLE_VRAGEN.filter(function (v) { return niv.indexOf(v.niveau) >= 0 && !wachtend[v.id]; }));
  var aanvul = sorteerOpPrioriteit(ALLE_VRAGEN.filter(function (v) { return niv.indexOf(v.niveau) < 0 && !wachtend[v.id]; }));
  function zoek(k, streng) {
    var keuze = null;
    for (var i = 0; i < terug.length && !keuze; i++) {
      var v = VRAAG_OP_ID[terug[i].id];
      if (v && terug[i].vanaf <= sessie.teller + k && past(v, streng)) keuze = v;
    }
    for (var j = 0; j < basis.length && !keuze; j++) if (past(basis[j], streng)) keuze = basis[j];
    for (var m = 0; m < aanvul.length && !keuze; m++) if (past(aanvul[m], streng)) keuze = aanvul[m];
    for (var q = 0; q < terug.length && !keuze; q++) { var v2 = VRAAG_OP_ID[terug[q].id]; if (v2 && past(v2, streng)) keuze = v2; }
    return keuze;
  }
  for (var k = 0; k < aantal; k++) {
    // eerst binnen de verhouding rekenen/theorie; lukt dat niet, dan toch een vraag, zodat de tankstop vol is
    var keuze = zoek(k, true) || zoek(k, false);
    if (!keuze) break;
    if (isReken(keuze)) rk++; else th++;
    gekozen.push(keuze);
  }
  return gekozen;
}
function kiesKaartjes(aantal) {
  var vorige = SETS[profiel.laatsteSet];
  var kandidaten = SETS.map(function (s, i) { return i; }).filter(function (i) { return SETS.length === 1 || i !== profiel.laatsteSet; });
  if (INST.rekenAandeel > 0) {
    var theorie = kandidaten.filter(function (i) { return SETS[i].hoofdstuk !== INST.rekenOnderdeel; });
    if (theorie.length) kandidaten = theorie;
  }
  var score = kandidaten.map(function (i) {
    var open = SETS[i].kaartjes.filter(function (k) { return !beheerst(k); }).length;
    return { i: i, s: open + Math.random() * 4 + (vorige && SETS[i].hoofdstuk !== vorige.hoofdstuk ? 3 : 0) };
  }).sort(function (a, b) { return b.s - a.s; });
  var si = score[0].i;
  profiel.laatsteSet = si;
  return { set: SETS[si], kaarten: hussel(sorteerOpPrioriteit(SETS[si].kaartjes).slice(0, aantal)) };
}
function registreer(item, goed) {
  var s = profiel.stats[item.id] || (profiel.stats[item.id] = { n: 0, l: 0, r: 0, t: 0 });
  s.n++; s.l = goed ? 1 : 0; s.r = goed ? s.r + 1 : 0; s.t = ++profiel.teller;
  sessie.teller++;
  if (isReken(item)) sessie.reken++;
  sessie.terug = sessie.terug.filter(function (t) { return t.id !== item.id; });
  if (!goed) {
    if (item.soort === 'vraag') sessie.terug.push({ id: item.id, vanaf: sessie.teller + 2 + Math.floor(Math.random() * 3) });
    if (!sessie.foutIds[item.id]) { sessie.foutIds[item.id] = true; sessie.fout.push(item); }
  }
}
function voortgang() {
  var per = {};
  HOOFDSTUKKEN.forEach(function (h) { per[h] = { b: 0, t: 0 }; });
  function tel(it) { var p = per[it.hoofdstuk]; if (!p) return; p.t++; if (beheerst(it)) p.b++; }
  ALLE_VRAGEN.forEach(tel);
  SETS.forEach(function (s) { s.kaartjes.forEach(tel); });
  var b = 0, t = 0;
  HOOFDSTUKKEN.forEach(function (h) { b += per[h].b; t += per[h].t; });
  return { per: per, b: b, t: t };
}

  updateKop();

  if (d.nieuwRecord && !terugUitGarage) { strooiConfetti(); d.nieuwRecordGevierd = true; }
  $('#b-opnieuw').addEventListener('click', function () { zorgAudio(); startSpel(); });
  $('#b-eind-garage').addEventListener('click', function () { toonGarage('eind'); });
  $('#b-eind-start').addEventListener('click', function () { eindData = null; toonStart(); });
}

/* ---------- pauze ---------- */
function pauzeer() {
  if (gepauzeerd || !spel || staat === 'menu' || staat === 'gameover') return;
  gepauzeerd = true; document.body.classList.add('gepauzeerd');
  var s = $('#s-pauze');
  s.innerHTML = '<div class="paneel" style="align-items:center;text-align:center"><h2 style="font-size:clamp(30px,5vmin,48px)">Pauze</h2>' +
    '<p>Het spel staat stil.</p><button class="knop groot" id="b-verder">Verder</button></div>';
  toonScherm('s-pauze');
  $('#b-verder').addEventListener('click', function () {
    zorgAudio(); gepauzeerd = false; document.body.classList.remove('gepauzeerd'); toonScherm(''); vorige = performance.now();
  });
}
document.addEventListener('visibilitychange', function () { if (document.hidden) { pauzeer(); bewaar(); } });
window.addEventListener('pagehide', bewaar);

/* =====================================================================
   11. BESTURING
   ===================================================================== */
var vegen = {};
canvas.addEventListener('pointerdown', function (e) {
  zorgAudio();
  if (!kanSturen()) return;
  e.preventDefault();
  vegen[e.pointerId] = { x: e.clientX, y: e.clientY, klaar: false };
});
canvas.addEventListener('pointermove', function (e) {
  var v = vegen[e.pointerId];
  if (!v || v.klaar) return;
  var dx = e.clientX - v.x, dy = e.clientY - v.y;
  if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) { wisselBaan(dx < 0 ? -1 : 1); v.klaar = true; }
});
canvas.addEventListener('pointerup', function (e) {
  var v = vegen[e.pointerId];
  delete vegen[e.pointerId];
  if (!v || v.klaar) return;
  var r = canvas.getBoundingClientRect();
  wisselBaan(e.clientX - r.left < r.width / 2 ? -1 : 1);
});
canvas.addEventListener('pointercancel', function (e) { delete vegen[e.pointerId]; });
document.addEventListener('pointerdown', zorgAudio, true);
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'INPUT') return;
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
    if (mg && mg.toets && mg.type === 'swipen') mg.toets('links'); else wisselBaan(-1);
    e.preventDefault();
  } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
    if (mg && mg.toets && mg.type === 'swipen') mg.toets('rechts'); else wisselBaan(1);
    e.preventDefault();
  } else if (/^[1-4]$/.test(k) && mg && mg.toets && mg.type !== 'swipen') {
    mg.toets(+k - 1);
  } else if ((k === 'p' || k === 'P' || k === 'Escape') && (staat === 'race' || staat === 'minigame')) {
    if (!gepauzeerd) pauzeer();
  }
});
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { if (e.target === canvas) e.preventDefault(); });

/* =====================================================================
   12. HOOFDLUS
   ===================================================================== */
var vorige = performance.now();
function lus(nu) {
  var dt = (nu - vorige) / 1000; vorige = nu;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  stapLogica(dt);
  tekenRace();
  tekenConfetti();
  if (showroom && $('#s-garage').classList.contains('aan')) tekenShowroom();
  requestAnimationFrame(lus);
}
function stapLogica(dt) {
  if (!gepauzeerd) {
    klok += dt;
    verwerkTimers(dt);
    if (spel && (staat === 'race' || staat === 'aftellen' || staat === 'minigame' || staat === 'resultaat' || staat === 'gameover')) {
      if (staat === 'race' || (staat === 'minigame' && mg && mg.type === 'poorten')) updateRace(dt);
      if (mg && mg.update) mg.update(dt);
      if (mg && mg.uitlegTik) mg.uitlegTik(dt);
    } else if (!spel) {
      menuAfstand += 1.1 * dt; vulDecor(menuAfstand);
    }
    updateConfetti(dt);
  }
}

/* ---------- start ---------- */
window.addEventListener('resize', schaal);
window.addEventListener('orientationchange', function () { setTimeout(schaal, 200); });
schaal();
document.title = INST.titel + (INST.ondertitel ? ' – ' + INST.ondertitel : '');
if (invoer.meldingen && invoer.meldingen.length) toonFoutScherm(); else naarBegin();
requestAnimationFrame(lus);

if (TEST) {
  window.EDU = {
    get spel() { return spel; }, get profiel() { return profiel; }, get staat() { return staat; }, get mg() { return mg; }, get sessie() { return sessie; },
    vragen: ALLE_VRAGEN, sets: SETS, rotatie: ROTATIE, invoer: invoer, maakCode: maakCode, leesCode: leesCode,
    tekenAutoDetail: tekenAutoDetail, tekenVoetganger: tekenVoetganger, tekenVaatje: tekenVaatje, AUTOS: AUTOS, LAKKEN: LAKKEN,
    tankstop: function () { if (spel && staat === 'race') spel.rijTijd = INST.secondenTussenTankstops; },
    benzine: function (x) { if (spel) spel.benzine = x; },
    geld: function (x) { profiel.contant = x; bewaar(); },
    opslagUit: function () { opslagWerkt = false; },
    kiesVragen: kiesVragen, kiesKaartjes: kiesKaartjes, registreer: registreer, isReken: isReken,
    tik: function (sec) { for (var i = 0; i < Math.round(sec * 60); i++) stapLogica(1 / 60); tekenRace(); tekenConfetti(); return staat; }
  };
}
})();
</script>
</body>
