var KEY="gv-doeboek-h4",A={};try{A=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){}
var esc=GV_AI.esc,cur=+(A._b||0),$=function(i){return document.getElementById(i);};
function save(){try{localStorage.setItem(KEY,JSON.stringify(A));}catch(e){}}
function L(i){return "ABCD"[i];}
function answered(q){var a=A[q.n];if(a==null||a==="")return false;if(typeof a==="object")return Object.keys(a).some(function(k){return a[k]!==""&&a[k]!=null;});return true;}
function tabs(){$("tabs").innerHTML=BL.map(function(b,i){var qs=Q.filter(function(q){return q.b===i;}),d=qs.filter(answered).length;return '<button data-b="'+i+'" aria-pressed="'+(i===cur)+'" class="'+(d===qs.length?"done":"")+'">'+(i+1<6?(i+1)+" · ":"")+b[0]+'<small>'+d+' / '+qs.length+'</small></button>';}).join("");}
function widget(q){
  var a=A[q.n],h="";
  if(q.t==="mc"){h='<div class="opts">'+q.o.map(function(t,i){var c=a===i?(q.k==null?"sel":i===q.k?"ok":"no"):(a!=null&&q.k===i?"ok":"");return '<button class="opt '+c+'" data-n="'+q.n+'" data-i="'+i+'"><b>'+L(i)+'</b><span>'+esc(t)+'</span></button>';}).join("")+'</div>';
    if(a!=null&&q.k!=null)h+='<p class="res '+(a===q.k?"ok":"no")+'">'+(a===q.k?"✓ Goed":"✗ Het juiste antwoord is "+L(q.k)+".")+'</p>';}
  else if(q.t==="jo"||q.t==="co"||q.t==="so"||q.t==="vo"||q.t==="pe"){
    var opts=q.t==="jo"?["J","O"]:q.t==="so"?["C","M"]:q.t==="co"?q.o.map(function(_,i){return L(i);}):q.t==="vo"?q.items.map(function(_,i){return i+1;}):[1,2,3,4,5];
    if(q.t==="co")h+='<div class="opts" style="gap:.5rem;margin-bottom:10px">'+q.o.map(function(t,i){return '<div><b>'+L(i)+'</b>  '+esc(t)+'</div>';}).join("")+'</div>';
    a=a||{};
    h+=q.items.map(function(it,i){var txt=it[0],key=it[1],v=a[i],st="";if(a._c&&key!=null&&v!=null&&v!=="")st=String(v)===String(key)?"ok":"no";
      return '<div class="row2 '+st+'"><span>'+(q.t==="co"?(i+1)+". ":"")+esc(txt)+(st==="no"?"  ✗":st==="ok"?"  ✓":"")+'</span><select data-n="'+q.n+'" data-i="'+i+'" aria-label="Antwoord '+(i+1)+'"><option value="">–</option>'+opts.map(function(o){return '<option'+(String(v)===String(o)?" selected":"")+'>'+o+'</option>';}).join("")+'</select></div>';}).join("");
    if(q.items.some(function(it){return it[1]!=null;}))h+='<button class="btn" data-chk="'+q.n+'">Controleer</button>'+(a._c?scoreLine(q,a):"");}
  else if(q.t==="ke"){
    a=a||{};var bi=0;
    h+='<div class="bank">'+q.bank.map(function(w){return '<span>'+esc(w)+'</span>';}).join("")+'</div><div class="chain">'+q.steps.map(function(s,i){var arrow=i?'<span class="ar">➜</span>':'';
      if(typeof s==="string")return arrow+'<span class="st">'+esc(s)+'</span>';
      var bi=s-1,v=a[bi],st=a._c&&v?(v===q.k[bi]?"ok":"no"):"";
      return arrow+'<select data-n="'+q.n+'" data-i="'+bi+'" class="'+st+'" aria-label="Ontbrekend woord '+s+'"><option value="">?</option>'+q.bank.map(function(w){return '<option'+(v===w?" selected":"")+'>'+esc(w)+'</option>';}).join("")+'</select>'+(st==="ok"?" ✓":st==="no"?" ✗":"");}).join("")+'</div>'+
      '<button class="btn" data-chk="'+q.n+'">Controleer</button>'+(a._c?scoreLine(q,a):"");}
  else if(q.t==="ze"){a=a||{};h='<div>'+q.items.map(function(n,i){return '<div class="row2"><span>'+esc(n)+'</span><span class="zelf">'+[1,2,3,4,5].map(function(x){return '<button data-z="'+q.n+'" data-i="'+i+'" data-v="'+x+'" class="'+(a[i]===x?"on":"")+'" aria-label="'+esc(n)+' '+x+'">'+x+'</button>';}).join("")+'</span></div>';}).join("")+'</div>'+subs(q,a);}
  else h=subs(q,a||{});
  return h;
}
function scoreLine(q,a){var tot=0,ok=0;(q.items||q.k).forEach(function(it,i){var key=q.t==="ke"?q.k[i]:it[1];if(key==null)return;tot++;var v=a[i];if(String(v)===String(key))ok++;});return '<p class="res '+(ok===tot?"ok":"no")+'">'+ok+' van '+tot+' goed'+(ok===tot?" ✓":", probeer de rode nog eens.")+'</p>';}
function subs(q,a){
  var S=q.s||[q.t==="ze"?null:""].filter(function(x){return x!==null;});
  return S.map(function(lab,i){var short=q.k&&q.k[i]!=null;
    return '<div class="sub">'+(lab?'<label for="t'+q.n+'_'+i+'">'+esc(lab)+'</label>':'')+(short?'<input type="text" id="t'+q.n+'_'+i+'" data-t="'+q.n+'" data-i="'+i+'" value="'+esc(a[i]||"")+'" inputmode="numeric" style="width:120px">'+(a[i]?(a[i].trim()===q.k[i]?' ✓':' ✗'):''):
    '<textarea id="t'+q.n+'_'+i+'" data-t="'+q.n+'" data-i="'+i+'" maxlength="900" placeholder="Typ hier je antwoord…">'+esc(a[i]||"")+'</textarea><button class="btn ghost" data-ai="'+q.n+'" data-i="'+i+'">Vraag de AI om feedback</button><div id="fb'+q.n+'_'+i+'"></div>')+'</div>';}).join("");
}
function draw(){
  A._b=cur;save();tabs();var b=BL[cur];
  $("blok").innerHTML='<div class="bhead"><h2>'+(cur<5?(cur+1)+" · ":"")+b[0]+' <span class="muted" style="font:500 16px Inter">'+b[1]+'</span></h2><p class="muted" style="margin:2px 0 0">'+b[2]+'</p></div>'+
   Q.filter(function(q){return q.b===cur;}).map(function(q,i){return '<div class="card" id="q'+q.n+'" style="animation-delay:'+Math.min(i,6)*45+'ms"><div class="tag">'+q.l+' <i>· vraag '+q.n+' · dia '+q.d+'</i></div>'+(q.bron?'<p class="bron">'+esc(q.bron)+'</p>':'')+'<p class="v">'+q.n+'. '+esc(q.v)+'</p>'+widget(q)+'</div>';}).join("");
  $("prev").style.visibility=cur?"visible":"hidden";$("next").style.visibility=cur<5?"visible":"hidden";
}
function redraw(n){var q=Q.filter(function(x){return x.n===n;})[0],c=$("q"+n),sc=document.scrollingElement.scrollTop;
  var focus=document.activeElement&&document.activeElement.id,st=c.style.animationDelay;
  c.style.animation="none";c.innerHTML='<div class="tag">'+q.l+' <i>· vraag '+q.n+' · dia '+q.d+'</i></div>'+(q.bron?'<p class="bron">'+esc(q.bron)+'</p>':'')+'<p class="v">'+q.n+'. '+esc(q.v)+'</p>'+widget(q);tabs();}
document.addEventListener("click",function(e){
  var t;
  if((t=e.target.closest("[data-b]"))){cur=+t.dataset.b;draw();window.scrollTo({top:0});return;}
  if((t=e.target.closest(".opt"))){var n=+t.dataset.n;A[n]=+t.dataset.i;save();redraw(n);return;}
  if((t=e.target.closest("[data-chk]"))){var n=+t.dataset.chk;A[n]=A[n]||{};A[n]._c=1;save();redraw(n);return;}
  if((t=e.target.closest("[data-z]"))){var n=+t.dataset.z;A[n]=A[n]||{};A[n][t.dataset.i]=+t.dataset.v;save();redraw(n);return;}
  if((t=e.target.closest("[data-ai]"))){ask(t);return;}
});
document.addEventListener("change",function(e){var t=e.target;if(t.tagName==="SELECT"&&t.dataset.n){var n=+t.dataset.n;A[n]=A[n]||{};A[n][t.dataset.i]=t.value;A[n]._c=0;save();redraw(n);}});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.t){var n=+t.dataset.t;A[n]=A[n]||{};A[n][t.dataset.i]=t.value;save();tabs();}});
function ask(btn){
  var n=+btn.dataset.ai,i=+btn.dataset.i,q=Q.filter(function(x){return x.n===n;})[0],a=((A[n]||{})[i]||"").trim(),fb=$("fb"+n+"_"+i);
  if(a.length<5){fb.innerHTML='<div class="aifb bijna"><p>Typ eerst je antwoord.</p></div>';return;}
  btn.disabled=true;btn.textContent="Bezig met nakijken…";
  var vraag=(q.s?q.v+" "+q.s[i]:q.v);
  GV_AI.check({begrip:vraag,uitleg:"Beoordeel het antwoord van de leerling aan de hand van de lesstof (samenvatting). Er is geen vast modelantwoord: kijk of het antwoord klopt met de les en volledig genoeg is.",antwoord:a,paragraaf:"H4 Welvaart voor iedereen · blok "+(q.b+1),samenvatting:(window.DOEBOEK_CTX[q.b+1]||window.DOEBOEK_CTX[5]||""),punten:[]}).then(function(f){
    btn.disabled=false;btn.textContent="Vraag de AI om feedback";f.melding=f.lokaal?"De AI is nu niet bereikbaar: bespreek dit antwoord met je docent.":f.melding;
    if(f.lokaal){fb.innerHTML='<div class="aifb bijna"><p>De AI is nu niet bereikbaar. Vergelijk je antwoord met de PowerPoint of vraag het je docent.</p></div>';return;}
    fb.innerHTML=GV_AI.render(f);});
}
$("prev").onclick=function(){cur=Math.max(0,cur-1);draw();window.scrollTo({top:0});};
$("next").onclick=function(){cur=Math.min(5,cur+1);draw();window.scrollTo({top:0});};
$("copy").onclick=function(){
  var s="Doe-boek H4 · Welvaart voor iedereen\n\n";
  Q.forEach(function(q){var a=A[q.n];if(a==null)return;var v;
    if(q.t==="mc")v=L(a);else if(typeof a==="object")v=Object.keys(a).filter(function(k){return k[0]!=="_"&&a[k]!=="";}).map(function(k){return (q.s&&q.s[k]?q.s[k].slice(0,2)+" ":"")+(q.items&&q.items[k]?(Array.isArray(q.items[k])?q.items[k][0].slice(0,30):q.items[k])+" = ":"")+a[k];}).join("\n   ");else v=a;
    s+=q.n+". "+v+"\n";});
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){$("copy").textContent="Gekopieerd ✓";},function(){prompt("Kopieer je antwoorden:",s);});
  setTimeout(function(){$("copy").textContent="Kopieer mijn antwoorden";},2200);};
draw();
})();
