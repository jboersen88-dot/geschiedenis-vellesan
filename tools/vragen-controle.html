<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vragencontrole · docent</title>
<style>
:root{--green:#1f5f4e;--coral:#ff8d90;--berry:#c2484d;--teal:#2f8f86;--bg:#f6f0e6;--card:#fffdf9;--ink:#201a14;--muted:#6f6556;--line:#e6dac4;--ok-soft:#e1f4ea;--warn:#fdebd0}
@media(prefers-color-scheme:dark){:root{--bg:#17201d;--card:#1f2b27;--ink:#f2ece0;--muted:#a79f90;--line:#34433d;--ok-soft:#183a2b;--warn:#4a3a1c;--green:#8fd3bd}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 70px}
h1{font:700 clamp(26px,5vw,34px)/1.15 Fraunces,Georgia,serif;color:var(--green);margin:8px 0 4px}
.muted{color:var(--muted);font-size:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:14px 0}
label{display:flex;flex-direction:column;font-size:13px;font-weight:600;gap:3px}
select,input[type=search]{min-height:44px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:16px Inter,sans-serif;background:var(--card);color:var(--ink);max-width:100%}
.chk{flex-direction:row;align-items:center;gap:8px;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card.flag{border-color:var(--berry)}
.meta{font-size:12px;color:var(--muted);word-break:break-all}
.card p{margin:4px 0 8px;font-weight:600}
ol{margin:0;padding:0;list-style:none}
li{display:flex;gap:8px;justify-content:space-between;padding:6px 10px;border-radius:8px;border:1px solid var(--line);margin-top:4px;overflow-wrap:anywhere}
li.ok{background:var(--ok-soft);border-color:var(--teal)}
li b{white-space:nowrap;color:var(--muted);font-weight:500;font-size:13px}
.flags{background:var(--warn);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font:600 15px Inter,sans-serif;background:transparent;color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
button.fout[aria-pressed=true]{background:var(--berry);border-color:var(--berry)}
button.twijfel[aria-pressed=true]{background:#b8860b;border-color:#b8860b}
button.pri{background:var(--berry);color:#fff;border-color:var(--berry)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
textarea{width:100%;min-height:140px;margin-top:10px;font:13px monospace;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<h1>Vragencontrole</h1>
<p class="muted">Alleen voor de docent, niet gelinkt vanaf de leerlingsite. Data komt uit <code>vragen-data.js</code> (maak opnieuw met <code>python3 -I tools/vragen-export.py</code>). Je oordelen worden alleen in deze browser bewaard.</p>
<div class="bar">
<label>Bronbestand<select id="fb"></select></label>
<label>Hoofdstuk<select id="fh"></select></label>
<label>Oordeel<select id="fo"><option value="">Alle</option><option value="none">Nog niet beoordeeld</option><option value="goed">Goed</option><option value="fout">Fout</option><option value="twijfel">Twijfel</option></select></label>
<label>Zoek<input type="search" id="fs" placeholder="tekst in vraag"></label>
<label class="chk"><input type="checkbox" id="ff"> Alleen gevlagde</label>
</div>
<div id="count" class="muted" role="status"></div>
<div class="row"><button class="pri" id="exp">Exporteer mijn oordelen</button></div>
<textarea id="out" hidden readonly aria-label="Geëxporteerde oordelen"></textarea>
<div id="list"></div>
</div>
<script src="vragen-data.js"></script>
<script>
(function(){
var V=window.VRAGEN||[],KEY="gv-vragencontrole",J={},SHOW=100;
try{J=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function fill(id,vals,all){document.getElementById(id).innerHTML='<option value="">'+all+'</option>'+vals.map(function(v){return '<option>'+esc(v)+'</option>';}).join("");}
function uniq(k){return Object.keys(V.reduce(function(o,r){o[r[k]]=1;return o;},{})).sort();}
fill("fb",uniq("bron"),"Alle");fill("fh",uniq("h"),"Alle");
function sel(id){return document.getElementById(id).value;}
function filtered(){var b=sel("fb"),h=sel("fh"),o=sel("fo"),s=sel("fs").toLowerCase(),f=document.getElementById("ff").checked;
 return V.filter(function(r){var j=J[r.id]||"";return (!b||r.bron===b)&&(!h||r.h===h)&&(!f||r.vlaggen.length)&&(!o||(o==="none"?!j:j===o))&&(!s||r.q.toLowerCase().indexOf(s)>-1);});}
function card(r){var L=r.o.map(function(o){return o.length;}),j=J[r.id]||"";
 return '<div class="card'+(r.vlaggen.length?' flag':'')+'" data-id="'+esc(r.id)+'"><div class="meta">'+esc(r.bron)+' · hoofdstuk '+esc(r.h)+'</div><p>'+esc(r.q)+'</p><ol>'+r.o.map(function(o,i){return '<li'+(i===r.j?' class="ok"':'')+'><span>'+(i===r.j?'✔ ':'')+esc(o)+'</span><b>'+o.length+'</b></li>';}).join("")+'</ol>'
 +'<div class="meta" style="margin-top:6px">Lengtes: '+L.join(" / ")+(Math.min.apply(0,L)?' · langste/kortste '+(Math.max.apply(0,L)/Math.min.apply(0,L)).toFixed(2):'')+'</div>'
 +(r.vlaggen.length?'<div class="flags">⚠ '+r.vlaggen.map(esc).join("<br>⚠ ")+'</div>':'')
 +'<div class="row">'+["goed","fout","twijfel"].map(function(k){return '<button class="'+k+'" data-k="'+k+'" aria-pressed="'+(j===k)+'">'+k[0].toUpperCase()+k.slice(1)+'</button>';}).join("")+'</div></div>';}
function render(){var F=filtered(),n=Object.keys(J).filter(function(k){return J[k];}).length;
 document.getElementById("count").textContent=F.length+" van "+V.length+" vragen · "+n+" beoordeeld"+(F.length>SHOW?" · eerste "+SHOW+" getoond, filter verder":"");
 document.getElementById("list").innerHTML=F.slice(0,SHOW).map(card).join("");}
["fb","fh","fo","fs","ff"].forEach(function(id){document.getElementById(id).addEventListener("input",render);});
document.getElementById("list").addEventListener("click",function(e){var b=e.target.closest("[data-k]");if(!b)return;
 var id=b.closest(".card").dataset.id;J[id]=J[id]===b.dataset.k?"":b.dataset.k;try{localStorage.setItem(KEY,JSON.stringify(J));}catch(x){}
 var c=b.closest(".card");if(sel("fo")){render();}else{c.querySelectorAll("[data-k]").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.k===J[id]);});document.getElementById("count").textContent=document.getElementById("count").textContent.replace(/\d+ beoordeeld/,Object.keys(J).filter(function(k){return J[k];}).length+" beoordeeld");}});
document.getElementById("exp").addEventListener("click",function(){var t=document.getElementById("out"),byId={};V.forEach(function(r){byId[r.id]=r;});
 var rows=Object.keys(J).filter(function(k){return J[k]&&byId[k];}).map(function(k){var r=byId[k];return {oordeel:J[k],bron:r.bron,hoofdstuk:r.h,vraag:r.q,juist:r.o[r.j],opties:r.o,vlaggen:r.vlaggen};});
 t.value=JSON.stringify(rows,null,1);t.hidden=false;t.select();try{navigator.clipboard.writeText(t.value).catch(function(){});}catch(e){}});
render();
})();
</script>
</body>
</html>
