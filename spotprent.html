<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spotprent analyseren · Geschiedenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1f5f4e;--coral:#ff8d90;--berry:#c2484d;--teal:#2f8f86;--bg:#f6f0e6;--card:#fffdf9;--ink:#201a14;--muted:#6f6556;--line:#e6dac4;--ok-soft:#e1f4ea;--ease:cubic-bezier(.23,1,.32,1)}
@media(prefers-color-scheme:dark){:root{--bg:#17201d;--card:#1f2b27;--ink:#f2ece0;--muted:#a79f90;--line:#34433d;--ok-soft:#183a2b;--green:#8fd3bd}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
h1{font:700 clamp(26px,4.4vw,36px)/1.15 Fraunces,serif;color:var(--green);margin:8px 0 6px;letter-spacing:-.02em}
h2{font:700 22px/1.2 Fraunces,serif;color:var(--green);margin:0 0 6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--berry)}
.muted{color:var(--muted)}a{color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(31,95,78,.06),0 10px 28px rgba(31,95,78,.08)}
.grid{display:grid;gap:20px;margin-top:16px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.prent{position:sticky;top:16px}}
.prent figure{margin:0}.prent img{display:block;width:100%;height:auto;border-radius:12px;cursor:zoom-in;background:#e9e0cf}
@media(min-width:900px){.prent img{max-height:calc(100vh - 150px);object-fit:contain}}
.prent figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.steps button{min-height:44px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font:600 14px Inter;cursor:pointer;text-align:left;transition:border-color .16s,background .16s,transform .16s var(--ease)}
.steps button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.steps button[aria-current="step"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,var(--card))}
.steps button.klaar small{color:#2e9b6b}
.steps button:active{transform:scale(.97)}
.hulp{margin:8px 0 12px;padding:10px 14px 10px 30px;border-radius:12px;background:color-mix(in srgb,var(--teal) 8%,transparent);font-size:15px}
.hulp li{margin:2px 0}
.vraag{font-weight:600;margin:6px 0 10px}
textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:14px;padding:12px;font:16px/1.5 Inter;background:var(--card);color:var(--ink);resize:vertical;transition:border-color .16s}
textarea:focus{border-color:var(--teal);outline:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;min-height:44px;font:600 15px Inter;background:var(--berry);color:#fff;cursor:pointer;text-decoration:none;transition:transform .16s var(--ease),filter .16s}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}.btn[disabled]{opacity:.55;cursor:default}
@media(hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.07)}.steps button:hover{border-color:var(--teal)}}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.model{margin-top:12px;background:var(--ok-soft);border-radius:12px;padding:10px 12px;font-size:15px}
.aiwait{margin-top:12px;font-size:14px;color:var(--muted)}.aiwait:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid var(--teal);border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.totaal{margin-top:16px}.totaal ol{margin:8px 0 0;padding-left:20px}
.fade{animation:fade .32s var(--ease)}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}dialog::backdrop{background:rgba(10,14,12,.82)}
dialog img{display:block;max-width:96vw;max-height:92vh;width:auto;height:auto;border-radius:10px}
dialog button{position:fixed;top:12px;right:12px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="zoom" aria-label="Spotprent vergroot"><button class="btn" id="dicht">Sluiten</button><img id="zoomimg" alt=""></dialog>
<script src="data/spotprenten.js"></script>
<script src="ai.js"></script>
<script src="nakijker.js"></script>
<script>
(function(){
var L=window.SPOTPRENTEN,id=(/[?&]p=([\w-]+)/.exec(location.search)||[])[1],P=L.filter(function(x){return x.id===id;})[0]||L[0];
var KEY="gv-spot-"+P.id,MAXPOGING=3,app=document.getElementById("app"),S;
try{S=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){S={};}
S.antw=S.antw||{};S.ai=S.ai||{};S.n=S.n||{};S.model=S.model||{};S.cur=S.cur||1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var esc=GV_AI.esc,bezig={};
function stap(n){return P.stappen.filter(function(s){return s.stap===n;})[0];}

function page(){
  var h='<a class="muted" href="app.html">← Terug naar de leeromgeving</a><div class="eyebrow" style="margin-top:20px">Spotprent analyseren · Kijkwijzer</div><h1>'+esc(P.titel)+'</h1><p class="muted" style="max-width:640px;margin:0">'+esc(P.intro)+'</p>';
  h+='<div class="grid"><div class="prent card"><figure><img id="img" src="'+P.img+'" alt="Spotprent: '+esc(P.titel)+'. '+esc(P.beschrijving)+'"><figcaption>'+esc(P.bronvermelding)+' Tik op de prent om te vergroten.</figcaption></figure></div>';
  h+='<div><nav class="steps" aria-label="Stappen van de Kijkwijzer">'+P.stappen.map(function(s){var f=S.ai[s.stap];
    return '<button data-stap="'+s.stap+'"'+(S.cur===s.stap?' aria-current="step"':'')+(f&&f.status==="ok"?' class="klaar"':'')+'>Stap '+s.stap+' · '+esc(s.label)+'<small>'+(f&&f.status==="ok"?f.punten+'/'+f.max+' punten':'nog doen')+'</small></button>';}).join("")+'</nav>';
  h+='<div id="stap">'+stapHtml()+'</div><div id="totaal">'+totaalHtml()+'</div></div></div>';
  app.innerHTML=h;
}
function stapHtml(){var s=stap(S.cur),f=S.ai[s.stap],n=S.n[s.stap]||0,last=s.stap===P.stappen.length;
  var h='<div class="card fade"><h2>Stap '+s.stap+' · '+esc(s.label)+'</h2><ul class="hulp">'+s.hulp.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';
  h+='<p class="vraag">'+esc(s.vraag)+'</p><textarea id="ta" aria-label="Jouw antwoord bij stap '+s.stap+'" placeholder="Schrijf in hele zinnen. Begin bijvoorbeeld met: Ik zie dat …">'+esc(S.antw[s.stap]||"")+'</textarea>';
  h+='<div class="row">';
  if(GV_NK.enabled&&!(f&&f.status==="ok"&&f.punten===f.max))h+='<button class="btn" id="check"'+(bezig[s.stap]||n>=MAXPOGING?" disabled":"")+'>'+(f?"Laat opnieuw nakijken":"Laat nakijken")+'</button>';
  if(f||S.model[s.stap]||!GV_NK.enabled)h+='<button class="btn ghost" id="model">'+(S.model[s.stap]?"Verberg":"Bekijk")+' het modelantwoord</button>';
  if(!last)h+='<button class="btn ghost" id="next">Volgende stap →</button>';
  h+='</div>';
  if(n>=MAXPOGING&&f&&f.status==="ok"&&f.punten<f.max)h+='<p class="muted" style="font-size:14px">Je hebt '+MAXPOGING+' keer laten nakijken. Vergelijk je antwoord nu met het modelantwoord.</p>';
  h+='<div id="fb">'+(bezig[s.stap]?'<div class="aiwait">AI kijkt je antwoord na…</div>':f?GV_NK.render(f):"")+'</div>';
  if(S.model[s.stap])h+='<div class="model"><b>Modelantwoord:</b> '+esc(s.model)+'</div>';
  return h+'</div>';}
function totaalHtml(){var gedaan=P.stappen.filter(function(s){var f=S.ai[s.stap];return f&&f.status==="ok";});
  if(gedaan.length<P.stappen.length)return "";
  var p=0,m=0;gedaan.forEach(function(s){p+=S.ai[s.stap].punten;m+=S.ai[s.stap].max;});
  return '<div class="card totaal fade"><div class="eyebrow">Klaar met de Kijkwijzer</div><h2>'+p+' van '+m+' punten</h2><ol>'+P.stappen.map(function(s){return '<li>'+esc(s.label)+': '+S.ai[s.stap].punten+'/'+S.ai[s.stap].max+'</li>';}).join("")+'</ol><div class="row">'+(L.length>1?L.filter(function(x){return x.id!==P.id;}).map(function(x){return '<a class="btn ghost" href="spotprent.html?p='+x.id+'">'+esc(x.titel)+'</a>';}).join(""):"")+'<button class="btn ghost" id="reset">Opnieuw beginnen</button></div></div>';}

function nakijken(){var s=stap(S.cur),k=s.stap,ans=document.getElementById("ta").value.trim();
  if(ans.length<3){document.getElementById("fb").innerHTML='<div class="aifb"><p class="ainote">Schrijf eerst je antwoord.</p></div>';return;}
  S.antw[k]=ans;S.n[k]=(S.n[k]||0)+1;bezig[k]=1;save();vernieuw();
  GV_NK.check({h:P.h,vraag:s.vraag,punten:s.punten,bron:(P.bronvermelding+"\n"+P.beschrijving).slice(0,4000),antwoord:ans.slice(0,2000)}).then(function(f){
    delete bezig[k];S.ai[k]=f.status==="ok"?f:{status:"fout",melding:f.melding||"De AI kon nu niet nakijken. Bekijk het modelantwoord."};
    if(f.status!=="ok")S.n[k]--; // mislukte poging telt niet
    save();if(S.cur===k)vernieuw();else page();});}
function vernieuw(){page();var t=document.getElementById("ta");if(t&&!t.value)t.focus();}

app.addEventListener("click",function(e){
  var b=e.target.closest("[data-stap]");if(b){bewaar();S.cur=+b.dataset.stap;save();page();document.getElementById("stap").scrollIntoView({block:"nearest"});return;}
  if(e.target.closest("#check")){nakijken();return;}
  if(e.target.closest("#model")){bewaar();S.model[S.cur]=!S.model[S.cur];save();page();return;}
  if(e.target.closest("#next")){bewaar();S.cur++;save();page();document.getElementById("stap").scrollIntoView({block:"nearest"});return;}
  if(e.target.closest("#reset")){if(confirm("Opnieuw beginnen? Je antwoorden bij deze prent worden gewist.")){S={antw:{},ai:{},n:{},model:{},cur:1};save();page();}return;}
  if(e.target.closest("#img")){var d=document.getElementById("zoom");document.getElementById("zoomimg").src=P.img;document.getElementById("zoomimg").alt=P.titel;d.showModal();}
});
app.addEventListener("input",function(e){if(e.target.id==="ta"){S.antw[S.cur]=e.target.value;save();}});
function bewaar(){var t=document.getElementById("ta");if(t){S.antw[S.cur]=t.value;}}
var dz=document.getElementById("zoom");dz.addEventListener("click",function(e){if(e.target===dz||e.target.id==="dicht")dz.close();});
page();
})();
</script>
</body>
</html>
