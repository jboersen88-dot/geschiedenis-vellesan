<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spotprent analyseren · Geschiedenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1f5f4e;--coral:#ff8d90;--berry:#c2484d;--teal:#2f8f86;--bg:#f6f0e6;--card:#fffdf9;--ink:#201a14;--muted:#6f6556;--line:#e6dac4;--ok-soft:#e1f4ea;--ease:cubic-bezier(.23,1,.32,1)}
@media(prefers-color-scheme:dark){:root{--bg:#17201d;--card:#1f2b27;--ink:#f2ece0;--muted:#a79f90;--line:#34433d;--ok-soft:#183a2b;--green:#8fd3bd}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
h1{font:700 clamp(26px,4.4vw,36px)/1.15 Fraunces,serif;color:var(--green);margin:8px 0 6px;letter-spacing:-.02em}
h2{font:700 22px/1.2 Fraunces,serif;color:var(--green);margin:0 0 6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--berry)}
.muted{color:var(--muted)}a{color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(31,95,78,.06),0 10px 28px rgba(31,95,78,.08)}
.grid{display:grid;gap:20px;margin-top:16px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.prent{position:sticky;top:16px}}
.prent figure{margin:0}.prent img{display:block;width:100%;height:auto;border-radius:12px;cursor:zoom-in;background:#e9e0cf}
@media(min-width:900px){.prent img{max-height:calc(100vh - 150px);object-fit:contain}}
.prent figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.steps button{min-height:44px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font:600 14px Inter;cursor:pointer;text-align:left;transition:border-color .16s,background .16s,transform .16s var(--ease)}
.steps button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.steps button[aria-current="step"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,var(--card))}
.steps button.klaar small{color:#2e9b6b}
.steps button:active{transform:scale(.97)}
.hulp{margin:8px 0 12px;padding:10px 14px 10px 30px;border-radius:12px;background:color-mix(in srgb,var(--teal) 8%,transparent);font-size:15px}
.hulp li{margin:2px 0}
.vraag{font-weight:600;margin:6px 0 10px}
textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:14px;padding:12px;font:16px/1.5 Inter;background:var(--card);color:var(--ink);resize:vertical;transition:border-color .16s}
textarea:focus{border-color:var(--teal);outline:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;min-height:44px;font:600 15px Inter;background:var(--berry);color:#fff;cursor:pointer;text-decoration:none;transition:transform .16s var(--ease),filter .16s}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}.btn[disabled]{opacity:.55;cursor:default}
@media(hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.07)}.steps button:hover{border-color:var(--teal)}}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.model{margin-top:12px;background:var(--ok-soft);border-radius:12px;padding:10px 12px;font-size:15px}
.aiwait{margin-top:12px;font-size:14px;color:var(--muted)}.aiwait:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid var(--teal);border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.totaal{margin-top:16px}.totaal ol{margin:8px 0 0;padding-left:20px}
.fade{animation:fade .32s var(--ease)}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}dialog::backdrop{background:rgba(10,14,12,.82)}
dialog img{display:block;max-width:96vw;max-height:92vh;width:auto;height:auto;border-radius:10px}
dialog button{position:fixed;top:12px;right:12px}
.plaat{position:relative;margin:0 auto}
@media(min-width:900px){.plaat{width:min(100%,calc((100vh - 170px)*var(--r)))}}
.plaat img{max-height:none!important}
.hs{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--berry);color:#fff;font:700 15px Inter;cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .16s var(--ease),background .16s}
.hs::after{content:"";position:absolute;inset:-8px;border-radius:50%}
.hs.gedaan{background:var(--teal)}
.hs[aria-pressed="true"]{transform:translate(-50%,-50%) scale(1.25);background:var(--green);outline:3px solid var(--coral)}
.hs:active{transform:translate(-50%,-50%) scale(.92)}
@media(hover:hover) and (pointer:fine){.hs:hover{transform:translate(-50%,-50%) scale(1.12)}}
.steps .ontdek{grid-column:1/-1}
.ogrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:10px}
.okaart{display:flex;gap:12px;padding:12px;text-decoration:none;color:inherit;align-items:flex-start;transition:transform .16s var(--ease),border-color .16s}
.okaart img{width:84px;height:104px;object-fit:cover;border-radius:8px;flex:none;background:#e9e0cf}
.okaart b{display:block;font:700 16px/1.25 Fraunces,serif;color:var(--green)}
.okaart small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.okaart em{display:inline-block;font-style:normal;font-size:12px;font-weight:600;color:var(--berry);margin-top:6px}
.okaart i{display:block;font-style:normal;font-size:12px;color:#2e9b6b;margin-top:4px}
.okaart:active{transform:scale(.98)}
@media(hover:hover) and (pointer:fine){.okaart:hover{border-color:var(--teal)}}
.steps .examen{border-color:color-mix(in srgb,var(--berry) 45%,var(--line))}
.mk{display:grid;gap:12px;margin:8px 0 4px}
.mkopt{display:block;width:100%;text-align:left;min-height:48px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:500 15px/1.45 Inter;cursor:pointer;transition:border-color .16s,background .16s}
.mkopt b{display:inline-block;width:22px;color:var(--berry)}
.mkopt[aria-checked="true"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,var(--card))}
.mkopt.goed{border-color:#2e9b6b;background:var(--ok-soft)}
.mkopt.fout{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 10%,var(--card))}
.mkopt[disabled]{cursor:default;opacity:1}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--teal);border:1.5px solid color-mix(in srgb,var(--teal) 40%,transparent);border-radius:999px;padding:1px 9px;margin-bottom:6px}
.hint{margin-top:10px;border-left:4px solid var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent);border-radius:0 12px 12px 0;padding:8px 12px;font-size:15px}
.hint b{color:var(--berry)}
.hslist{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.hslist button{width:100%;text-align:left;min-height:44px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:500 15px Inter;cursor:pointer}
.hslist button .nr{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--berry);color:#fff;font-weight:700;font-size:13px;margin-right:8px}
.hslist button.gedaan .nr{background:var(--teal)}
textarea.klein{min-height:70px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="zoom" aria-label="Spotprent vergroot"><button class="btn" id="dicht">Sluiten</button><img id="zoomimg" alt=""></dialog>
<script src="data/spotprenten.js"></script>
<script src="ai.js"></script>
<script src="nakijker.js"></script>
<script>
(function(){
var L=window.SPOTPRENTEN,id=(/[?&]p=([\w-]+)/.exec(location.search)||[])[1],P=L.filter(function(x){return x.id===id;})[0]||L[0];
var KEY="gv-spot-"+P.id,MAXPOGING=3,app=document.getElementById("app"),S;
if(!id){ // overzicht van alle prenten
  var vg=function(q){try{var z=JSON.parse(localStorage.getItem("gv-spot-"+q.id))||{};return Object.keys(z.ai||{}).filter(function(k){return z.ai[k].status==="ok";}).length;}catch(e){return 0;}};
  var kaart=function(q){var n=vg(q);return '<a class="okaart card" href="spotprent.html?p='+q.id+'"><img src="'+q.img+'" alt="" loading="lazy"><span><b>'+GV_AI.esc(q.titel)+'</b><small>'+GV_AI.esc(q.maker)+', '+q.jaar+' · '+GV_AI.esc(q.onderwerp)+'</small>'+(q.examen?'<em>Centraal examen '+GV_AI.esc(q.examen[0].code)+'</em>':'')+(n?'<i>'+n+' van 4 stappen nagekeken</i>':'')+'</span></a>';};
  document.title="Spotprenten oefenen · Geschiedenis";
  app.innerHTML='<a class="muted" href="index.html">← Terug naar het overzicht</a><div class="eyebrow" style="margin-top:20px">Examentraining</div><h1>Spotprenten oefenen</h1><p class="muted" style="max-width:680px;margin:0">Op het examen staan elk jaar spotprenten. Kies een prent. Je ontdekt eerst de onderdelen, daarna loop je de Kijkwijzer door. Bij de examenprenten maak je aan het eind de echte examenvraag.</p>'+
    '<div class="card" style="margin-top:18px"><b>Extra opdrachten</b> <span class="muted">met alle prenten:</span><div class="row"><a class="btn" href="spotprent-opdrachten.html?tab=bijschrift">Kies het bijschrift</a><a class="btn" href="spotprent-opdrachten.html?tab=tijdlijn">Zet ze op de tijdlijn</a><a class="btn" href="spotprent-opdrachten.html?tab=vergelijken">Vergelijk twee prenten</a></div></div>'+
    '<h2 style="margin-top:26px">Uit je boekje</h2><div class="ogrid">'+L.filter(function(q){return !q.examen;}).map(kaart).join("")+'</div>'+
    '<h2 style="margin-top:26px">Uit het centraal examen</h2><div class="ogrid">'+L.filter(function(q){return q.examen;}).sort(function(a,b){return a.jaar-b.jaar;}).map(kaart).join("")+'</div>'+
    '<p class="muted" style="font-size:13px;margin-top:20px">Alle prenten zijn rechtenvrij (publiek domein). Examenvragen: College voor Toetsen en Examens, ongewijzigd overgenomen.</p>';
  return;
}
try{S=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){S={};}
var HS=P.hotspots||[],EX=P.examen||[];
var STD={1:{label:"Algemeen",hulp:["Lees de informatie bij de prent: onderwerp, tekenaar, jaartal.","Wat zegt de titel of het bijschrift? Vaak is dat een samenvatting.","Wat weet je over de tekenaar? Bij welke groep hoorde hij?"],vraag:"Over welk onderwerp gaat deze spotprent, en hoe weet je dat? Wat weet je over de tekenaar?"},
 2:{label:"De personen",hulp:["Wie stellen de personen voor? Let op kleding, grootte en teksten.","Zijn ze positief of negatief getekend? Hoe zie je dat?","Wat doen de personen?"],vraag:"Wie stellen de personen voor? Hoe zijn ze getekend en wat doen ze?"},
 3:{label:"Andere delen",hulp:["Welke dingen zie je nog? Kijk ook naar teksten en details.","Wat stellen die dingen voor?"],vraag:"Wat zie je nog meer op de spotprent, en wat betekent dat? Noem minstens twee dingen."},
 4:{label:"Conclusie",hulp:["Wat is de boodschap van de tekenaar?","Hoe weet je dat? Gebruik wat je bij stap 1 tot en met 3 hebt gevonden."],vraag:"Wat is de boodschap van de tekenaar? Leg uit hoe je dat aan de spotprent ziet."}};
P.stappen.forEach(function(s){var d=STD[s.stap]||{};s.label=s.label||d.label;s.hulp=s.hulp||d.hulp||[];s.vraag=s.vraag||d.vraag;});
S.antw=S.antw||{};S.ai=S.ai||{};S.n=S.n||{};S.model=S.model||{};S.hint=S.hint||{};S.hs=S.hs||{};
if(S.cur==null)S.cur=HS.length?0:1;if(!HS.length&&!S.cur)S.cur=1;if(S.cur===9&&!EX.length)S.cur=1;S.ex=S.ex||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var esc=GV_AI.esc,bezig={};
function stap(n){return P.stappen.filter(function(s){return s.stap===n;})[0];}

function page(){
  var terug=/boekje-2\//.test(document.referrer)?"boekje-2/onderzoek.html":"spotprent.html";
  var h='<a class="muted" href="'+terug+'">← '+(terug==="spotprent.html"?"Alle spotprenten":"Terug naar de leeromgeving")+'</a><div class="eyebrow" style="margin-top:20px">Spotprent analyseren · Kijkwijzer</div><h1>'+esc(P.titel)+'</h1><p class="muted" style="max-width:640px;margin:0">'+esc(P.intro)+'</p>';
  var r=P.formaat?P.formaat[0]/P.formaat[1]:.75;
  h+='<div class="grid"><div class="prent card"><figure><div class="plaat" style="--r:'+r+'"><img id="img" src="'+P.img+'" alt="Spotprent: '+esc(P.titel)+'. '+esc(P.beschrijving)+'"'+(P.formaat?' width="'+P.formaat[0]+'" height="'+P.formaat[1]+'"':'')+'>'+
    HS.map(function(p,i){return '<button class="hs'+(hsKlaar(i)?' gedaan':'')+'" data-hs="'+i+'" style="left:'+p.x+'%;top:'+p.y+'%" aria-pressed="'+(S.cur===0&&S.sel===i)+'" aria-label="Onderdeel '+(i+1)+': '+esc(p.naam)+'">'+(hsKlaar(i)?'✓':i+1)+'</button>';}).join("")+
    '</div><figcaption>'+esc(P.bronvermelding)+(HS.length?' Tik op een rond punt om dat onderdeel te onderzoeken. Tik op de prent zelf om te vergroten.':' Tik op de prent om te vergroten.')+'</figcaption></figure></div>';
  h+='<div><nav class="steps" aria-label="Stappen van de Kijkwijzer">'+(HS.length?'<button class="ontdek'+(nKlaar()===HS.length?' klaar':'')+'" data-stap="0"'+(S.cur===0?' aria-current="step"':'')+'>Ontdek de prent<small>'+nKlaar()+' van '+HS.length+' onderdelen bekeken</small></button>':'')+P.stappen.map(function(s){var f=S.ai[s.stap];
    return '<button data-stap="'+s.stap+'"'+(S.cur===s.stap?' aria-current="step"':'')+(f&&f.status==="ok"?' class="klaar"':'')+'>Stap '+s.stap+' · '+esc(s.label)+'<small>'+(f&&f.status==="ok"?f.punten+'/'+f.max+' punten':'nog doen')+'</small></button>';}).join("")+
    (EX.length?'<button class="ontdek examen" data-stap="9"'+(S.cur===9?' aria-current="step"':'')+'>Examenvraag<small>Uit het centraal examen '+esc(EX[0].code)+'</small></button>':'')+'</nav>';
  h+='<div id="stap">'+stapHtml()+'</div><div id="totaal">'+totaalHtml()+'</div></div></div>';
  app.innerHTML=h;
}
function hsKlaar(i){return !!(S.hs[i]&&S.hs[i].lvl>=3);}
function nKlaar(){return HS.filter(function(p,i){return hsKlaar(i);}).length;}
var HINTNAAM=["Denkvraag","Tip"];
function hintHtml(lijst,lvl){return lijst.slice(0,Math.min(lvl,lijst.length)).map(function(t,i){return '<div class="hint fade"><b>'+HINTNAAM[i]+':</b> '+esc(t)+'</div>';}).join("");}
function ontdekHtml(){
  var i=S.sel;
  if(i==null||!HS[i])return '<div class="card fade"><h2>Ontdek de prent</h2><p>Een spotprent bestaat uit onderdelen: personen, voorwerpen en teksten. Tik op een rond punt op de prent, of kies hieronder een onderdeel. Bedenk eerst zelf wat het betekent. Lukt dat niet, vraag dan een hint.</p><ul class="hslist">'+
    HS.map(function(p,j){return '<li><button class="'+(hsKlaar(j)?'gedaan':'')+'" data-hs="'+j+'"><span class="nr">'+(hsKlaar(j)?'✓':j+1)+'</span>'+esc(p.naam)+'</button></li>';}).join("")+'</ul>'+
    (nKlaar()===HS.length?'<div class="row"><button class="btn" data-stap="1">Alles bekeken: naar stap 1 →</button></div>':'')+'</div>';
  var p=HS[i],z=S.hs[i]||{a:"",lvl:0};
  var h='<div class="card fade"><span class="tag">Onderdeel '+(i+1)+' van '+HS.length+' · hoort bij stap '+p.stap+'</span><h2>'+esc(p.naam)+'</h2><p class="vraag">'+esc(p.vraag)+'</p>';
  h+='<textarea class="klein" id="hsta" aria-label="Wat denk jij?" placeholder="Wat denk jij? Schrijf het kort op.">'+esc(z.a||"")+'</textarea>';
  h+=hintHtml(p.hints,z.lvl);
  h+='<div class="row">'+(z.lvl<2?'<button class="btn ghost" id="hshint">Hint '+(z.lvl+1)+' van 2</button>':'')+(z.lvl<3?'<button class="btn" id="hsuitleg">Bekijk de uitleg</button>':'')+'</div>';
  if(z.lvl>=3)h+='<div class="model fade"><b>Uitleg:</b> '+esc(p.uitleg)+'</div>';
  h+='<div class="row"><button class="btn ghost" id="hslijst">← Alle onderdelen</button>'+(i<HS.length-1?'<button class="btn ghost" data-hs="'+(i+1)+'">Volgend onderdeel →</button>':'<button class="btn ghost" data-stap="1">Naar stap 1 →</button>')+'</div>';
  return h+'</div>';}
function exNaam(e){var c=e.code.split("-");return "Centraal examen "+c[0]+", tijdvak "+c[1]+", vraag "+e.nr+" ("+e.p+(e.p>1?" punten":" punt")+")";}
function examHtml(){
  var h='<div class="card fade"><h2>Examenvraag</h2><p class="muted" style="margin:0 0 6px">Deze spotprent stond echt in het centraal examen. Maak de examenvraag zoals op het examen. Je hebt nu alles al onderzocht, dus dat lukt!</p>';
  EX.forEach(function(e,i){var z=S.ex[i]||{};
    h+='<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px"><span class="tag">'+esc(exNaam(e))+'</span><p class="vraag">'+esc(e.vraag)+'</p>';
    if(e.type==="mk"){
      h+='<div class="mk" role="radiogroup" aria-label="Kies één antwoord">'+e.opties.map(function(o,j){var L="ABCD"[j],gek=z.keuze===L,af=!!z.klaar;
        var cls=af?(L===e.antwoord?" goed":(gek?" fout":"")):"";
        return '<button class="mkopt'+cls+'" role="radio" aria-checked="'+gek+'" data-mk="'+i+'" data-l="'+L+'"'+(af?' disabled':'')+'><b>'+L+'</b> '+esc(o)+'</button>';}).join("")+'</div>';
      if(!z.klaar)h+='<div class="row"><button class="btn" data-exchk="'+i+'"'+(z.keuze?'':' disabled')+'>Controleer</button></div>';
      else h+='<div class="model fade">'+(z.keuze===e.antwoord?'<b>Goed!</b> Het juiste antwoord is '+e.antwoord+'.':'<b>Helaas.</b> Het juiste antwoord is '+e.antwoord+'. Kijk nog eens naar de prent: welk onderdeel laat dat zien?')+'</div><div class="row"><button class="btn ghost" data-exopn="'+i+'">Opnieuw proberen</button></div>';
    }else{
      var f=z.ai;
      h+='<textarea id="exta-'+i+'" data-ex="'+i+'" aria-label="Jouw antwoord op de examenvraag" placeholder="Schrijf je antwoord zoals op het examen.">'+esc(z.antw||"")+'</textarea><div class="row">';
      if(GV_NK.enabled)h+='<button class="btn" data-exnk="'+i+'"'+(bezig["ex"+i]?' disabled':'')+'>'+(f?"Laat opnieuw nakijken":"Laat nakijken")+'</button>';
      h+='<button class="btn ghost" data-excv="'+i+'">'+(z.cv?"Verberg":"Bekijk")+' het correctievoorschrift</button></div>';
      h+='<div>'+(bezig["ex"+i]?'<div class="aiwait">AI kijkt je antwoord na…</div>':f?GV_NK.render(f):"")+'</div>';
      if(z.cv)h+='<div class="model fade"><b>Correctievoorschrift ('+e.p+(e.p>1?' punten':' punt')+'):</b><ul style="margin:6px 0 0;padding-left:20px">'+e.cv.map(function(c){return '<li>'+esc(c.t)+' <span class="muted">('+c.p+'p)</span></li>';}).join("")+'</ul></div>';
    }
    h+='<p class="muted" style="font-size:13px;margin:10px 0 0">Bron: CvTE, <a href="'+esc(e.url)+'" target="_blank" rel="noopener">het examen op examenblad.nl</a> (vraag ongewijzigd overgenomen).</p></div>';
  });
  return h+'</div>';}
function exNakijken(i){var e=EX[i],z=S.ex[i]=S.ex[i]||{},ans=(document.getElementById("exta-"+i).value||"").trim();
  if(ans.length<3){alert("Schrijf eerst je antwoord.");return;}
  z.antw=ans;bezig["ex"+i]=1;save();page();
  GV_NK.check({h:P.h,vraag:e.vraag,punten:e.cv,bron:(P.bronvermelding+"\n"+P.beschrijving).slice(0,4000),antwoord:ans.slice(0,2000)}).then(function(f){
    delete bezig["ex"+i];z.ai=f.status==="ok"?f:{status:"fout",melding:f.melding||"De AI kon nu niet nakijken. Bekijk het correctievoorschrift."};save();page();});}
function stapHtml(){if(S.cur===0)return ontdekHtml();if(S.cur===9)return examHtml();
  var s=stap(S.cur),f=S.ai[s.stap],n=S.n[s.stap]||0,last=s.stap===P.stappen.length,hl=S.hint[s.stap]||0,hn=(s.hints||[]).length;
  var h='<div class="card fade"><h2>Stap '+s.stap+' · '+esc(s.label)+'</h2><ul class="hulp">'+s.hulp.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';
  var bij=HS.map(function(p,i){return p.stap===s.stap?i:-1;}).filter(function(i){return i>=0;});
  if(bij.length)h+='<p class="muted" style="font-size:14px;margin:0 0 6px">Kijk nog eens naar onderdeel '+bij.map(function(i){return '<a href="#" data-hs="'+i+'">'+(i+1)+' ('+esc(HS[i].naam.toLowerCase())+')</a>';}).join(", ")+'.</p>';
  h+='<p class="vraag">'+esc(s.vraag)+'</p><textarea id="ta" aria-label="Jouw antwoord bij stap '+s.stap+'" placeholder="Schrijf in hele zinnen. Begin bijvoorbeeld met: Ik zie dat …">'+esc(S.antw[s.stap]||"")+'</textarea>';
  h+=hintHtml(s.hints||[],hl);
  h+='<div class="row">';
  if(hl<hn)h+='<button class="btn ghost" id="hint">Hint '+(hl+1)+' van '+hn+'</button>';
  if(GV_NK.enabled&&!(f&&f.status==="ok"&&f.punten===f.max))h+='<button class="btn" id="check"'+(bezig[s.stap]||n>=MAXPOGING?" disabled":"")+'>'+(f?"Laat opnieuw nakijken":"Laat nakijken")+'</button>';
  if(f||S.model[s.stap]||!GV_NK.enabled||hl>=hn)h+='<button class="btn ghost" id="model">'+(S.model[s.stap]?"Verberg":"Bekijk")+' het modelantwoord</button>';
  if(!last)h+='<button class="btn ghost" id="next">Volgende stap →</button>';else if(EX.length)h+='<button class="btn ghost" data-stap="9">Naar de examenvraag →</button>';
  h+='</div>';
  if(n>=MAXPOGING&&f&&f.status==="ok"&&f.punten<f.max)h+='<p class="muted" style="font-size:14px">Je hebt '+MAXPOGING+' keer laten nakijken. Vergelijk je antwoord nu met het modelantwoord.</p>';
  h+='<div id="fb">'+(bezig[s.stap]?'<div class="aiwait">AI kijkt je antwoord na…</div>':f?GV_NK.render(f):"")+'</div>';
  if(S.model[s.stap])h+='<div class="model"><b>Modelantwoord:</b> '+esc(s.model)+'</div>';
  return h+'</div>';}
function totaalHtml(){var gedaan=P.stappen.filter(function(s){var f=S.ai[s.stap];return f&&f.status==="ok";});
  if(gedaan.length<P.stappen.length)return "";
  var p=0,m=0;gedaan.forEach(function(s){p+=S.ai[s.stap].punten;m+=S.ai[s.stap].max;});
  return '<div class="card totaal fade"><div class="eyebrow">Klaar met de Kijkwijzer</div><h2>'+p+' van '+m+' punten</h2><ol>'+P.stappen.map(function(s){return '<li>'+esc(s.label)+': '+S.ai[s.stap].punten+'/'+S.ai[s.stap].max+'</li>';}).join("")+'</ol><div class="row">'+(L.length>1?L.filter(function(x){return x.id!==P.id;}).map(function(x){return '<a class="btn ghost" href="spotprent.html?p='+x.id+'">'+esc(x.titel)+'</a>';}).join(""):"")+'<button class="btn ghost" id="reset">Opnieuw beginnen</button></div></div>';}

function nakijken(){var s=stap(S.cur),k=s.stap,ans=document.getElementById("ta").value.trim();
  if(ans.length<3){document.getElementById("fb").innerHTML='<div class="aifb"><p class="ainote">Schrijf eerst je antwoord.</p></div>';return;}
  S.antw[k]=ans;S.n[k]=(S.n[k]||0)+1;bezig[k]=1;save();vernieuw();
  GV_NK.check({h:P.h,vraag:s.vraag,punten:s.punten,bron:(P.bronvermelding+"\n"+P.beschrijving).slice(0,4000),antwoord:ans.slice(0,2000)}).then(function(f){
    delete bezig[k];S.ai[k]=f.status==="ok"?f:{status:"fout",melding:f.melding||"De AI kon nu niet nakijken. Bekijk het modelantwoord."};
    if(f.status!=="ok")S.n[k]--; // mislukte poging telt niet
    save();if(S.cur===k)vernieuw();else page();});}
function vernieuw(){page();var t=document.getElementById("ta");if(t&&!t.value)t.focus();}

app.addEventListener("click",function(e){
  var hb=e.target.closest("[data-hs]");if(hb){e.preventDefault();bewaar();S.cur=0;S.sel=+hb.dataset.hs;save();page();document.getElementById("stap").scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});return;}
  if(e.target.closest("#hslijst")){bewaar();S.sel=null;save();page();return;}
  if(e.target.closest("#hshint")){bewaar();var z=S.hs[S.sel]=S.hs[S.sel]||{a:"",lvl:0};z.lvl++;save();page();return;}
  if(e.target.closest("#hsuitleg")){bewaar();var z2=S.hs[S.sel]=S.hs[S.sel]||{a:"",lvl:0};z2.lvl=3;save();page();return;}
  if(e.target.closest("#hint")){bewaar();S.hint[S.cur]=(S.hint[S.cur]||0)+1;save();page();return;}
  var b=e.target.closest("[data-stap]");if(b){bewaar();S.cur=+b.dataset.stap;save();page();document.getElementById("stap").scrollIntoView({block:"nearest"});return;}
  if(e.target.closest("#check")){nakijken();return;}
  var mk=e.target.closest("[data-mk]");if(mk){var zi=S.ex[mk.dataset.mk]=S.ex[mk.dataset.mk]||{};zi.keuze=mk.dataset.l;save();page();return;}
  var ec=e.target.closest("[data-exchk]");if(ec){S.ex[ec.dataset.exchk].klaar=1;save();page();return;}
  var eo=e.target.closest("[data-exopn]");if(eo){S.ex[eo.dataset.exopn]={};save();page();return;}
  var en=e.target.closest("[data-exnk]");if(en){exNakijken(+en.dataset.exnk);return;}
  var ev=e.target.closest("[data-excv]");if(ev){bewaar();var zv=S.ex[ev.dataset.excv]=S.ex[ev.dataset.excv]||{};zv.cv=!zv.cv;save();page();return;}
  if(e.target.closest("#model")){bewaar();S.model[S.cur]=!S.model[S.cur];save();page();return;}
  if(e.target.closest("#next")){bewaar();S.cur++;save();page();document.getElementById("stap").scrollIntoView({block:"nearest"});return;}
  if(e.target.closest("#reset")){if(confirm("Opnieuw beginnen? Je antwoorden bij deze prent worden gewist.")){S={antw:{},ai:{},n:{},model:{},hint:{},hs:{},ex:{},cur:HS.length?0:1};save();page();}return;}
  if(e.target.closest("#img")){var d=document.getElementById("zoom");document.getElementById("zoomimg").src=P.img;document.getElementById("zoomimg").alt=P.titel;d.showModal();}
});
app.addEventListener("input",function(e){if(e.target.id==="ta"){S.antw[S.cur]=e.target.value;save();}if(e.target.dataset&&e.target.dataset.ex!=null){(S.ex[e.target.dataset.ex]=S.ex[e.target.dataset.ex]||{}).antw=e.target.value;save();}if(e.target.id==="hsta"){(S.hs[S.sel]=S.hs[S.sel]||{a:"",lvl:0}).a=e.target.value;save();}});
function bewaar(){var t=document.getElementById("ta");if(t){S.antw[S.cur]=t.value;}document.querySelectorAll("textarea[data-ex]").forEach(function(x){(S.ex[x.dataset.ex]=S.ex[x.dataset.ex]||{}).antw=x.value;});var u=document.getElementById("hsta");if(u&&S.sel!=null){(S.hs[S.sel]=S.hs[S.sel]||{a:"",lvl:0}).a=u.value;}}
var dz=document.getElementById("zoom");dz.addEventListener("click",function(e){if(e.target===dz||e.target.id==="dicht")dz.close();});
page();
})();
</script>
</body>
</html>
