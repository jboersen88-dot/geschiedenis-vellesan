<head>

<title>Online oefentoets · Economie SE3</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{--green:#1f5f4e;--green-2:#174a3d;--coral:#ff8d90;--berry:#c2484d;--teal:#2f8f86;--bg:#f6f0e6;--card:#fffdf9;--ink:#201a14;--muted:#6f6556;--line:#e6dac4;--ok:#1d8a5a;--ok-soft:#e1f4ea;--bad:#c0392b;--bad-soft:#fbe9e7;--sel:#e7f3ef;
--ease-out:cubic-bezier(.23,1,.32,1);--shadow:0 1px 2px rgba(31,95,78,.06),0 10px 28px rgba(31,95,78,.08)}
:root[data-theme=dark]{--bg:#17201d;--card:#1f2b27;--ink:#f2ece0;--muted:#a79f90;--line:#34433d;--ok-soft:#183a2b;--bad-soft:#44201c;--sel:#23423a;--green:#8fd3bd}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17201d;--card:#1f2b27;--ink:#f2ece0;--muted:#a79f90;--line:#34433d;--ok-soft:#183a2b;--bad-soft:#44201c;--sel:#23423a;--green:#8fd3bd}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 96px}
h1,h2{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em;line-height:1.15;color:var(--green);margin:0}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:22px;margin:34px 0 12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--berry)}
.muted{color:var(--muted)}
a{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:600 15px Inter,sans-serif;background:var(--berry);color:#fff;cursor:pointer;text-decoration:none;min-height:44px;transition:transform .16s var(--ease-out),filter .16s var(--ease-out),background-color .16s var(--ease-out);touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
@media(hover:hover) and (pointer:fine){.btn:hover:not(:disabled){filter:brightness(1.07)}.btn.ghost:hover{border-color:var(--berry)}}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}
.pick{display:grid;gap:14px;margin-top:22px}
.pk{display:grid;grid-template-columns:1fr auto;gap:6px 14px;text-align:left;padding:18px 20px;cursor:pointer;color:inherit;font:inherit;transition:transform .2s var(--ease-out),border-color .2s var(--ease-out)}
.pk b{font:700 19px Fraunces,serif;color:var(--green)}
.pk small{grid-column:1;color:var(--muted)}
.pk .go{grid-row:1/3;grid-column:2;align-self:center;font-weight:700;color:var(--berry)}
.pk:active{transform:scale(.99)}
@media(hover:hover) and (pointer:fine){.pk:hover{transform:translateY(-2px);border-color:var(--coral)}}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:10px 16px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .t{font:700 22px Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--green);min-width:70px}
.bar .t.low{color:var(--bad)}
.bar .pr{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .pr i{display:block;height:100%;width:0;background:var(--teal);transform-origin:left;transition:width .3s var(--ease-out)}
.bar small{color:var(--muted);white-space:nowrap}
.q{margin-top:16px}
.q .n{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--berry)}
.q p{margin:4px 0 14px;font-weight:600;font-size:17px;text-wrap:pretty}
.opts{display:grid;gap:.9rem}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font:500 16px/1.4 Inter,sans-serif;color:inherit;cursor:pointer;min-height:52px;transition:border-color .16s var(--ease-out),background-color .16s var(--ease-out),transform .16s var(--ease-out);touch-action:manipulation}
.opt .l{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:14px;color:var(--ink);transition:background-color .16s var(--ease-out),color .16s}
.opt:active{transform:scale(.99)}
.opt[aria-checked=true]{border-color:var(--teal);background:var(--sel)}
.opt[aria-checked=true] .l{background:var(--teal);color:#fff}
@media(hover:hover) and (pointer:fine){.opt:not([disabled]):hover{border-color:var(--coral)}}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:16px/1.5 Inter,sans-serif;background:var(--card);color:var(--ink);resize:vertical;transition:border-color .16s}
textarea:focus{border-color:var(--teal);outline:none}
.bron{border-left:4px solid var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--card));border-radius:0 12px 12px 0;padding:12px 14px;margin:6px 0 12px;font-size:15px}
.bron table{border-collapse:collapse;margin-top:6px}.bron td{border:1px solid var(--line);padding:5px 10px}
.fb{margin-top:10px;font-size:15px;color:var(--muted)}
.res{text-align:center;padding:26px 20px}
.grade{font:700 clamp(56px,14vw,88px) Fraunces,serif;line-height:1;color:var(--green)}
.grade.bad{color:var(--bad)}
.nk{margin-top:12px;display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok);flex:none}
.chk span{flex:1}
.chk small{color:var(--muted);white-space:nowrap}
.mine{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.mine mark.hit{background:color-mix(in srgb,#2e9b6b 22%,transparent);color:inherit;border-radius:4px;padding:0 2px}.mine mark.hit sup{font-size:10px;font-weight:800;color:#2e9b6b;margin-left:2px}
.beter{margin-top:12px}.beter textarea{margin-top:6px}.beter>.n{margin-top:4px}
.mine:empty:before{content:"Niet beantwoord";color:var(--muted)}
.aibox:empty{display:none}.aibox{margin-top:4px}.aiwait{margin-top:12px;font-size:14px;color:var(--muted)}.aiwait:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid var(--teal);border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.aiwait:before{animation:none}}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.stepper button{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:700 16px Inter;cursor:pointer;color:inherit}
.stepper button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.stick{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;z-index:9}
[hidden]{display:none!important}
.fade{animation:in .28s var(--ease-out) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}*{transition-duration:.01ms!important}}
.rk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.rk .rl{font-weight:600;margin-bottom:8px}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input.num{width:9.5em;max-width:100%;min-height:44px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:16px Inter,sans-serif;background:var(--card);color:var(--ink);transition:border-color .16s}
input.num:focus{border-color:var(--teal);outline:none}
.stepper button.w{padding:0 16px}textarea.s{min-height:76px}
.rr{padding:8px 10px;border-radius:10px;margin:6px 0;border:1.5px solid var(--line)}.rr.ok{border-color:var(--ok);background:var(--ok-soft)}.rr.bad{border-color:var(--bad);background:var(--bad-soft)}
.bron th{border:1px solid var(--line);padding:5px 10px;text-align:left;background:color-mix(in srgb,var(--line) 40%,transparent)}
.bron .t{margin-bottom:6px}
</style>
</head>

<script>
var B={"mc_basis":[{"v":"Wat is een primair inkomen?","o":["Inkomen dat je zelf verdient, zoals loon of winst","Inkomen dat je van de overheid krijgt, zonder dat je ervoor werkt","Inkomen dat alleen kinderen ontvangen, zoals zakgeld","Inkomen dat een bedrijf afdraagt aan de Belastingdienst"],"j":0,"u":"Een primair inkomen verdien je zelf met arbeid of bezit, zoals loon, winst, rente of huur. B is een secundair inkomen (overdrachtsinkomen)."},{"v":"Welk onderdeel van de marketingmix gaat over de verkoopprijs van een product?","o":["Personeelsbeleid","Prijsbeleid","Plaatsbeleid","Presentatiebeleid"],"j":1,"u":"Prijsbeleid is de P van Prijs uit de marketingmix: kies je voor een hoge of een lage prijs?"},{"v":"Wat meet de Lorenzcurve?","o":["De hoogte van de inflatie in een land","De hoogte van het sociaal minimum","De verdeling van inkomens onder de bevolking","De hoogte van de koopkracht van huishoudens"],"j":2,"u":"De Lorenzcurve laat zien hoe het inkomen over de bevolking verdeeld is. Hoe verder de curve van de diagonaal af ligt, hoe ongelijker de verdeling."},{"v":"Wat is welzijn?","o":["De hoeveelheid geld die iemand per maand verdient","De prijs van goederen in verhouding tot het inkomen","De hoeveelheid spullen die iemand kan kopen","De brede kwaliteit van leven, zoals gezondheid en geluk"],"j":3,"u":"Welzijn is de brede kwaliteit van leven (gezondheid, geluk, vrijheid, veiligheid). Welvaart gaat over hoe goed je met goederen en diensten in je behoeften kunt voorzien."},{"v":"Wanneer noem je een goed ‘schaars’?","o":["Als er productiemiddelen nodig zijn om het te maken","Als het product duur is in de winkel","Als bijna niemand het product wil kopen","Als het product alleen in het buitenland te koop is"],"j":0,"u":"Economisch schaars betekent: er zijn productiemiddelen (arbeid, kapitaal, natuur) voor nodig. \"Er is weinig van\" is géén economische definitie."},{"v":"Wat doet het CBS?","o":["Het bepaalt de hoogte van de rente in Nederland","Het verzamelt cijfers over de Nederlandse economie","Het int belasting namens de Nederlandse overheid","Het keurt reclames van bedrijven vooraf goed"],"j":1,"u":"Het CBS (Centraal Bureau voor de Statistiek) verzamelt cijfers over Nederland, bijvoorbeeld de CPI voor de inflatie."},{"v":"Wat gebeurt er met je koopkracht als prijzen sneller stijgen dan je loon?","o":["Je koopkracht stijgt","Je koopkracht blijft precies gelijk","Je koopkracht daalt","Dit is niet vast te stellen"],"j":2,"u":"Stijgen de prijzen harder dan je loon, dan kun je minder kopen: je koopkracht daalt."},{"v":"Wat betekent een indexcijfer van 100?","o":["De prijs is nul euro","Er is dat jaar geen prijsstijging geweest","De prijzen zijn sindsdien verdubbeld","Dit is het cijfer van het basisjaar, het vergelijkingspunt"],"j":3,"u":"Het basisjaar krijgt altijd indexcijfer 100. Daarmee vergelijk je de andere jaren."},{"v":"Welke uitgave is een vaste last?","o":["Een weekend weg met je vrienden","De wekelijkse boodschappen voor thuis","De maandelijkse huur van je woning","Een nieuwe wasmachine voor in huis"],"j":2,"u":"Huur betaal je met vaste regelmaat: een vaste last. Boodschappen zijn dagelijkse uitgaven, een wasmachine en een weekend weg zijn incidenteel."},{"v":"Wat is het doel van budgetteren?","o":["Zo veel mogelijk geld opzij zetten","Precies weten hoeveel belasting je moet betalen","Een lening afsluiten tegen een lage rente","Inkomsten en uitgaven met elkaar in balans brengen"],"j":3,"u":"Met een budgetplan zorg je dat je inkomsten en uitgaven met elkaar in balans zijn."},{"v":"Wat is een spaarmotief?","o":["Een reden waarom iemand geld opzij zet","Een reden waarom iemand geld leent","Een reden waarom iemand gaat beleggen in aandelen","Een reden waarom een bank rente vraagt"],"j":0,"u":"Een spaarmotief is een reden om te sparen: voor een doel, uit voorzorg of voor de rente."},{"v":"Wat is het belangrijkste risico van beleggen in aandelen?","o":["Je kunt je geld nooit meer opnemen","De koers kan dalen, waardoor je verlies lijdt","Je betaalt altijd hoge kosten aan de bank","Je krijgt nooit dividend uitgekeerd"],"j":1,"u":"De koers van een aandeel kan dalen. Verkoop je dan, dan lijd je verlies."},{"v":"Waarom vraagt een bank bij een hypotheek om de woning als onderpand?","o":["Omdat dit wettelijk verplicht is bij elke soort lening","Omdat de bank de woning zelf wil gaan gebruiken","Zodat de bank het huis kan verkopen als je niet betaalt","Omdat de rente hierdoor automatisch lager wordt"],"j":2,"u":"Het huis is het onderpand: betaalt de klant niet terug, dan mag de bank het huis verkopen."},{"v":"Wat is géén geldfunctie?","o":["Ruilmiddel","Rekenmiddel","Spaarmiddel","Productiemiddel"],"j":3,"u":"De drie geldfuncties zijn ruilmiddel, rekenmiddel en spaarmiddel. Productiemiddel hoort er niet bij."},{"v":"Wat is chartaal geld?","o":["Munten en briefgeld","Geld dat alleen op een bankrekening staat","Geld dat een bank uitleent aan klanten","Geld dat is belegd in aandelen"],"j":0,"u":"Chartaal geld is contant geld: munten en bankbiljetten. Geld op je rekening is giraal geld."},{"v":"Wat kan de ECB doen om hoge inflatie te bestrijden?","o":["De belasting op producten verlagen","De rente verhogen","Meer geld bijdrukken voor de eurolanden","De lonen van werknemers bevriezen"],"j":1,"u":"Bij een hogere rente gaan mensen meer sparen en minder lenen. Er wordt minder besteed, waardoor prijzen minder snel stijgen."}],"mc_verd":[{"v":"Een frisdrankmerk plaatst een reclame waarin vooral het logo in beeld komt, met de boodschap “wij dragen bij aan een betere wereld”. Wat voor reclame is dit vooral?","o":["Merkreclame die als ideële reclame is verpakt","Pure ideële reclame zonder commercieel doel","Informatieve reclame over de samenstelling","Sociale reclame die namens de overheid wordt gemaakt"],"j":0,"u":"Het logo en het merk staan centraal: het echte doel is het merk verkopen. De \"betere wereld\"-boodschap is de verpakking. Pure ideële reclame heeft geen commercieel doel."},{"v":"Werknemers krijgen 2,5% prijscompensatie, terwijl de inflatie dat jaar 3,1% is. Wat gebeurt er met hun koopkracht?","o":["Hun koopkracht stijgt een beetje","Hun koopkracht daalt een beetje","Hun koopkracht blijft precies gelijk","Dit is met deze gegevens niet te bepalen"],"j":1,"u":"De prijscompensatie (2,5%) is lager dan de inflatie (3,1%). De koopkracht daalt licht, met 0,6 procentpunt."},{"v":"Twee huishoudens hebben exact hetzelfde inkomen, maar het ene huishouden is veel gelukkiger dan het andere. Waar zegt dit vooral iets over?","o":["Het verschil in welvaart tussen de huishoudens","Het verschil in koopkracht tussen de huishoudens","Het verschil in welzijn tussen de huishoudens","Het verschil in besteedbaar inkomen tussen de huishoudens"],"j":2,"u":"Het inkomen (en dus de welvaart in geld) is gelijk. Het verschil in geluk zegt iets over welzijn."},{"v":"De lonen in een land stijgen twee jaar achter elkaar harder dan de prijzen. Wat is hiervan het meest waarschijnlijke gevolg?","o":["De werkloosheid daalt hierdoor automatisch","De overheid moet de belastingen verlagen","De inflatie daalt hierdoor vanzelf naar nul","De koopkracht van huishoudens stijgt in deze periode"],"j":3,"u":"Als lonen harder stijgen dan prijzen, stijgt het reële inkomen. Huishoudens kunnen meer kopen: de koopkracht stijgt."},{"v":"Familie Jansen reserveert maandelijks €40 voor de jaarlijkse autoverzekering van €480. Waarom doen zij dit?","o":["Omdat de autoverzekering een vaste maandelijkse last is","Zodat het geld er wél is wanneer de jaarrekening komt","Omdat de bank hen verplicht om te reserveren","Omdat reserveren de kosten van de verzekering verlaagt"],"j":1,"u":"Dit is reserveren: €480 : 12 maanden = €40 per maand, zodat het geld er is als de jaarrekening komt."},{"v":"Twee spaarders zetten hetzelfde bedrag voor 6 jaar vast tegen hetzelfde rentepercentage. Spaarder 1 kiest enkelvoudige rente, spaarder 2 samengestelde rente. Wie heeft na 6 jaar het meeste?","o":["Spaarder 2, want de rente groeit hier ook over eerder ontvangen rente","Spaarder 1, want enkelvoudige rente is op lange termijn altijd voordeliger","Beide spaarders hebben na 6 jaar precies evenveel geld","Dit hangt volledig af van de bank, niet van het type rente"],"j":0,"u":"Bij samengestelde rente krijg je ook rente over de rente van eerdere jaren (rente op rente). Daardoor heeft spaarder 2 meer."},{"v":"Kenji sluit een doorlopend krediet af in plaats van een persoonlijke lening, omdat hij flexibel wil kunnen bijlenen. Wat past hierbij?","o":["Bij een doorlopend krediet leen je altijd het hele bedrag in één keer","Een doorlopend krediet kan alleen worden afgesloten met een huis als onderpand","Bij een doorlopend krediet ligt het maandbedrag voor de hele looptijd vast","Bij een doorlopend krediet kan hij binnen een grens telkens opnieuw geld opnemen"],"j":3,"u":"Bij een doorlopend krediet heb je een kredietlimiet. Binnen die grens kun je steeds opnieuw geld opnemen; de rente is variabel."},{"v":"De ECB verlaagt de rente fors. Wat is het meest waarschijnlijke gevolg?","o":["Sparen wordt aantrekkelijker, lenen wordt duurder","Bestedingen van consumenten nemen hierdoor waarschijnlijk af","Lenen wordt aantrekkelijker, waardoor bestedingen kunnen toenemen","Dit heeft in de praktijk geen effect op consumenten"],"j":2,"u":"Een lage rente maakt lenen goedkoper en sparen minder aantrekkelijk. Mensen en bedrijven gaan meer lenen en besteden."}],"open_verd":[{"nr":9,"titel":"Welvaart, welzijn en het BBP","p":2,"v":"Leg uit waarom het voor de overheid belangrijk is om zowel naar welvaart als naar welzijn te kijken, en niet alleen naar het Bruto Binnenlands Product (BBP).","model":"Het BBP meet alleen de waarde van alle goederen en diensten die in een land worden geproduceerd. Dat zegt iets over de welvaart, maar niets over zaken als gezondheid, geluk, vrije tijd, veiligheid of een schoon milieu (welzijn). Een hoger BBP kan zelfs samengaan met meer stress of vervuiling. Als de overheid alleen naar het BBP kijkt, mist zij dus belangrijke delen van de kwaliteit van leven.","g":[{"t":"het BBP/welvaart meet alleen de productie of het materiële (geld, goederen en diensten).","p":1},{"t":"welzijn gaat over niet-materiële zaken (met een voorbeeld), dus de overheid moet ook daarop letten om de kwaliteit van leven echt te verbeteren.","p":1}],"h":["E4-1.3"],"opm":"Alleen een begrip noemen is niet genoeg. Geef alleen het volle punt als de leerling ook uitlegt hoe het werkt."},{"nr":10,"titel":"Loon-prijsspiraal en concurrentiepositie","p":2,"v":"Een loon-prijsspiraal kan de concurrentiepositie van Nederlandse bedrijven ten opzichte van het buitenland verzwakken. Leg uit hoe dit komt.","model":"Bij een loon-prijsspiraal stijgen eerst de prijzen. Werknemers eisen dan hogere lonen (prijscompensatie). Daardoor stijgen de loonkosten van bedrijven, die vervolgens hun prijzen weer verhogen, enzovoort. Nederlandse producten worden zo duurder dan die van buitenlandse concurrenten. Buitenlandse klanten kopen dan liever bij de goedkopere concurrent, waardoor Nederlandse bedrijven minder verkopen (exporteren).","g":[{"t":"juiste beschrijving van de spiraal (hogere prijzen → hogere lonen → hogere kosten → hogere prijzen).","p":1},{"t":"Nederlandse producten worden duurder dan buitenlandse, waardoor bedrijven minder verkopen / minder exporteren.","p":1}],"h":["E4-1.4"],"opm":"Alleen een begrip noemen is niet genoeg. Geef alleen het volle punt als de leerling ook uitlegt hoe het werkt."},{"nr":11,"titel":"Sparen bij lage rente en hoge inflatie","p":2,"v":"Leg uit waarom sparen bij een lage rente en een hoge inflatie in feite geld kan kosten, ook al daalt het bedrag op je rekening niet.","model":"Reële rente = nominale rente − inflatie. Is de rente lager dan de inflatie, dan is de reële rente negatief. Het bedrag op je rekening stijgt wel een beetje, maar de prijzen stijgen harder. Je kunt met je spaargeld dus minder kopen dan eerst: de koopkracht van je spaargeld daalt.","g":[{"t":"de prijzen (inflatie) stijgen sneller dan je spaargeld groeit door de rente / de reële rente is negatief.","p":1},{"t":"daardoor daalt de koopkracht van je spaargeld: je kunt er later minder mee kopen.","p":1}],"h":["E4-2.2","E4-1.4"],"opm":"Alleen een begrip noemen is niet genoeg. Geef alleen het volle punt als de leerling ook uitlegt hoe het werkt."},{"nr":12,"titel":"Risico voor de bank","p":2,"v":"Een bank verdient onder andere aan het renteverschil tussen sparen en lenen. Leg uit welk risico de bank hiermee loopt als veel klanten hun lening niet meer kunnen terugbetalen.","model":"Een bank leent het geld van spaarders uit aan mensen en bedrijven. Als veel klanten hun lening niet terugbetalen, krijgt de bank haar geld en de rente niet terug. De bank moet de spaarders wel hun geld plus rente terugbetalen. Zo lijdt de bank verlies en kan zij in het ergste geval in de problemen komen of failliet gaan.","g":[{"t":"de bank leent het spaargeld uit en moet spaarders wel terugbetalen.","p":1},{"t":"als leners niet terugbetalen, lijdt de bank verlies (kredietrisico).","p":1}],"h":["E4-2.3","E4-2.4"],"opm":"Alleen een begrip noemen is niet genoeg. Geef alleen het volle punt als de leerling ook uitlegt hoe het werkt."}],"rek_basis":[{"nr":1,"titel":"Koopkracht van Mila","tekst":"Mila verdient €1.850 per maand. Haar loon stijgt met 2,3%. De inflatie is dat jaar 1,6%.","delen":[{"id":"a","v":"Bereken haar nieuwe maandloon (2 decimalen).","velden":[{"type":"num","ans":[1892.55],"p":2,"eenh":"€","tol":0.005}],"uitw":["1.850 × 1,023 = €1.892,55","2 p: 1 p voor de factor 1,023 en 1 p voor het antwoord"]},{"id":"b","v":"Bereken het verschil tussen haar loonstijging en de inflatie, in procentpunten.","velden":[{"type":"num","ans":[0.7],"p":1,"eenh":"procentpunt","tol":0.005}],"uitw":["2,3 − 1,6 = 0,7 procentpunt"]},{"id":"c","v":"Neemt haar koopkracht toe of af?","velden":[{"type":"keuze","opties":["Toe","Af"],"j":0,"p":1}],"uitw":["Haar koopkracht neemt toe, want haar loon stijgt harder dan de prijzen."]},{"id":"d","v":"Bereken hoeveel euro haar loon in totaal stijgt (2 decimalen).","velden":[{"type":"num","ans":[42.55],"p":1,"eenh":"€","tol":0.005}],"uitw":["1.892,55 − 1.850 = €42,55 (of 1.850 × 0,023 = €42,55)"]}],"p":5},{"nr":2,"titel":"Indexcijfer van brood","tekst":"De prijs van een brood is dit jaar €2,35. Het indexcijfer van brood is dit jaar 106,0, met 2017 als basisjaar.","delen":[{"id":"a","v":"Bereken de prijs van een brood in het basisjaar 2017 (2 decimalen).","velden":[{"type":"num","ans":[2.22],"p":2,"eenh":"€","tol":0.005}],"uitw":["2,35 : 106,0 × 100 = €2,22","2 p: 1 p voor de berekening en 1 p voor het antwoord"]},{"id":"b","v":"Volgend jaar wordt een indexcijfer van 109,4 verwacht. Bereken de verwachte prijs (2 decimalen).","velden":[{"type":"num","ans":[2.43],"p":2,"eenh":"€","tol":0.005}],"uitw":["2,2170 × 109,4 : 100 = €2,43","Ook goed: 2,22 × 109,4 : 100 = €2,43"]}],"p":4},{"nr":3,"titel":"Enkelvoudige rente van Timo","tekst":"Timo zet €4.175 op een spaarrekening tegen 1,8% enkelvoudige rente per jaar, voor 3 jaar.","delen":[{"id":"a","v":"Bereken de rente die hij per jaar ontvangt (2 decimalen).","velden":[{"type":"num","ans":[75.15],"p":2,"eenh":"€","tol":0.005}],"uitw":["4.175 × 0,018 = €75,15 per jaar"]},{"id":"b","v":"Bereken de totale rente na 3 jaar (2 decimalen).","velden":[{"type":"num","ans":[225.45],"p":1,"eenh":"€","tol":0.005}],"uitw":["75,15 × 3 = €225,45"]},{"id":"c","v":"Bereken het eindbedrag (inleg + rente).","velden":[{"type":"num","ans":[4400.45],"p":2,"eenh":"€","tol":0.005}],"uitw":["4.175 + 225,45 = €4.400,45"]}],"p":5},{"nr":4,"titel":"Samengestelde rente van Noor","tekst":"Noor zet €2.900 op een spaarrekening met 2,2% samengestelde rente per jaar, voor 4 jaar.","delen":[{"id":"a","v":"Bereken de groeifactor bij 2,2% rente.","velden":[{"type":"num","ans":[1.022],"p":1,"eenh":"","tol":0.0005}],"uitw":["1 + 2,2 : 100 = 1,022"]},{"id":"b","v":"Bereken het eindbedrag na 4 jaar (2 decimalen).","velden":[{"type":"num","ans":[3163.75],"p":2,"eenh":"€","tol":0.005}],"uitw":["2.900 × 1,022 × 1,022 × 1,022 × 1,022 = 2.900 × 1,022⁴ = €3.163,75","2 p: 1 p voor de macht 4 (vier keer de factor) en 1 p voor het antwoord"]},{"id":"c","v":"Bereken hoeveel rente Noor in totaal heeft ontvangen.","velden":[{"type":"num","ans":[263.75],"p":1,"eenh":"€","tol":0.005}],"uitw":["3.163,75 − 2.900 = €263,75"]}],"p":4},{"nr":5,"titel":"Kredietkosten van Wesley","tekst":"Wesley wil €6.000 lenen via een persoonlijke lening. Gebruik onderstaande tabel met de maandelijkse termijnen.","delen":[{"id":"a","v":"Wesley kiest voor 60 maanden looptijd. Welk maandbedrag hoort hierbij in de tabel?","velden":[{"type":"num","ans":[113.33],"p":1,"eenh":"€ per maand","tol":0.005}],"uitw":["€113,33 per maand (rij €6.000, kolom 60 mnd)"]},{"id":"b","v":"Bereken de totale kredietkosten van deze lening (2 decimalen).","velden":[{"type":"num","ans":[799.8],"p":2,"eenh":"€","tol":0.005}],"uitw":["113,33 × 60 = €6.799,80","6.799,80 − 6.000 = €799,80 kredietkosten"]},{"id":"c","v":"Bereken de kredietkosten in procenten van het geleende bedrag (2 decimalen).","velden":[{"type":"num","ans":[13.33],"p":2,"eenh":"%","tol":0.005}],"uitw":["799,80 : 6.000 × 100 = 13,33%"]}],"tabel":[["Netto krediet","36 mnd","48 mnd","60 mnd"],["€ 6.000","178,50","137,65","113,33"],["€ 9.000","267,70","206,40","169,90"]],"p":5},{"nr":6,"titel":"Beleggen in aandelen van Sem","tekst":"Sem koopt 150 aandelen voor €18,45 per aandeel. Na een jaar verkoopt hij ze weer voor €19,75 per aandeel. Tussentijds ontving hij in totaal €0,35 dividend per aandeel.","delen":[{"id":"a","v":"Bereken de totale aankoopwaarde (inleg) van de aandelen.","velden":[{"type":"num","ans":[2767.5],"p":1,"eenh":"€","tol":0.005}],"uitw":["150 × 18,45 = €2.767,50"]},{"id":"b","v":"Bereken het totale rendement in euro's (koerswinst + dividend samen).","velden":[{"type":"num","ans":[247.5],"p":2,"eenh":"€","tol":0.005}],"uitw":["Koerswinst: (19,75 − 18,45) × 150 = €195,00","Dividend: 0,35 × 150 = €52,50","Totaal rendement: 195,00 + 52,50 = €247,50"]},{"id":"c","v":"Bereken het rendement in procenten van zijn inleg (1 decimaal).","velden":[{"type":"num","ans":[8.9],"p":1,"eenh":"%","tol":0.05}],"uitw":["247,50 : 2.767,50 × 100 = 8,9%"]}],"p":4}],"rek_verd":[{"nr":1,"titel":"Samengestelde rente en koopkracht van Sanne","tekst":"Sanne zet €3.750 op een spaarrekening met 2,6% samengestelde rente per jaar, voor 3 jaar. In diezelfde periode stijgen de prijzen (inflatie) met gemiddeld 2,1% per jaar.","delen":[{"id":"a","v":"Bereken het eindbedrag van haar spaargeld na 3 jaar (2 decimalen).","velden":[{"type":"num","ans":[4050.17],"p":3,"eenh":"€","tol":0.005}],"uitw":["Groeifactor: 1 + 2,6 : 100 = 1,026","3.750 × 1,026 × 1,026 × 1,026 = 3.750 × 1,026³ = €4.050,17","3 p: 1 p groeifactor, 1 p drie jaar (macht 3), 1 p antwoord"]},{"id":"b","v":"Bereken hoeveel rente zij in totaal heeft ontvangen.","velden":[{"type":"num","ans":[300.17],"p":1,"eenh":"€","tol":0.005}],"uitw":["4.050,17 − 3.750 = €300,17"]},{"id":"c","v":"Is de koopkracht van haar spaargeld toegenomen of afgenomen? Onderbouw je antwoord met een vergelijking tussen het rentepercentage en het inflatiepercentage.","velden":[{"type":"keuze","opties":["Toegenomen","Afgenomen"],"j":0,"p":1},{"type":"open","nr":"R1c","p":1,"label":"Onderbouwing: vergelijk het rentepercentage met het inflatiepercentage","v":"Sanne zet €3.750 op een spaarrekening met 2,6% samengestelde rente per jaar, voor 3 jaar. In diezelfde periode stijgen de prijzen (inflatie) met gemiddeld 2,1% per jaar. Is de koopkracht van haar spaargeld toegenomen of afgenomen? Onderbouw je antwoord met een vergelijking tussen het rentepercentage en het inflatiepercentage.","model":"De koopkracht van haar spaargeld is toegenomen: de rente (2,6%) is hoger dan de inflatie (2,1%). De reële rente is 2,6 − 2,1 = +0,5% per jaar.","g":[{"t":"vergelijking: de rente (2,6%) is hoger dan de inflatie (2,1%) / de reële rente is +0,5% per jaar.","p":1}],"h":["E4-2.2"]}],"uitw":["De koopkracht van haar spaargeld is toegenomen: de rente (2,6%) is hoger dan de inflatie (2,1%). De reële rente is 2,6 − 2,1 = +0,5% per jaar.","2 p: 1 p voor de vergelijking, 1 p voor de conclusie"]}],"p":6},{"nr":2,"titel":"CPI en koopkracht van Bilal","tekst":"Gebruik onderstaande tabel om de CPI te berekenen.","delen":[{"id":"a","v":"Bereken de CPI (2 decimalen).","velden":[{"type":"num","ans":[102.12,102.118],"p":2,"eenh":"","tol":0.005}],"uitw":["32 × 102,8 = 3.289,6","18 × 105,3 = 1.895,4","16 × 98,7 = 1.579,2","34 × 101,4 = 3.447,6","Totaal 10.211,8 : 100 = CPI 102,12","2 p: 1 p voor de wegingsfactoren × indexcijfers, 1 p voor het delen door 100"]},{"id":"b","v":"Bilals loon stijgt dit jaar met 1,9%. Bereken met behulp van de CPI of zijn koopkracht is gestegen of gedaald, en met hoeveel procentpunt (2 decimalen).","velden":[{"type":"keuze","opties":["Gestegen","Gedaald"],"j":1,"p":1,"label":"Zijn koopkracht is"},{"type":"num","ans":[0.22,0.21],"p":2,"eenh":"procentpunt","tol":0.005,"abs":true,"label":"Met hoeveel procentpunt (zonder min-teken)"}],"uitw":["Inflatie: 102,12 − 100 = 2,12%","Reële verandering: 1,9 − 2,12 = −0,22 procentpunt","Zijn koopkracht is gedaald, met 0,22 procentpunt.","3 p: 1 p inflatie, 1 p berekening, 1 p conclusie","Met de exacte methode (101,9 : 102,12 × 100 = 99,79, dus −0,21%) is het ook goed."]}],"tabel":[["Onderdeel","Wegingsfactor","Indexcijfer"],["Wonen","32","102,8"],["Voeding","18","105,3"],["Vervoer","16","98,7"],["Overig","34","101,4"]],"p":5},{"nr":3,"titel":"Kredietkosten van Elif","tekst":"Elif leent €7.500 en betaalt dit terug in 84 maandelijkse termijnen van €98,35.","delen":[{"id":"a","v":"Bereken de totale kredietkosten van deze lening (2 decimalen).","velden":[{"type":"num","ans":[761.4],"p":1,"eenh":"€","tol":0.005}],"uitw":["98,35 × 84 = €8.261,40","8.261,40 − 7.500 = €761,40"]},{"id":"b","v":"Bereken de kredietkosten in procenten van het geleende bedrag (2 decimalen).","velden":[{"type":"num","ans":[10.15],"p":2,"eenh":"%","tol":0.005}],"uitw":["761,40 : 7.500 × 100 = 10,15%"]}],"p":3}]};
window.TOETSEN={"t1":{"t":"Oefentoets 1","th":"Basis","rk":"Basis","min":50,"mc":B.mc_basis,"open":[],"rek":B.rek_basis},"t2":{"t":"Oefentoets 2","th":"Verdieping","rk":"Basis","min":50,"mc":B.mc_verd,"open":B.open_verd,"rek":B.rek_basis},"t3":{"t":"Oefentoets 3","th":"Basis","rk":"Verdieping","min":35,"mc":B.mc_basis,"open":[],"rek":B.rek_verd},"t4":{"t":"Oefentoets 4","th":"Verdieping","rk":"Verdieping","min":35,"mc":B.mc_verd,"open":B.open_verd,"rek":B.rek_verd}};

<script>
(function(){
"use strict";
var KEY="gs-eco-se3-toets-v1",D=window.TOETSEN,app=document.getElementById("app"),st={},cur=null,timer=null;
function load(){try{st=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){st={};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function perm(n){var a=[0,1,2,3];for(var i=3;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mcWarn(k){D[k].mc.forEach(function(q,i){var ln=q.o.map(function(x){return x.length;}),mx=Math.max.apply(null,ln),mn=Math.min.apply(null,ln);
  if(q.o.length!==4)console.warn("[meerkeuze] "+k+" vraag "+(i+1)+": "+q.o.length+" opties");
  else if(mx>20&&mx/mn>1.5)console.warn("[meerkeuze] "+k+" vraag "+(i+1)+": "+(mx/mn).toFixed(2)+"x");});}
Object.keys(D).forEach(mcWarn);
Object.keys(D).forEach(function(k){var d=D[k];d.ao=d.open.slice();d.rek.forEach(function(r){r.delen.forEach(function(dl){dl.velden.forEach(function(f){if(f.type==="open")d.ao.push(f);});});});});
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
function maxPts(k){return D[k].mc.length+D[k].open.reduce(function(a,o){return a+o.p;},0)+D[k].rek.reduce(function(a,r){return a+r.p;},0);}

/* ---------- keuzescherm ---------- */
function home(){
  clearInterval(timer);cur=null;
  var h='<a class="muted" href="app.html#toets">← Terug naar de leeromgeving</a><div class="eyebrow" style="margin-top:22px">Test jezelf</div><h1>Online oefentoets</h1><p class="muted" style="max-width:560px;margin:10px 0 0">Zonder boek en zonder hulp. De klok loopt. Aan het einde kijken de meerkeuze en de rekenopgaven zichzelf na, met het nakijkblad van je docent. De open vragen kijkt de AI na. Je antwoorden blijven op dit apparaat bewaard.</p><div class="pick">';
  Object.keys(D).forEach(function(k){var a=st[k],sub=maxPts(k)+" punten · "+D[k].min+" minuten · "+D[k].mc.length+" meerkeuze"+(D[k].open.length?" + "+D[k].open.length+" open":"")+" + "+D[k].rek.length+" rekenopgaven · theorie "+D[k].th.toLowerCase()+", rekenen "+D[k].rk.toLowerCase();
    var go=a?(a.done?"Bekijk resultaat":"Ga verder"):"Start";
    h+='<button class="card pk" data-k="'+k+'"><b>Oefentoets '+D[k].t.replace("Oefentoets ","")+'</b><span class="go">'+go+' →</span><small>'+sub+'</small></button>';});
  app.innerHTML=h+"</div>";
}
app.addEventListener("click",function(e){
  var p=e.target.closest(".pk");if(p){open(p.dataset.k);return;}
  var o=e.target.closest(".opt");if(o&&!o.disabled){var q=+o.dataset.q;st[cur].mc[q]=+o.dataset.i;save();
    o.parentNode.querySelectorAll(".opt").forEach(function(x){x.setAttribute("aria-checked",x===o?"true":"false");});prog();return;}
  if(e.target.closest("#home")){home();return;}
  if(e.target.closest("#hand")){var miss=missing();if(!miss||confirm("Je hebt "+miss+" vraag"+(miss>1?"en":"")+" nog niet beantwoord. Toch inleveren?"))finish();return;}
  if(e.target.closest("#again")){if(confirm("Opnieuw beginnen? Je antwoorden en cijfer van deze toets worden gewist."))start(cur,true);return;}
  var rt=e.target.closest("[data-retry]");if(rt){delete st[cur].ai[rt.dataset.retry];save();result();return;}
  var bt=e.target.closest("[data-beter]");if(bt){var nr=bt.dataset.beter,b=(st[cur].beter||{})[nr],box=document.getElementById("be-"+nr);
    box.innerHTML='<label class="muted" style="font-size:13px" for="bt-'+nr+'">Verbeter je antwoord. Gebruik de feedback hierboven.</label><textarea id="bt-'+nr+'">'+esc(b?b.antwoord:(st[cur].open[nr]||""))+'</textarea><button class="btn" data-bego="'+nr+'" style="margin-top:8px">Laat opnieuw nakijken</button>';
    document.getElementById("bt-"+nr).focus();return;}
  var bg=e.target.closest("[data-bego]");if(bg){var o2=D[cur].ao.filter(function(x){return String(x.nr)===bg.dataset.bego;})[0],t2=document.getElementById("bt-"+o2.nr).value.trim();
    if(t2.length<3)return;beterGo(o2,t2);return;}
  var rk=e.target.closest("[data-rk]");if(rk){var r1=st[cur].rek=st[cur].rek||{},ar=r1[rk.dataset.rk]=r1[rk.dataset.rk]||[];ar[+rk.dataset.f]=+rk.dataset.v;save();
    rk.parentNode.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===rk?"true":"false");});prog();return;}
  var xk=e.target.closest("[data-xk]");if(xk){st[cur].self["x"+xk.dataset.xk]=+xk.dataset.xp;save();
    xk.parentNode.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===xk?"true":"false");});score();return;}
  var s=e.target.closest("[data-pt]");if(s){var nr=s.dataset.nr;st[cur].self[nr]=+s.dataset.pt;save();result();return;}
});
app.addEventListener("change",function(e){var c=e.target.closest("[data-g]");if(c){var a=st[cur].self[c.dataset.nr];a=Array.isArray(a)?a:[];a[+c.dataset.g]=c.checked?1:0;st[cur].self[c.dataset.nr]=a;save();score();}});
app.addEventListener("input",function(e){
  var ri=e.target.closest("input[data-r]");if(ri){var r1=st[cur].rek=st[cur].rek||{},ar=r1[ri.dataset.r]=r1[ri.dataset.r]||[];ar[+ri.dataset.f]=ri.value;save();prog();return;}
  var tc=e.target.closest("textarea[data-c]");if(tc){st[cur].calc=st[cur].calc||{};st[cur].calc[tc.dataset.c]=tc.value;save();return;}
  var t=e.target.closest("textarea[data-o]");if(t){st[cur].open[t.dataset.o]=t.value;save();prog();}});

function open(k){cur=k;var a=st[k];if(!a)return start(k,true);if(a.done)return result();if(Date.now()>=a.end)return finish();exam();}
function start(k,fresh){cur=k;st[k]={mc:{},open:{},rek:{},calc:{},self:{},perm:D[k].mc.map(perm),end:Date.now()+D[k].min*60000,done:false};save();exam();window.scrollTo(0,0);}
function missing(){var a=st[cur],n=0;D[cur].mc.forEach(function(q,i){if(a.mc[i]==null)n++;});D[cur].ao.forEach(function(o){if(!(a.open[o.nr]||"").trim())n++;});rekFields(cur).forEach(function(x){var v=((a.rek||{})[x[0]]||[])[x[1]];if(v==null||v==="")n++;});return n;}
function total(){return D[cur].mc.length+D[cur].ao.length+rekFields(cur).length;}
function prog(){var n=total()-missing();var b=document.getElementById("pr");if(b){b.style.width=(n/total()*100)+"%";document.getElementById("pn").textContent=n+"/"+total();}}

/* ---------- toets maken ---------- */
function bronHtml(b){var L=b.split("\n"),h="",tb=[];L.forEach(function(l,i){if(l.indexOf(" | ")>-1||/^ ?\|/.test(l))tb.push(l.split("|"));else{if(tb.length){h+=tbl(tb);tb=[];}h+=(i===0?"<b>":"<div>")+esc(l)+(i===0?"</b>":"</div>");}});if(tb.length)h+=tbl(tb);return '<div class="bron">'+h+"</div>";}
function tbl(r){return "<table>"+r.map(function(c){return "<tr>"+c.map(function(x){return "<td>"+esc(x.trim())+"</td>";}).join("")+"</tr>";}).join("")+"</table>";}
function qtext(v){return esc(v).split("\n").join("<br>");}
/* ---------- rekenen ---------- */
function escA(s){return esc(s).replace(/"/g,"&quot;");}
function nl(x,dec){return x.toLocaleString("nl-NL",{minimumFractionDigits:dec,maximumFractionDigits:dec});}
/* Nederlands getal uit tekst: 1.892,55 | 1892.55 | € 13,33% | -0,22 ; bij meer getallen telt het laatste (het antwoord achter een =) */
function parseNL(s,klein){var t=String(s).match(/(?:[-−–]\s*)?\d[\d.]*(?:,\d+)?/g);if(!t)return NaN;t=t[t.length-1];var neg=/^[-−–]/.test(t);t=t.replace(/^[-−–]\s*/,"");
  if(t.indexOf(",")>-1)t=t.replace(/\./g,"").replace(",",".");else if(!klein&&/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,"");
  var x=parseFloat(t);return neg?-x:x;}
function fieldOk(f,v){if(v==null||v==="")return false;if(f.type==="keuze")return v===f.j;
  var x=parseNL(v,Math.max.apply(null,f.ans)<1000);if(isNaN(x))return false;if(f.abs)x=Math.abs(x);
  return f.ans.some(function(a){return Math.abs(x-a)<=(f.tol||0.005)+1e-9;});}
function dp(dl){return dl.velden.reduce(function(a,f){return a+f.p;},0);}
function rekFields(k){var a=[];D[k].rek.forEach(function(r){r.delen.forEach(function(dl){dl.velden.forEach(function(f,i){if(f.type!=="open")a.push([r.nr+dl.id,i,f]);});});});return a;}
/* punten van een deelvraag: goede velden + (als een rekenantwoord fout is) punten voor de berekening die de leerling zichzelf geeft, nooit het volle aantal */
function deelPts(r,dl){var a=((st[cur].rek||{})[r.nr+dl.id])||[],p=0,w=0;
  dl.velden.forEach(function(f,i){if(f.type==="open")return;if(fieldOk(f,a[i]))p+=f.p;else if(f.type==="num")w+=f.p;});
  var max=Math.max(w-1,0),ex=Math.min(max,+st[cur].self["x"+r.nr+dl.id]||0);return {p:p,ex:ex,max:max,ok:a};}
function rekScore(){var s=0;D[cur].rek.forEach(function(r){r.delen.forEach(function(dl){var q=deelPts(r,dl);s+=q.p+q.ex;});});return s;}
function rtbl(r){return '<table>'+r.map(function(c,i){return '<tr>'+c.map(function(x){return i?'<td>'+esc(x)+'</td>':'<th scope="col">'+esc(x)+'</th>';}).join("")+'</tr>';}).join("")+'</table>';}
function rekBron(r){return '<div class="bron"><div class="t">'+esc(r.tekst)+'</div>'+(r.tabel?rtbl(r.tabel):"")+'</div>';}
function fieldEx(r,dl,f,i){var key=r.nr+dl.id,v=((st[cur].rek||{})[key]||[])[i],lab="Opgave "+r.nr+" "+dl.id;
  if(f.type==="open")return '<label class="muted" style="font-size:13.5px" for="to-'+f.nr+'">'+esc(f.label)+'</label><textarea class="s" id="to-'+f.nr+'" data-o="'+f.nr+'" placeholder="Typ hier je antwoord">'+esc(st[cur].open[f.nr]||"")+'</textarea>';
  if(f.type==="keuze")return '<div class="stepper" role="group" aria-label="'+escA(f.label||lab)+'">'+(f.label?'<span class="muted">'+esc(f.label)+':</span>':"")+f.opties.map(function(o,j){return '<button class="w" data-rk="'+key+'" data-f="'+i+'" data-v="'+j+'" aria-pressed="'+(v===j)+'">'+esc(o)+'</button>';}).join("")+'</div>';
  var pre=f.eenh==="€"?"€":"",post=f.eenh&&!pre?f.eenh:"";
  return '<div class="ans">'+(f.label?'<label class="muted" for="rk-'+key+i+'">'+esc(f.label)+':</label>':"")+(pre?'<span>€</span>':"")+'<input class="num" type="text" inputmode="decimal" autocomplete="off" id="rk-'+key+i+'" data-r="'+key+'" data-f="'+i+'" value="'+escA(v==null?"":v)+'" aria-label="Antwoord '+lab+'">'+(post?'<span class="muted">'+esc(post)+'</span>':"")+'</div>';}
function rekEx(r){var h='<div class="card q"><div class="n">Opgave '+r.nr+' · '+r.p+' punten</div><p>'+esc(r.titel)+'</p>'+rekBron(r);
  r.delen.forEach(function(dl){h+='<div class="rk"><div class="rl">'+dl.id+') '+esc(dl.v)+' <span class="muted">('+dp(dl)+' p)</span></div>';
    dl.velden.forEach(function(f,i){h+=fieldEx(r,dl,f,i);});h+='</div>';});
  return h+'<div class="rk"><label class="muted" style="font-size:13.5px" for="rc-'+r.nr+'">Je berekening (mag ook op papier; hier wordt niets mee nagekeken)</label><textarea class="s" id="rc-'+r.nr+'" data-c="'+r.nr+'">'+esc((st[cur].calc||{})[r.nr]||"")+'</textarea></div></div>';}
function exam(){
  var d=D[cur],a=st[cur],n=0;
  var h='<div class="bar"><span class="t" id="clk">--:--</span><div class="pr"><i id="pr"></i></div><small id="pn"></small></div><div class="eyebrow" style="margin-top:18px">Oefentoets</div><h1>'+esc(d.t.replace("Oefentoets ","Toets "))+'</h1><p class="muted">'+maxPts(cur)+' punten · '+d.min+' minuten · zonder boek, een rekenmachine mag. Meerkeuze: kies één antwoord.'+(d.open.length?' Open vragen: schrijf in hele zinnen.':'')+' Rekenen: vul alleen je antwoord in, met een komma (bijvoorbeeld 12,50).</p><h2>Deel A · Meerkeuze</h2>';
  d.mc.forEach(function(q,i){n++;h+='<div class="card q fade" style="animation-delay:'+Math.min(i,8)*30+'ms"><div class="n">Vraag '+n+' · 1 punt</div><p>'+esc(q.v)+'</p><div class="opts" role="radiogroup" aria-label="Antwoorden">';
    a.perm[i].forEach(function(oi,pos){h+='<button class="opt" role="radio" aria-checked="'+(a.mc[i]===oi)+'" data-q="'+i+'" data-i="'+oi+'"><span class="l">'+"ABCD"[pos]+'</span><span>'+esc(q.o[oi])+'</span></button>';});
    h+="</div></div>";});
  if(d.open.length){h+='<h2>Deel B · Open vragen</h2>';
    d.open.forEach(function(o){h+='<div class="card q"><div class="n">Vraag '+o.nr+' · '+o.p+' punt'+(o.p>1?"en":"")+'</div>'+(o.b?bronHtml(o.b):"")+'<p>'+qtext(o.v)+'</p><textarea data-o="'+o.nr+'" aria-label="Antwoord vraag '+o.nr+'" placeholder="Typ hier je antwoord">'+esc(a.open[o.nr]||"")+'</textarea></div>';});}
  h+='<h2>Deel '+(d.open.length?"C":"B")+' · Rekenen</h2>';
  d.rek.forEach(function(r){h+=rekEx(r);});
  h+='<div class="stick"><button class="btn" id="hand">Inleveren en nakijken</button></div>';
  app.innerHTML=h;prog();clearInterval(timer);tick();timer=setInterval(tick,1000);
}
function tick(){var c=document.getElementById("clk");if(!c||!cur||!st[cur])return;var s=Math.round((st[cur].end-Date.now())/1000);c.textContent=fmt(s);c.classList.toggle("low",s<300);if(s<=0){clearInterval(timer);alert("De tijd is om. Je toets wordt nu nagekeken.");finish();}}
function finish(){clearInterval(timer);st[cur].done=true;save();result();window.scrollTo(0,0);}

/* ---------- nakijken ---------- */
function mcScore(){var a=st[cur],n=0;D[cur].mc.forEach(function(q,i){if(a.mc[i]===q.j)n++;});return n;}
function openScore(){var a=st[cur],s=0;D[cur].ao.forEach(function(o){var v=a.self[o.nr];if(boxed(o)){if(Array.isArray(v))o.g.forEach(function(g,i){if(v[i])s+=g.p;});}else if(typeof v==="number")s+=v;});return s;}
function gradeOf(p,m){return Math.round((p/m*9+1)*10)/10;}
function score(){var m=maxPts(cur),p=mcScore()+openScore()+rekScore(),g=gradeOf(p,m),el=document.getElementById("gr");if(!el)return;
  el.textContent=g.toFixed(1).replace(".",",");el.classList.toggle("bad",g<5.5);document.getElementById("pp").textContent=p%1?p.toFixed(1).replace(".",","):p;
  var n=document.getElementById("gm");n.textContent=g>=8?"Top! Jij bent er klaar voor.":g>=6.5?"Goed bezig. Kijk nog even naar je fouten.":g>=5.5?"Voldoende, maar oefen je zwakke punten nog.":"Nog even oefenen: begin bij het Oefenlab.";}
function boxed(o){return o.g.length>1||(o.g.length===1&&o.p===1);}
function nkHtml(o){var a=st[cur],v=a.self[o.nr],h=o.model?'<div class="nk"><div class="chk" style="cursor:default"><span><b>Antwoordmodel:</b> '+esc(o.model)+'</span></div></div>':"";
    if(boxed(o)){h+='<div class="nk">'+o.g.map(function(g,i){return '<label class="chk"><input type="checkbox" data-nr="'+o.nr+'" data-g="'+i+'"'+(Array.isArray(v)&&v[i]?" checked":"")+'><span>'+esc(g.t)+'</span><small>'+g.p+' p</small></label>';}).join("")+"</div>";}
    else{h+='<div class="nk">'+o.m.map(function(x){return '<div class="chk" style="cursor:default"><span>'+esc(x)+'</span></div>';}).join("")+'</div><div class="stepper"><span class="muted">Mijn punten:</span>';
      for(var p=0;p<=o.p;p++)h+='<button data-nr="'+o.nr+'" data-pt="'+p+'" aria-pressed="'+(v===p)+'">'+p+'</button>';h+="</div>";}
  return h+'<div class="aibox" id="ai-'+o.nr+'">'+aiHtml(o)+'</div>';}

/* ---------- AI-nakijker (Haiku 5.5) ---------- */
var busy={},queue=[],running=0;
/* De Worker krijgt het antwoordmodel en de let-op-regel van de docent mee in bron (vraag en puntenverdeling gaan in vraag en nakijkpunten) */
function bronAI(o){return ((o.b||"")+(o.model?"ANTWOORDMODEL VAN DE DOCENT:\n"+o.model:"")+(o.opm?"\nLET OP: "+o.opm:"")).trim().slice(0,4000);}
function aiHtml(o){var r=(st[cur].ai||{})[o.nr];if(r)return GV_NK.render(r)+(r.status!=="ok"&&GV_NK.enabled?'<button class="btn ghost" data-retry="'+o.nr+'" style="margin-top:8px">Probeer AI-nakijken opnieuw</button>':"")+(r.status==="ok"&&r.punten<r.max?beterHtml(o):"");
  return busy[cur+o.nr]?'<div class="aiwait">AI kijkt je antwoord na…</div>':"";}
/* Jouw antwoord, met de stukjes gemarkeerd die de AI als bewijs voor een punt citeerde */
function mineHtml(o){var t=st[cur].open[o.nr]||"",r=(st[cur].ai||{})[o.nr],rs=[];
  if(r&&r.status==="ok")(r.per_punt||[]).forEach(function(x){var c=(x.citaat||"").trim(),i=c&&x.punten>0?t.indexOf(c):-1;if(i>-1)rs.push([i,i+c.length,x.nr]);});
  rs.sort(function(a,b){return a[0]-b[0];});var h="",p=0;
  rs.forEach(function(x){if(x[0]<p)return;h+=esc(t.slice(p,x[0]))+'<mark class="hit" title="Punt voor nakijkpunt '+x[2]+'">'+esc(t.slice(x[0],x[1]))+'<sup>'+x[2]+'</sup></mark>';p=x[1];});
  return h+esc(t.slice(p));}
/* Verbeterronde: leren van de feedback, telt niet mee voor het cijfer, max 2 keer per vraag (kosten) */
var MAXBETER=2;
function beterHtml(o){var b=(st[cur].beter||{})[o.nr],h="";
  if(b&&b.f)h+='<div class="beter"><div class="n">Verbeterd antwoord'+(b.n>1?" (poging "+b.n+")":"")+' · telt niet mee voor je cijfer</div><div class="mine">'+esc(b.antwoord)+'</div>'+GV_NK.render(b.f)+'</div>';
  if(b&&b.bezig)return h+'<div class="aiwait">AI kijkt je verbeterde antwoord na…</div>';
  if(!b||(b.n<MAXBETER&&b.f&&b.f.status==="ok"&&b.f.punten<b.f.max)||(b.f&&b.f.status!=="ok"&&b.n<MAXBETER))
    h+='<div class="beter" id="be-'+o.nr+'"><button class="btn ghost" data-beter="'+o.nr+'">'+(b?"Nog een keer verbeteren":"Verbeter je antwoord met deze feedback")+'</button></div>';
  return h;}
function beterGo(o,ans){var a=st[cur],k=cur;a.beter=a.beter||{};var b=a.beter[o.nr]||{n:0};b.n++;b.antwoord=ans;b.bezig=1;b.f=null;a.beter[o.nr]=b;save();vernieuw(o);
  GV_NK.check({h:o.h,vak:"economie",vraag:o.v.slice(0,1500),punten:aiPunten(o),bron:bronAI(o),antwoord:ans.slice(0,2000)}).then(function(f){
    delete b.bezig;b.f=f.status==="ok"?f:{status:"fout",melding:f.melding||"De AI kon nu niet nakijken."};save();if(cur===k)vernieuw(o);});}
function vernieuw(o){var n=document.getElementById("nk-"+o.nr),m=document.getElementById("mine-"+o.nr);if(n)n.innerHTML=nkHtml(o);if(m)m.innerHTML=mineHtml(o);}
function aiPunten(o){return o.g.length?o.g.map(function(g){return {t:g.t,p:Math.round(g.p)};}):[{t:o.m.join("\n"),p:o.p}];}
function runAI(){if(!GV_NK.enabled)return;var k=cur,a=st[k];a.ai=a.ai||{};
  D[k].ao.forEach(function(o){var ans=(a.open[o.nr]||"").trim();if(!ans||a.ai[o.nr]||busy[k+o.nr])return;busy[k+o.nr]=1;queue.push([k,o,ans.slice(0,2000)]);});
  pump();}
function pump(){while(running<3&&queue.length){running++;(function(j){var k=j[0],o=j[1];
    GV_NK.check({h:o.h,vak:"economie",vraag:o.v.slice(0,1500),punten:aiPunten(o),bron:bronAI(o),antwoord:j[2]}).then(function(f){
      delete busy[k+o.nr];running--;
      if(f.status==="ok"){var a=st[k];a.ai[o.nr]=f;
        if(boxed(o))a.self[o.nr]=o.g.map(function(g,i){return f.per_punt[i]&&f.per_punt[i].punten>=f.per_punt[i].max?1:0;});else a.self[o.nr]=f.punten;}
      else if(!f.lokaal||f.melding)st[k].ai[o.nr]={status:"fout",melding:f.melding||""};
      save();
      if(cur===k&&document.getElementById("nk-"+o.nr)){vernieuw(o);score();}
      pump();});})(queue.shift());}
  if(cur)D[cur].ao.forEach(function(o){var b=document.getElementById("ai-"+o.nr);if(b&&busy[cur+o.nr])b.innerHTML=aiHtml(o);});}

function openRes(o){return '<div class="muted" style="font-size:13px">Jouw antwoord</div><div class="mine" id="mine-'+o.nr+'">'+mineHtml(o)+'</div><div class="muted" style="font-size:13px;margin-top:12px">Zo kijk je het na</div><div id="nk-'+o.nr+'">'+nkHtml(o)+'</div>';}
function fieldShow(f,v){if(v==null||v==="")return "niet ingevuld";return f.type==="keuze"?f.opties[v]:String(v).trim();}
function fieldGoed(f){if(f.type==="keuze")return f.opties[f.j];var e=f.eenh||"",eu=/^€/.test(e),post=e.replace(/^€\s*/,"");
  return f.ans.map(function(x){return (eu?"€ ":"")+nl(x,eu?2:((String(x).split(".")[1]||"").length))+(post?" "+post:"");}).join(" of ");}
function rekRes(r){var a=st[cur],h='<div class="card q"><div class="n">Opgave '+r.nr+' · '+r.p+' punten</div><p>'+esc(r.titel)+'</p>'+rekBron(r);
  r.delen.forEach(function(dl){var q=deelPts(r,dl),key=r.nr+dl.id;h+='<div class="rk"><div class="rl">'+dl.id+') '+esc(dl.v)+' <span class="muted">('+dp(dl)+' p)</span></div>';
    dl.velden.forEach(function(f,i){if(f.type==="open"){h+=openRes(f);return;}
      var ok=fieldOk(f,q.ok[i]);h+='<div class="rr '+(ok?"ok":"bad")+'"><b>'+(ok?"✓":"✗")+'</b> '+(f.label?esc(f.label)+': ':'')+'Jouw antwoord: <b>'+esc(fieldShow(f,q.ok[i]))+'</b>'+(ok?'':' · Goed: <b>'+esc(fieldGoed(f))+'</b>')+' <span class="muted">('+(ok?f.p:0)+'/'+f.p+' p)</span></div>';});
    h+='<div class="fb">'+dl.uitw.map(esc).join("<br>")+'</div>';
    if(q.max>0)h+='<div class="stepper" role="group" aria-label="Punten voor je berekening bij '+r.nr+dl.id+'"><span class="muted">Klopt je berekening? Punten voor je berekening:</span>'+Array.apply(null,Array(q.max+1)).map(function(_,p){return '<button data-xk="'+key+'" data-xp="'+p+'" aria-pressed="'+(q.ex===p)+'">'+p+'</button>';}).join("")+'</div>';
    h+='</div>';});
  var c=(a.calc||{})[r.nr];if(c&&c.trim())h+='<div class="rk"><div class="muted" style="font-size:13px">Jouw berekening</div><div class="mine">'+esc(c)+'</div></div>';
  return h+'</div>';}
function result(){
  var d=D[cur],a=st[cur],m=maxPts(cur);
  var h='<a class="muted" href="#" id="home">← Andere toets kiezen</a><div class="card res fade" style="margin-top:16px"><div class="eyebrow">Je cijfer'+(d.open.length?' (voorlopig, tot je de open vragen hebt nagekeken)':'')+'</div><div class="grade" id="gr">-</div><p><b id="pp">0</b> van <b>'+m+'</b> punten · meerkeuze '+mcScore()+'/'+d.mc.length+'</p><p class="muted" id="gm" style="margin:0"></p><p class="muted" style="font-size:14px;margin:10px 0 0">Cijfer = punten : '+m+' × 9 + 1. Meerkeuze en rekenen zijn nagekeken met het nakijkblad'+(d.open.length?'; bij de open vragen kijkt de AI mee en kun jij de vinkjes nog aanpassen':'')+'. Foute rekenantwoorden: geef jezelf de punten die je berekening waard is.</p></div><h2>Meerkeuze nagekeken</h2>';
  d.mc.forEach(function(q,i){var ok=a.mc[i]===q.j;h+='<div class="card q"><div class="n">Vraag '+(i+1)+(ok?" · goed":(a.mc[i]==null?" · niet beantwoord":" · fout"))+'</div><p>'+esc(q.v)+'</p><div class="opts">';
    a.perm[i].forEach(function(oi,pos){var c=oi===q.j?" right":(a.mc[i]===oi?" wrong":"");h+='<div class="opt'+c+'" style="cursor:default"><span class="l">'+"ABCD"[pos]+'</span><span>'+esc(q.o[oi])+'</span></div>';});
    h+='</div>'+(q.u?'<div class="fb">'+esc(q.u)+'</div>':"")+'</div>';});
  if(d.open.length){h+='<h2>Open vragen nakijken</h2>';
    d.open.forEach(function(o){h+='<div class="card q"><div class="n">Vraag '+o.nr+' · '+o.p+' punt'+(o.p>1?"en":"")+'</div>'+(o.b?bronHtml(o.b):"")+'<p>'+qtext(o.v)+'</p>'+openRes(o)+'</div>';});}
  h+='<h2>Rekenen nagekeken</h2>';
  d.rek.forEach(function(r){h+=rekRes(r);});
  h+='<div style="margin-top:26px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="again">Deze toets opnieuw maken</button><a class="btn" href="app.html#lab">Oefen verder in het Oefenlab</a></div>';
  app.innerHTML=h;score();runAI();
}
load();
var m=/[?&]t=(t[1-4])/.exec(location.search);
if(m&&D[m[1]])open(m[1]);else home();
})();
</script>
