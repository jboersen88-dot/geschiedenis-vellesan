.eind h2{font-size:clamp(30px,5.5vmin,52px);text-align:center;}
.statrij.vier{grid-template-columns:repeat(4,1fr);}
.record{text-align:center;font-size:clamp(17px,2.6vmin,24px);}
.record.nieuw{color:#C2410C;font-size:clamp(22px,3.6vmin,34px);animation:knipper2 .5s infinite alternate;}
@keyframes knipper2{to{transform:scale(1.06)}}
.rente{background:#E9FBF2;border:3px solid var(--groen);border-radius:14px;padding:8px 12px;font-size:clamp(15px,2.3vmin,20px);font-weight:700;text-align:center;}
.oefen{flex:1;min-height:90px;display:flex;flex-direction:column;gap:8px;}
.oefen-item{background:#fff;border:3px solid var(--inkt);border-radius:14px;padding:8px 12px;font-weight:700;font-size:clamp(14px,2.1vmin,18px);line-height:1.3;}
.oefen-item b{display:block;font-weight:900;}
.oefen-item .ant{color:#13804A;}
.codevak{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(22px,4vmin,34px);letter-spacing:2px;background:#fff;border:3px dashed var(--inkt);border-radius:14px;padding:8px 14px;text-align:center;user-select:text;-webkit-user-select:text;}

/* garage en auto kiezen */
.paneel-kop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.paneel-kop h2{flex:1;font-size:clamp(28px,4.6vmin,44px);}
.garage-inhoud{display:flex;flex-direction:column;gap:18px;padding-right:4px;flex:1;}
.garage-inhoud h3{font-size:clamp(20px,3vmin,28px);margin-bottom:8px;}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.item{background:#fff;border:3px solid var(--inkt);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  box-shadow:0 4px 0 var(--inkt);min-height:64px;touch-action:manipulation;}
.item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--inkt);}
.item.gekozen{background:#FFF1B8;outline:4px solid var(--oranje);}
.item .naam{font-size:16px;}
.item .prijs{font-size:14px;font-weight:700;}
.item .prijs.te-duur{color:#B91C1C;}
.upgrade{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--inkt);border-radius:16px;padding:10px 12px;flex-wrap:wrap;}
.upgrade div{flex:1;min-width:180px;}
.upgrade small{display:block;font-weight:700;opacity:.8;font-size:14px;}
.spaar-rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.spaar-rij span{min-width:6em;}
.kleurbol{width:56px;height:56px;border-radius:50%;border:4px solid var(--inkt);}
input.code{font:inherit;font-size:clamp(20px,3.6vmin,30px);letter-spacing:2px;text-transform:uppercase;padding:10px 14px;border:var(--rand);border-radius:14px;width:100%;
  text-align:center;user-select:text;-webkit-user-select:text;touch-action:manipulation;}
.melding-tekst{min-height:1.4em;text-align:center;font-weight:800;}
.melding-tekst.fout{color:#B91C1C;} .melding-tekst.goed{color:#13804A;}

@media (max-height:820px){ .verberg-laag{display:none !important;} }
@media (max-height:620px){
  :root{--hud:76px;}
  .hud-blok{height:56px;}
}
@media (max-width:560px){
  .swipe{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;}
  .swipe-midden{grid-column:1 / 3;grid-row:1;}
  .bak.links{grid-column:1;grid-row:2;min-height:84px;} .bak.rechts{grid-column:2;grid-row:2;min-height:84px;}
  .statrij.vier{grid-template-columns:repeat(2,1fr);}
  .hud-punten small{display:none;}
}
.gepauzeerd *{animation-play-state:paused !important;}

<script>
// ===== VANAF HIER NIETS AANPASSEN =====
(function () {

 'quizSeconden', 'snelheidsStijgingPerTankstop', 'maxSnelheidFactor', 'spaarrentePerPotje'].forEach(function (k) {
  if (!(+INST[k] >= 0)) INST[k] = STANDAARD[k]; else INST[k] = +INST[k];
});
if (!INST.valtijdPerNiveau || typeof INST.valtijdPerNiveau !== 'object') INST.valtijdPerNiveau = STANDAARD.valtijdPerNiveau;

var METER_PER_BAAN = 10;      // 1 baanbreedte = 10 meter
var BASIS_SNELHEID = 2.8;     // banen per seconde bij de start
var N = INST.vragenPerTankstop;
var TEST = /[?&]test/.test(location.search);

function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function willekeurig(a, b) { return a + Math.random() * (b - a); }
function kies(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function getal(x) { try { return Math.round(x).toLocaleString('nl-NL'); } catch (e) { return String(Math.round(x)); } }

function kortje(s) { s = String(s); return s.length > 45 ? s.slice(0, 42) + '…' : s; }

var ICOON = {
  pomp: '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M4 3h9a1 1 0 0 1 1 1v7h1.5A2.5 2.5 0 0 1 18 13.5V18a1 1 0 0 0 2 0V9.4l-2.7-2.7 1.4-1.4 3 3c.2.2.3.4.3.7V18a3 3 0 0 1-6 0v-4.5a.5.5 0 0 0-.5-.5H14v7h1v2H2v-2h1V4a1 1 0 0 1 1-1zm2 3v4h6V6H6z"/></svg>',
  schild: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" stroke="#2B1650" stroke-width="1.6" d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/></svg>',
  geluidAan: '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3V9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
  geluidUit: '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3V9z"/><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>'
};

/* =====================================================================
   2. CONTROLE VAN DE VRAGENLIJST
   ===================================================================== */
var MINIGAMES = {
  quiz:     { naam: 'Quiz',             uitleg: 'Tik het goede antwoord aan voordat de tijd op is!' },
  swipen:   { naam: 'Swipen',           uitleg: 'Veeg elk kaartje naar de goede bak (of tik op de bak).' },
  vallen:   { naam: 'Vallende blokken', uitleg: 'Tik het goede antwoord aan voordat het blok de grond raakt!' },
  poorten:  { naam: 'Poortenrace',      uitleg: 'Stuur door de poort met het goede antwoord!' },
  koppelen: { naam: 'Koppelen',         uitleg: 'Tik een begrip en daarna de omschrijving die erbij hoort.' }
};

function controleerInvoer() {
  var meldingen = [];

    var f = window.__invoerFout;

      'Het spel kan de vragenlijst niet lezen. Waarschijnlijk is er een komma, haakje of aanhalingsteken (") weggevallen of te veel' +

  }
  var vragen = [], sets = [], ids = {};
  if (!Array.isArray(VRAGEN)) meldingen.push('VRAGEN is geen lijst. De vragen moeten tussen [ en ] staan.');

    var nr = 'Vraag ' + (i + 1) + (v && isTekst(v.vraag) ? ' ("' + kortje(v.vraag) + '")' : '');

    var p = [];
    if (!isTekst(v.vraag)) p.push('de vraag ontbreekt');
    if (!isTekst(v.goed)) p.push('het goede antwoord (goed) ontbreekt');

    if (v.kort != null) {
      var k = v.kort;

        p.push('bij "kort" moeten een begrip, een goed antwoord en precies 3 foute antwoorden staan');

function beheerst(item) { var s = stat(item); return !!(s && s.r >= 2); }

/* ---------- bewaarcode (16 tekens met controlegetal) ---------- */
var B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
var MASKER = BigInt('0x5A3C96E17B2D4F08C3A5');

/* =====================================================================
   8. WELKE VRAAG KOMT ER? (herhaling en niveaus)
   ===================================================================== */
function niveausVoorStop(nr) { return nr <= 2 ? [1] : nr <= 4 ? [1, 2] : [1, 2, 3]; }
function prioriteit(item) {
  var s = stat(item);
  if (!s || !s.n) return 0;   // nog nooit gesteld
  return s.l ? 2 : 1;          // laatst fout = 1, laatst goed = 2
}
function sorteerOpPrioriteit(lijst) {
  return lijst.map(function (it) { var s = stat(it); return { it: it, p: prioriteit(it), t: s ? s.t : 0, r: Math.random() }; })
    .sort(function (a, b) { return a.p - b.p || a.t - b.t || a.r - b.r; })
    .map(function (x) { return x.it; });
}
function kiesVragen(aantal, eis) {
  eis = eis || {};
  var gekozen = [], niv = niveausVoorStop(spel.stopNr);
  function past(v) {
    if (gekozen.indexOf(v) >= 0) return false;
    if (eis.kort && !v.kort) return false;
    if (eis.uniek) {
      for (var i = 0; i < gekozen.length; i++) {
        var a = gekozen[i].kort, b = v.kort;
        if (a.goed.toLowerCase() === b.goed.toLowerCase() || a.begrip.toLowerCase() === b.begrip.toLowerCase() ||
            a.goed.toLowerCase() === b.begrip.toLowerCase() || a.begrip.toLowerCase() === b.goed.toLowerCase()) return false;
      }
    }
    return true;
  }

  var wachtend = {};
  sessie.terug.forEach(function (t) { wachtend[t.id] = true; });
  var basis = sorteerOpPrioriteit(ALLE_VRAGEN.filter(function (v) { return niv.indexOf(v.niveau) >= 0 && !wachtend[v.id]; }));
  var aanvul = sorteerOpPrioriteit(ALLE_VRAGEN.filter(function (v) { return niv.indexOf(v.niveau) < 0 && !wachtend[v.id]; }));
  for (var k = 0; k < aantal; k++) {
    var keuze = null;
    for (var i = 0; i < terug.length && !keuze; i++) {
      var v = VRAAG_OP_ID[terug[i].id];
      if (v && terug[i].vanaf <= sessie.teller + k && past(v)) keuze = v;
    }
    for (var j = 0; j < basis.length && !keuze; j++) if (past(basis[j])) keuze = basis[j];
    for (var m = 0; m < aanvul.length && !keuze; m++) if (past(aanvul[m])) keuze = aanvul[m];
    if (!keuze) for (var q = 0; q < terug.length && !keuze; q++) { var v2 = VRAAG_OP_ID[terug[q].id]; if (v2 && past(v2)) keuze = v2; }
    if (!keuze) break;
    gekozen.push(keuze);
  }

}

  var score = kandidaten.map(function (i) {
    var open = SETS[i].kaartjes.filter(function (k) { return !beheerst(k); }).length;
    return { i: i, s: open + Math.random() * 4 + (vorige && SETS[i].hoofdstuk !== vorige.hoofdstuk ? 3 : 0) };
  }).sort(function (a, b) { return b.s - a.s; });

  sessie.teller++;

  if (!goed) {
    if (item.soort === 'vraag') sessie.terug.push({ id: item.id, vanaf: sessie.teller + 2 + Math.floor(Math.random() * 3) });

/* ---------- 9d. Poortenrace ---------- */
var POORT_KLEUREN = ['#FFD23F', '#4FD8D2', '#FFA463', '#C4A8FF', '#FF8FC0', '#A3E635'];

    var leeg; do { leeg = Math.floor(Math.random() * L); } while (leeg === vorigLeeg && L > 1);
    vorigLeeg = leeg;

    for (var b2 = 0; b2 < L; b2++) banen.push(vrijeBanen.indexOf(b2) >= 0 ? opties[k++] : null);
    var aR = app.getBoundingClientRect(), vR = vraagEl.getBoundingClientRect();

function tekstRegels(c, tekst, maxB) {

}

  if (y < -b * 2 || y > H + b * 2) return;
  var h = b * 0.95, kleurNr = 0;

    if (t == null) return;
    var x = weg.x + i * b, kleur = POORT_KLEUREN[kleurNr++ % POORT_KLEUREN.length];

  }
  if (profiel.auto > 2) profiel.auto = 0;
  if (profiel.lak > 3) profiel.lak = 0;
  teken();
  $$('[data-auto]', s).forEach(function (b) { b.addEventListener('click', function () { profiel.auto = +b.dataset.auto; GELUID.tik(); teken(); }); });
  $$('[data-lak]', s).forEach(function (b) { b.addEventListener('click', function () { profiel.lak = +b.dataset.lak; GELUID.tik(); teken(); }); });
  $('#b-kies-klaar').addEventListener('click', function () { profiel.gekozen = true; bewaar(); zorgAudio(); toonStart(); });
}

var garageTerug = 'start', wisBevestig = false;
function toonGarage(terug) {
  if (terug) garageTerug = terug;
  var s = $('#s-garage');
  var autos = AUTOS.map(function (a, i) {
    var bezit = heeftAuto(i), gekozen = i === profiel.auto;
    var label = gekozen ? 'Gekozen' : bezit ? 'Kies' : 'Koop ' + euro(a.prijs);
    return '<button class="item' + (gekozen ? ' gekozen' : '') + '" data-auto="' + i + '"><canvas width="60" height="80" style="width:60px;height:80px"></canvas>' +
      '<span class="naam">' + a.naam + '</span><span class="prijs' + (!bezit && profiel.contant < a.prijs ? ' te-duur' : '') + '">' + label + '</span></button>';
  }).join('');
  var lakken = LAKKEN.map(function (k, i) {
    var bezit = heeftLak(i), gekozen = i === profiel.lak;
    var label = gekozen ? 'Gekozen' : bezit ? 'Kies' : 'Koop ' + euro(k.prijs);
    return '<button class="item' + (gekozen ? ' gekozen' : '') + '" data-lak="' + i + '"><canvas width="60" height="80" style="width:60px;height:80px"></canvas>' +
      '<span class="naam">' + k.naam + '</span><span class="prijs' + (!bezit && profiel.contant < k.prijs ? ' te-duur' : '') + '">' + label + '</span></button>';
  }).join('');
  var tn = profiel.tankNiveau || 0;
  var pct = Math.round(INST.spaarrentePerPotje * 1000) / 10;
  s.innerHTML = '<div class="paneel breed" style="height:100%">' +
    '<div class="paneel-kop"><h2>Garage</h2><span class="chip">Contant: <b>' + euro(profiel.contant) + '</b></span>' +
    '<button class="knop" id="b-garage-klaar">Klaar</button></div>' +
    '<div class="scroll garage-inhoud">' +
    '<section><h3>Auto\'s</h3><div class="raster">' + autos + '</div><p class="klein" style="margin-top:6px">Een andere auto ziet er anders uit, maar rijdt hetzelfde.</p></section>' +
    '<section><h3>Kleuren en stickers</h3><div class="raster">' + lakken + '</div></section>' +
    '<section><h3>Upgrades</h3>' +
      '<div class="upgrade"><div>Grotere tank, stap 1<small>Je tank kan tot 110% vol.</small></div>' +
        (tn >= 1 ? '<span class="chip groen">Gekocht</span>' : '<button class="knop" data-koop="tank1"' + (profiel.contant < TANK_PRIJS[0] ? ' disabled' : '') + '>Koop ' + euro(TANK_PRIJS[0]) + '</button>') + '</div>' +
      '<div class="upgrade" style="margin-top:8px"><div>Grotere tank, stap 2<small>Je tank kan tot 120% vol (eerst stap 1 kopen).</small></div>' +
        (tn >= 2 ? '<span class="chip groen">Gekocht</span>' : '<button class="knop" data-koop="tank2"' + (tn < 1 || profiel.contant < TANK_PRIJS[1] ? ' disabled' : '') + '>Koop ' + euro(TANK_PRIJS[1]) + '</button>') + '</div>' +
      '<div class="upgrade" style="margin-top:8px"><div>Schild bij de start<small>Geldt voor één potje: je eerste botsing kost niets.</small></div>' +
        (profiel.startSchild ? '<span class="chip groen">Klaar voor je volgende potje</span>' : '<button class="knop" data-koop="schild"' + (profiel.contant < SCHILD_PRIJS ? ' disabled' : '') + '>Koop ' + euro(SCHILD_PRIJS) + '</button>') + '</div>' +
    '</section>' +
    '<section><h3>Spaarrekening</h3>' +
      '<div class="upgrade"><div>Saldo spaarrekening: <b>' + euro(profiel.spaar) + '</b> – rente vorige keer: <b>' + euro(profiel.renteVorige) + '</b>' +
      '<small>Na elk gespeeld potje krijg je ' + String(pct).replace('.', ',') + '% samengestelde rente over je spaargeld. Alleen contant geld kun je uitgeven.</small></div></div>' +
      '<div class="spaar-rij"><span>Storten:</span><button class="knop turq" data-stort="10">€10</button><button class="knop turq" data-stort="50">€50</button><button class="knop turq" data-stort="alles">Alles</button></div>' +
      '<div class="spaar-rij"><span>Opnemen:</span><button class="knop oranje" data-neem="10">€10</button><button class="knop oranje" data-neem="50">€50</button><button class="knop oranje" data-neem="alles">Alles</button></div>' +
    '</section>' +
    '<section><h3>Bewaarcode</h3><p class="klein">Met deze code haal je je euro\'s (afgerond op hele euro\'s), spaargeld, spullen en record terug, ook op een ander apparaat.</p>' +
      '<div class="rij" style="margin-top:8px"><button class="knop wit" id="b-toon-code">Toon bewaarcode</button><div class="codevak" id="code-vak" style="display:none"></div></div></section>' +
    '<section><h3>Alles wissen</h3><p class="klein">Voor als deze iPad naar een andere leerling gaat. Al je geld, spullen en voortgang zijn dan weg.</p>' +
      '<button class="knop rood" id="b-wis" style="margin-top:8px">Alles wissen</button></section>' +
    '</div></div>';
  toonScherm('s-garage');
  $$('[data-auto]', s).forEach(function (b) { tekenVoorbeeld($('canvas', b), +b.dataset.auto, profiel.lak); });
  $$('[data-lak]', s).forEach(function (b) { tekenVoorbeeld($('canvas', b), profiel.auto, +b.dataset.lak); });
  $('#b-garage-klaar').addEventListener('click', function () { wisBevestig = false; if (garageTerug === 'eind') toonEind(true); else toonStart(); });
  $$('[data-auto]', s).forEach(function (b) { b.addEventListener('click', function () { koopOfKies('auto', +b.dataset.auto); }); });
  $$('[data-lak]', s).forEach(function (b) { b.addEventListener('click', function () { koopOfKies('lak', +b.dataset.lak); }); });
  $$('[data-koop]', s).forEach(function (b) { b.addEventListener('click', function () { koopUpgrade(b.dataset.koop); }); });
  $$('[data-stort]', s).forEach(function (b) { b.addEventListener('click', function () { boek(b.dataset.stort, 1); }); });
  $$('[data-neem]', s).forEach(function (b) { b.addEventListener('click', function () { boek(b.dataset.neem, -1); }); });
  $('#b-toon-code').addEventListener('click', function () { var v = $('#code-vak'); v.textContent = maakCode(); v.style.display = 'block'; });
  var wis = $('#b-wis');
  wis.addEventListener('click', function () {
    if (!wisBevestig) { wisBevestig = true; wis.textContent = 'Weet je het zeker? Tik nog een keer'; setTimeout(function () { wisBevestig = false; if (wis.isConnected) wis.textContent = 'Alles wissen'; }, 4000); return; }
    wisBevestig = false;
    try { localStorage.removeItem(SLEUTEL); } catch (e) {}
    var geluid = profiel.geluid; profiel = nieuwProfiel(); profiel.geluid = geluid;
    melding('Alles is gewist'); toonKies();
  });
}
function koopOfKies(soort, i) {
  var lijst = soort === 'auto' ? AUTOS : LAKKEN, bezit = soort === 'auto' ? heeftAuto(i) : heeftLak(i), item = lijst[i];
  if (!bezit) {
    if (profiel.contant < item.prijs) { melding('Je hebt nog ' + euro(item.prijs - profiel.contant) + ' te weinig'); GELUID.fout(); return; }
    profiel.contant = rond2(profiel.contant - item.prijs);
    (soort === 'auto' ? profiel.autos : profiel.lakken)[item.id] = true;
    melding(item.naam + ' gekocht!'); GELUID.goed();
  } else GELUID.tik();
  if (soort === 'auto') profiel.auto = i; else profiel.lak = i;
  bewaar(); toonGarage();
}
function koopUpgrade(wat) {
  var prijs = wat === 'tank1' ? TANK_PRIJS[0] : wat === 'tank2' ? TANK_PRIJS[1] : SCHILD_PRIJS;
  if (profiel.contant < prijs) return;
  if (wat === 'tank1' && profiel.tankNiveau >= 1) return;
  if (wat === 'tank2' && profiel.tankNiveau !== 1) return;
  if (wat === 'schild' && profiel.startSchild) return;
  profiel.contant = rond2(profiel.contant - prijs);
  if (wat === 'tank1') profiel.tankNiveau = 1;
  else if (wat === 'tank2') profiel.tankNiveau = 2;
  else profiel.startSchild = true;
  GELUID.goed(); melding('Gekocht!'); bewaar(); toonGarage();
}
function boek(bedrag, richting) {
  var bron = richting > 0 ? profiel.contant : profiel.spaar;
  var b = bedrag === 'alles' ? bron : Math.min(+bedrag, bron);
  b = rond2(b);
  if (b <= 0) { melding(richting > 0 ? 'Je hebt geen contant geld' : 'Er staat niets op je spaarrekening'); return; }
  profiel.contant = rond2(profiel.contant - richting * b); profiel.spaar = rond2(profiel.spaar + richting * b);
  GELUID.munt(); melding((richting > 0 ? 'Gestort: ' : 'Opgenomen: ') + euro(b)); bewaar(); toonGarage();
}

function toonCodeInvoer() {
  var s = $('#s-code');
  s.innerHTML = '<div class="paneel"><h2>Bewaarcode invoeren</h2>' +
    '<p class="klein">Typ je code van 16 tekens. De streepjes mag je weglaten.</p>' +
    '<input class="code" id="code-in" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">' +
    '<div class="melding-tekst" id="code-uit"></div>' +
    '<div class="rij"><button class="knop" id="b-code-ok" style="flex:1">Terughalen</button><button class="knop wit" id="b-code-terug">Terug</button></div></div>';
  toonScherm('s-code');
  var inp = $('#code-in'), uit = $('#code-uit');
  setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
  function probeer() {
    var w = leesCode(inp.value);
    if (!w) { uit.className = 'melding-tekst fout'; uit.textContent = 'Deze code klopt niet. Kijk nog eens goed of je hem goed hebt overgetypt.'; GELUID.fout(); return; }
    pasCodeToe(w); uit.className = 'melding-tekst goed'; uit.textContent = 'Gelukt! Je spullen zijn terug.'; GELUID.goed();
    setTimeout(toonStart, 1200);
  }
  $('#b-code-ok').addEventListener('click', probeer);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') probeer(); e.stopPropagation(); });
  $('#b-code-terug').addEventListener('click', toonStart);
}

/* ---------- spel starten en stoppen ---------- */
function startSpel() {
  timers = []; confetti = [];
  nieuwSpel(); laatsteHud = '';
  verbergSchermen(); $('#hud').classList.add('aan'); zetGeluidKnop(); updateHud();
  mgEl.className = ''; mgEl.innerHTML = '';
  if (spel.schild) melding('Je start met een schild!', 2);
  staat = 'aftellen';
  var el = $('#aftel'), stappen = ['3', '2', '1', 'Rijden!'], n = 0;
  el.classList.add('aan');
  function stap() {
    if (n >= stappen.length) { el.classList.remove('aan'); el.innerHTML = ''; staat = 'race'; return; }
    el.innerHTML = '<span>' + stappen[n] + '</span>';
    if (n < 3) GELUID.tik(); else GELUID.start();
    n++; wacht(n === stappen.length ? 0.5 : 0.7, stap);
  }
  stap();
}

var eindData = null;
function gameOver() {
  staat = 'gameover'; zetBord(''); hud.tank.classList.remove('laag');
  spel.eindReden = 'leeg';
  var oud = profiel.spaar, nieuw = rond2(oud * (1 + INST.spaarrentePerPotje));
  profiel.renteVorige = rond2(nieuw - oud); profiel.spaar = nieuw;
  var nieuwRecord = spel.punten > profiel.record;
  if (nieuwRecord) profiel.record = spel.punten;
  eindData = { punten: spel.punten, meters: spel.afgelegd * METER_PER_BAAN, euro: spel.euro, tankstops: spel.tankstops,
    record: profiel.record, nieuwRecord: nieuwRecord, oud: oud, nieuw: nieuw, fout: sessie.fout.slice() };
  bewaar();
  melding('Je tank is leeg!', 1.6);
  wacht(1.6, function () { toonEind(false); });
}
function toonEind(terugUitGarage) {
  if (!eindData) return toonStart();
  staat = 'menu'; $('#hud').classList.remove('aan'); mgEl.className = ''; mgEl.innerHTML = '';
  var d = eindData, pct = String(Math.round(INST.spaarrentePerPotje * 1000) / 10).replace('.', ',');
  var km = (d.meters / 1000).toFixed(1).replace('.', ',') + ' km';
  var rente = d.oud > 0 ? 'Je spaargeld groeide van ' + euro(d.oud) + ' naar ' + euro(d.nieuw) + '.'
    : 'Tip: zet geld op je spaarrekening in de garage. Na elk potje krijg je ' + pct + '% rente.';
  var oefen = d.fout.length ? d.fout.map(function (it) {
    if (it.soort === 'kaart') {
      var set = SETS.filter(function (s) { return s.kaartjes.indexOf(it) >= 0; })[0];
      return '<div class="oefen-item"><b>' + esc(it.tekst) + '</b><span class="ant">Hoort bij: ' + esc(set ? (it.bak === 'links' ? set.links : set.rechts) : it.bak) + '</span><br>' + esc(it.uitleg) + '</div>';
    }
    return '<div class="oefen-item"><b>' + esc(it.vraag) + '</b><span class="ant">Goed antwoord: ' + esc(it.goed) + '</span><br>' + esc(it.uitleg) + '</div>';
  }).join('') : '<div class="oefen-item">Je had dit potje niets fout. Knap gedaan!</div>';
  var s = $('#s-eind');
  s.innerHTML = '<div class="paneel eind" style="max-height:100%">' +
    '<h2>Game over</h2>' +
    '<div class="statrij vier"><div class="stat"><small>Score</small><b>' + getal(d.punten) + '</b></div>' +
    '<div class="stat"><small>Afstand</small><b>' + km + '</b></div>' +
    '<div class="stat"><small>Verdiend</small><b>' + euro(d.euro) + '</b></div>' +
    '<div class="stat"><small>Tankstops</small><b>' + d.tankstops + '</b></div></div>' +
    (d.nieuwRecord ? '<div class="record nieuw">Nieuw record: ' + getal(d.record) + '!</div>' : '<div class="record">Record: ' + getal(d.record) + '</div>') +
    '<div class="rente">' + rente + '</div>' +
    '<h3>Dit moet je nog oefenen</h3><div class="scroll oefen">' + oefen + '</div>' +
    (opslagWerkt ? '' : '<div class="waarschuwing">Dit apparaat bewaart je spullen niet. Schrijf je bewaarcode op: <div class="codevak">' + maakCode() + '</div></div>') +
    '<div class="rij"><button class="knop" id="b-opnieuw" style="flex:1">Opnieuw spelen</button>' +
    '<button class="knop turq" id="b-eind-garage">Garage</button><button class="knop wit" id="b-eind-start">Startscherm</button></div></div>';
  toonScherm('s-eind');
  if (d.nieuwRecord && !terugUitGarage) { strooiConfetti(); d.nieuwRecordGevierd = true; }
  $('#b-opnieuw').addEventListener('click', function () { zorgAudio(); startSpel(); });
  $('#b-eind-garage').addEventListener('click', function () { toonGarage('eind'); });
  $('#b-eind-start').addEventListener('click', function () { eindData = null; toonStart(); });
}

/* ---------- pauze ---------- */
function pauzeer() {
  if (gepauzeerd || !spel || staat === 'menu' || staat === 'gameover') return;
  gepauzeerd = true; document.body.classList.add('gepauzeerd');
  var s = $('#s-pauze');
  s.innerHTML = '<div class="paneel" style="align-items:center;text-align:center"><h2 style="font-size:clamp(30px,5vmin,48px)">Pauze</h2>' +
    '<p>Het spel staat stil.</p><button class="knop groot" id="b-verder">Verder</button></div>';
  toonScherm('s-pauze');
  $('#b-verder').addEventListener('click', function () {
    zorgAudio(); gepauzeerd = false; document.body.classList.remove('gepauzeerd'); toonScherm(''); vorige = performance.now();
  });
}
document.addEventListener('visibilitychange', function () { if (document.hidden) { pauzeer(); bewaar(); } });
window.addEventListener('pagehide', bewaar);

/* =====================================================================
   11. BESTURING
   ===================================================================== */
var vegen = {};
canvas.addEventListener('pointerdown', function (e) {
  zorgAudio();
  if (!kanSturen()) return;
  e.preventDefault();
  vegen[e.pointerId] = { x: e.clientX, y: e.clientY, klaar: false };
});
canvas.addEventListener('pointermove', function (e) {
  var v = vegen[e.pointerId];
  if (!v || v.klaar) return;
  var dx = e.clientX - v.x, dy = e.clientY - v.y;
  if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) { wisselBaan(dx < 0 ? -1 : 1); v.klaar = true; }
});
canvas.addEventListener('pointerup', function (e) {
  var v = vegen[e.pointerId];
  delete vegen[e.pointerId];
  if (!v || v.klaar) return;
  var r = canvas.getBoundingClientRect();
  wisselBaan(e.clientX - r.left < r.width / 2 ? -1 : 1);
});
canvas.addEventListener('pointercancel', function (e) { delete vegen[e.pointerId]; });
document.addEventListener('pointerdown', zorgAudio, true);
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'INPUT') return;
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
    if (mg && mg.toets && mg.type === 'swipen') mg.toets('links'); else wisselBaan(-1);
    e.preventDefault();
  } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
    if (mg && mg.toets && mg.type === 'swipen') mg.toets('rechts'); else wisselBaan(1);
    e.preventDefault();
  } else if (/^[1-4]$/.test(k) && mg && mg.toets && mg.type !== 'swipen') {
    mg.toets(+k - 1);
  } else if ((k === 'p' || k === 'P' || k === 'Escape') && (staat === 'race' || staat === 'minigame')) {
    if (!gepauzeerd) pauzeer();
  }
});
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { if (e.target === canvas) e.preventDefault(); });

/* =====================================================================
   12. HOOFDLUS
   ===================================================================== */
var vorige = performance.now();
function lus(nu) {
  var dt = (nu - vorige) / 1000; vorige = nu;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  stapLogica(dt);
  tekenRace();
  tekenConfetti();
  requestAnimationFrame(lus);
}
function stapLogica(dt) {
  if (!gepauzeerd) {
    klok += dt;
    verwerkTimers(dt);
    if (spel && (staat === 'race' || staat === 'aftellen' || staat === 'minigame' || staat === 'resultaat' || staat === 'gameover')) {
      if (staat === 'race' || (staat === 'minigame' && mg && mg.type === 'poorten')) updateRace(dt);
      if (mg && mg.update) mg.update(dt);
      if (mg && mg.uitlegTik) mg.uitlegTik(dt);
    } else if (!spel) {
      menuAfstand += 1.1 * dt; vulDecor(menuAfstand);
    }
    updateConfetti(dt);
  }
}

/* ---------- start ---------- */
window.addEventListener('resize', schaal);
window.addEventListener('orientationchange', function () { setTimeout(schaal, 200); });
schaal();
document.title = INST.titel + (INST.ondertitel ? ' – ' + INST.ondertitel : '');
if (invoer.meldingen && invoer.meldingen.length) toonFoutScherm(); else naarBegin();
requestAnimationFrame(lus);

if (TEST) {
  window.EDU = {
    get spel() { return spel; }, get profiel() { return profiel; }, get staat() { return staat; }, get mg() { return mg; }, get sessie() { return sessie; },
    vragen: ALLE_VRAGEN, sets: SETS, rotatie: ROTATIE, invoer: invoer, maakCode: maakCode, leesCode: leesCode,
    tankstop: function () { if (spel && staat === 'race') spel.rijTijd = INST.secondenTussenTankstops; },
    benzine: function (x) { if (spel) spel.benzine = x; },
    geld: function (x) { profiel.contant = x; bewaar(); },
    opslagUit: function () { opslagWerkt = false; },
    tik: function (sec) { for (var i = 0; i < Math.round(sec * 60); i++) stapLogica(1 / 60); tekenRace(); tekenConfetti(); return staat; }
  };
}
})();
